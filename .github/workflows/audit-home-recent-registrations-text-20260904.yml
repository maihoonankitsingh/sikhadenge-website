name: Audit Home Recent Registrations Text 20260904
on:
  push:
    paths:
      - '.github/workflows/audit-home-recent-registrations-text-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Find exact live text occurrence
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          echo "LIVE=$LIVE"
          python3 - "$LIVE" <<'PY'
          from pathlib import Path
          import sys,re
          root=Path(sys.argv[1])
          exts={'.tsx','.ts','.jsx','.js','.css','.json'}
          hits=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in exts or '.next' in p.parts or 'node_modules' in p.parts:
                  continue
              try: txt=p.read_text(encoding='utf-8')
              except Exception: continue
              for i,line in enumerate(txt.splitlines(),1):
                  if re.search(r'recent registrations', line, re.I):
                      hits.append((str(p.relative_to(root)),i,line.strip()))
          print('HIT_COUNT=',len(hits))
          for h in hits: print('HIT=',h)
          if len(hits)!=1:
              raise SystemExit(f'expected exactly one live source occurrence, found {len(hits)}')
          PY
          REMOTE
