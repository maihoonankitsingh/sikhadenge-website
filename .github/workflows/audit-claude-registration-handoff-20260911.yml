name: Audit Claude Registration First Paint 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-registration-handoff-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 18
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only Golden gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(sikhadenge-funnel-lockctl status | awk -F= '/^LOCK_STATE=/{print $2}')" = LOCKED
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          REMOTE

      - name: First-paint browser timing audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['mobile',390,844,true]]){
              const p=await browser.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              await p.evaluateOnNewDocument(()=>{
                const path='/gen-ai-masterclass/register-one-step';
                const vis=el=>{if(!el)return false;const cs=getComputedStyle(el),r=el.getBoundingClientRect();return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity||1)>0&&r.width>0&&r.height>0};
                const norm=s=>(s||'').replace(/\s+/g,' ').trim();
                function take(){
                  if(location.pathname!==path||!document.body)return;
                  const oldInputs=[...document.querySelectorAll('input')].filter(el=>['Enter name','Email','Phone number'].includes(el.getAttribute('placeholder')||''));
                  const newInputs=['sd-reg-name','sd-reg-email','sd-reg-phone'].map(id=>document.getElementById(id)).filter(Boolean);
                  const buttons=[...document.querySelectorAll('button')];
                  const oldPrice=buttons.find(b=>norm(b.textContent).includes('₹1999'));
                  const cont=buttons.find(b=>norm(b.textContent).includes('Continue — 2 quick questions'));
                  const h1=document.querySelector('h1'); const h1kids=h1?[...h1.children].map(x=>{const r=x.getBoundingClientRect(),cs=getComputedStyle(x);return {tag:x.tagName,text:norm(x.textContent),display:cs.display,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}):[];
                  const snap={t:Math.round(performance.now()),bodyText:norm(document.body.innerText).slice(0,800),oldInputsVisible:oldInputs.filter(vis).length,newInputsVisible:newInputs.filter(vis).length,oldPriceVisible:vis(oldPrice),continueVisible:vis(cont),h1:norm(h1?.textContent),h1html:h1?.innerHTML||'',h1kids,forms:document.querySelectorAll('form').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
                  let arr=[];try{arr=JSON.parse(localStorage.getItem('__sd_reg_paint_audit')||'[]')}catch{};arr.push(snap);if(arr.length>120)arr=arr.slice(-120);localStorage.setItem('__sd_reg_paint_audit',JSON.stringify(arr));
                }
                addEventListener('DOMContentLoaded',()=>{localStorage.removeItem('__sd_reg_paint_audit');let n=0;take();const id=setInterval(()=>{take();if(++n>=70)clearInterval(id)},50)});
              });
              const bad=[];p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)||r.request().resourceType()==='document'))bad.push(`${r.status()} ${u}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?first_paint_audit=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,3000));
              await Promise.all([p.waitForFunction(()=>location.pathname==='/gen-ai-masterclass/register-one-step',{timeout:30000}),p.evaluate(()=>document.querySelector('section[data-sd-claude-final-handoff-v1="1"] a[href]').click())]);
              await new Promise(r=>setTimeout(r,5000));
              const out=await p.evaluate(()=>{
                let frames=[];try{frames=JSON.parse(localStorage.getItem('__sd_reg_paint_audit')||'[]')}catch{}
                const ss={},ls={};for(const k of ['sd_funnel_attribution_v1','sd_anonymous_id_v1','sd_session_id_v1']){ss[k]=sessionStorage.getItem(k);ls[k]=localStorage.getItem(k)}
                const scripts=[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/registration|attribution/.test(s));
                return {frames,ss,ls,scripts,url:location.href};
              });
              const f=out.frames;
              const firstNew=f.find(x=>x.newInputsVisible===3&&x.continueVisible);
              const oldEver=f.some(x=>x.oldInputsVisible>0||x.oldPriceVisible);
              const blank=f.filter(x=>x.oldInputsVisible===0&&x.newInputsVisible===0&&!x.continueVisible).map(x=>x.t);
              const overflowEver=f.some(x=>x.overflow);
              console.log('REG_FIRST_PAINT',name,JSON.stringify({url:out.url,frames:f,firstNewMs:firstNew?.t??null,oldEver,blankCount:blank.length,blankRange:blank.length?[Math.min(...blank),Math.max(...blank)]:null,overflowEver,sessionStorage:out.ss,localStorage:out.ls,scripts:out.scripts,bad}));
              if(oldEver||overflowEver||bad.length) throw new Error(`visible native flash or asset issue ${name}`);
              await p.close();
            }
            await browser.close(); console.log('REG_FIRST_PAINT_VISIBILITY_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Runtime owner evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          for u in \
            'https://sikhadenge.in/registration-stable-hot-v72.js?v=20260903-131023' \
            'https://sikhadenge.in/registration-stable-page1-v72.js?v=20260903-131023' \
            'https://sikhadenge.in/registration-native-suppress-v1-20260910.js?v=native-suppress-v1-20260910'; do
            f="/tmp/$(echo "$u" | sed 's#https://sikhadenge.in/##;s#[?=&/]#_#g')"
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 40 "$u" -o "$f"
            echo "RUNTIME_ASSET $u SHA=$(sha256sum "$f" | awk '{print $1}') BYTES=$(wc -c < "$f")"
            grep -nE 'Become an AI Expert|₹1999|native|suppress|sd-reg-name|Continue — 2 quick questions|display|opacity' "$f" | head -80 || true
          done
