name: Funnel Golden Health Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/funnel-golden-health-monitor.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect live heading runtime source
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl lock >/dev/null 2>&1 || true
          sikhadenge-funnel-lockctl check
          ASSET='/var/www/sikhadenge.in/claude-heading-v11-restore-current.js'
          test -f "$ASSET"
          echo "ASSET_SHA=$(sha256sum "$ASSET" | awk '{print $1}') ASSET_BYTES=$(wc -c < "$ASSET")"
          echo '=== ASSET SOURCE ==='
          nl -ba "$ASSET" | sed -n '1,260p'
          echo '=== CLAUDE ROUTE HEADING REFERENCES ==='
          python3 - <<'PY'
          p='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          s=open(p,encoding='utf-8').read(); needle='location = /masterclass/claude/free {'; a=s.find(needle)
          if a<0: raise SystemExit('route missing')
          q=s.find('{',a); d=0; end=None
          for i in range(q,len(s)):
              if s[i]=='{': d+=1
              elif s[i]=='}':
                  d-=1
                  if d==0: end=i+1; break
          seg=s[a:end]
          for n,line in enumerate(seg.splitlines(),1):
              if 'heading' in line.lower() or 'claude-' in line or 'sub_filter' in line:
                  print(f'{n:03d}: {line}')
          PY
          REMOTE
      - name: Browser inspect final hero DOM
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; test -n "$CHROME"; export CHROME
          cat > inspect.js <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']}); const p=await b.newPage(); await p.setViewport({width:1440,height:1000}); await p.goto('https://sikhadenge.in/masterclass/claude/free?hero_dom_inspect=1',{waitUntil:'networkidle2',timeout:60000}); const x=await p.evaluate(()=>({h1Text:document.querySelector('h1')?.textContent||'',h1HTML:document.querySelector('h1')?.outerHTML||'',headingScripts:[...document.scripts].map(s=>s.src).filter(x=>x.includes('claude-heading')),heroParent:document.querySelector('h1')?.parentElement?.outerHTML?.slice(0,2500)||''})); console.log(JSON.stringify(x,null,2)); await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js
