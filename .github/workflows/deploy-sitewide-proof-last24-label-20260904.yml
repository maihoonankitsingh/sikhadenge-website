name: Deploy Sitewide Proof Last 24 Hours Label 20260904
on:
  push:
    paths:
      - '.github/workflows/deploy-sitewide-proof-last24-label-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Change only proof label text
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          SRC='/var/www/sikhadenge.in/social-proof-live/sitewide-live-proof-v1.js'
          APP='sikhadenge-social-proof-live'
          TS="$(date +%Y%m%d-%H%M%S)"
          BAK="/var/backups/sikhadenge/sitewide-proof-label-$TS"
          mkdir -p "$BAK"
          test -f "$SRC"
          cp -a "$SRC" "$BAK/sitewide-live-proof-v1.js.before"

          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          before=p.read_text(encoding='utf-8')
          old='<span class="desc">recent registrations</span>'
          new='<span class="desc">Last 24 hours</span>'
          if before.count(old)!=1:
              raise SystemExit(f'guard failed: expected exactly one target, found {before.count(old)}')
          after=before.replace(old,new,1)
          if after.replace(new,old,1)!=before:
              raise SystemExit('guard failed: change outside target label detected')
          p.write_text(after,encoding='utf-8')
          verify=p.read_text(encoding='utf-8')
          if verify.count(new)!=1 or old in verify:
              raise SystemExit('file verification failed')
          print('LABEL_ONLY_CHANGE=1')
          print('OLD_LABEL=recent registrations')
          print('NEW_LABEL=Last 24 hours')
          PY

          # Verify served widget; restart only if the running service cached the JS in memory.
          W="$(mktemp)"
          code="$(curl -sS -o "$W" -w '%{http_code}' 'http://127.0.0.1:3944/api/social-proof/live?widget=1&v=label-last24' || true)"
          echo "INTERNAL_WIDGET_HTTP=$code"
          if [ "$code" != 200 ] || ! grep -Fq 'Last 24 hours' "$W"; then
            pm2 restart "$APP" --update-env
            sleep 3
            code="$(curl -sS -o "$W" -w '%{http_code}' 'http://127.0.0.1:3944/api/social-proof/live?widget=1&v=label-last24-restart' || true)"
          fi
          if [ "$code" != 200 ] || ! grep -Fq 'Last 24 hours' "$W"; then
            cp -a "$BAK/sitewide-live-proof-v1.js.before" "$SRC"
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
            exit 1
          fi
          if grep -Fiq 'recent registrations' "$W"; then
            cp -a "$BAK/sitewide-live-proof-v1.js.before" "$SRC"
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
            exit 1
          fi

          P="$(mktemp)"
          pcode="$(curl -kLsS -o "$P" -w '%{http_code}' 'https://sikhadenge.in/api/social-proof/live?widget=1&v=label-last24-public' || true)"
          echo "PUBLIC_WIDGET_HTTP=$pcode"
          if [ "$pcode" != 200 ] || ! grep -Fq 'Last 24 hours' "$P"; then
            cp -a "$BAK/sitewide-live-proof-v1.js.before" "$SRC"
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
            exit 1
          fi
          echo "BACKUP_SOURCE=$BAK/sitewide-live-proof-v1.js.before"
          echo 'SITEWIDE_PROOF_LAST24_LABEL_LIVE_OK=1 TEXT_ONLY=1 DATA_LOGIC_UNTOUCHED=1 DESIGN_UNTOUCHED=1'
          REMOTE
