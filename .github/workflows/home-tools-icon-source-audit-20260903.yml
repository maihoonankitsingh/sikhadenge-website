name: Home Tools Icon Source Audit 20260903

on:
  push:
    paths:
      - .github/workflows/home-tools-icon-source-audit-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect active home tools source read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          F=/var/www/sikhadenge.in/sikhadenge-website-space/app/landing/page.tsx
          echo 'ACTIVE_SOURCE_BEGIN'
          test -f "$F"
          echo "FILE=$F"
          echo 'AITOOLS_DEFINITION:'
          L="$(grep -nE '(^|[[:space:]])(const|let)[[:space:]]+aiTools' "$F" | head -1 | cut -d: -f1 || true)"
          if [[ -n "$L" ]]; then S=$((L-8)); (( S < 1 )) && S=1; E=$((L+85)); sed -n "${S},${E}p" "$F" | nl -ba -v "$S"; fi
          echo 'TOOLS_SECTION:'
          L2="$(grep -n 'Tools Ecosystem' "$F" | head -1 | cut -d: -f1 || true)"
          if [[ -n "$L2" ]]; then S2=$((L2-25)); (( S2 < 1 )) && S2=1; E2=$((L2+105)); sed -n "${S2},${E2}p" "$F" | nl -ba -v "$S2"; fi
          echo 'IMPORTS_TOP:'
          sed -n '1,120p' "$F" | nl -ba
          echo 'ACTIVE_SOURCE_END READ_ONLY=1'
          REMOTE

# trigger: active source details
