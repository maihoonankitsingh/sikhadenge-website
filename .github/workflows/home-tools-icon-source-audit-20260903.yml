name: Home Tools Icon Source Audit 20260903

on:
  push:
    paths:
      - .github/workflows/home-tools-icon-source-audit-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Locate live home tools source read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          echo 'AUDIT_BEGIN'
          echo "ROOT=$ROOT"
          test -d "$ROOT"
          echo 'MATCHING_SOURCE_FILES:'
          grep -RIl --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=backups --exclude='*.map' '25+ AI Tools You Will Master' "$ROOT" 2>/dev/null | head -20 || true
          echo 'MATCHING_TOOLS_ECOSYSTEM_FILES:'
          grep -RIl --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=backups --exclude='*.map' 'Tools Ecosystem' "$ROOT" 2>/dev/null | head -20 || true
          F="$(grep -RIl --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=backups --exclude='*.map' '25+ AI Tools You Will Master' "$ROOT" 2>/dev/null | head -1 || true)"
          if [[ -n "$F" ]]; then
            echo "SOURCE_FILE=$F"
            echo 'SOURCE_SNIPPET_BEGIN'
            grep -n -B25 -A90 '25+ AI Tools You Will Master' "$F" | head -160 || true
            echo 'SOURCE_SNIPPET_END'
          fi
          echo 'PUBLIC_ICON_CANDIDATES:'
          find "$ROOT/public" -maxdepth 4 -type f \( -iname '*chatgpt*' -o -iname '*claude*' -o -iname '*gemini*' -o -iname '*deepseek*' -o -iname '*perplexity*' -o -iname '*midjourney*' -o -iname '*ideogram*' -o -iname '*runway*' -o -iname '*pika*' -o -iname '*veo*' -o -iname '*luma*' -o -iname '*eleven*' -o -iname '*heygen*' -o -iname '*descript*' -o -iname '*notion*' -o -iname '*zapier*' -o -iname '*make*' -o -iname '*n8n*' -o -iname '*webflow*' -o -iname '*gamma*' \) 2>/dev/null | head -120 || true
          echo 'AUDIT_END READ_ONLY=1'
          REMOTE
