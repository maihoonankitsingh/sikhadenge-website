name: EngageOS production-local reconcile once

on:
  push:
    branches:
      - fix/engageos-production-local-reconciliation-20260910
    paths:
      - .github/workflows/engageos-production-local-reconcile-once.yml

permissions:
  contents: write

concurrency:
  group: engageos-production-local-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed production-local patch exactly once
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_base="4974b46b690561f3022fed5b726115c05cfce49c"
          expected_patch_sha="c2b5cc150edd3fac2efd5d9c32928462737baca1b5b9bdb036acc1d183ed35b2"
          workflow_path=".github/workflows/engageos-production-local-reconcile-once.yml"
          patch_file="/tmp/engageos-production-local-reconcile.patch"

          git merge-base --is-ancestor "$expected_base" HEAD

          cat > /tmp/reconcile.patch.gz.b64 <<'PATCH_B64'

PATCH_B64

          base64 --decode /tmp/reconcile.patch.gz.b64 | gzip -dc > "$patch_file"
          test "$(sha256sum "$patch_file" | awk '{print $1}')" = "$expected_patch_sha"

          expected_files="$(cat <<'FILES'
apps/whatsapp-agent-dashboard/app/api/analytics/overview/route.ts
apps/whatsapp-agent-dashboard/app/api/conversations/route.ts
apps/whatsapp-agent-dashboard/app/globals.css
apps/whatsapp-agent-dashboard/app/inbox/page.tsx
apps/whatsapp-agent-dashboard/app/layout.tsx
apps/whatsapp-agent-dashboard/components/inbox/InboxDashboardV2.tsx
apps/whatsapp-agent-dashboard/lib/inbox/conversation-repository.ts
FILES
)"

          git apply --3way --index "$patch_file"
          git diff --cached --check

          actual_files="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected_files="$(printf '%s\n' "$expected_files" | LC_ALL=C sort)"
          test "$actual_files" = "$expected_files"

          grep -Fq 'ServiceWorkerRegistration' apps/whatsapp-agent-dashboard/app/layout.tsx
          grep -Fq 'Manrope' apps/whatsapp-agent-dashboard/app/layout.tsx
          grep -Fq 'Last 24 Hours' apps/whatsapp-agent-dashboard/components/inbox/InboxDashboardV2.tsx
          grep -Fq 'InboxConversationScope' apps/whatsapp-agent-dashboard/lib/inbox/conversation-repository.ts
          grep -Fq 'WHATSAPP_ANALYTICS_TOKEN' apps/whatsapp-agent-dashboard/app/api/analytics/overview/route.ts

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm "$workflow_path"
          git commit -m 'fix(inbox): reconcile reviewed production-local behavior'
          git push origin "HEAD:${GITHUB_REF_NAME}"
