name: Deploy Claude FAQ Conversion V1 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-claude-faq-conversion-v1-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Static validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/deploy-claude-faq-conversion-v1-20260910.sh
          node --check ops/qa-claude-faq-conversion-v1-20260910.js
          grep -Fq "EXPECTED_CLAUDE='e5e74f1a2e20c13752d290bb4025c9b1daa303cf0377d963c68a121dfe794535'" ops/deploy-claude-faq-conversion-v1-20260910.sh
          grep -Fq "EXPECTED_OLD_FAQ_SHA='a1f7945edb9d8115d28fb29888236178dd33d7b22d7967d7caf0fbbccc271a88'" ops/deploy-claude-faq-conversion-v1-20260910.sh
          grep -Fq 'Is this masterclass only about Claude?' ops/qa-claude-faq-conversion-v1-20260910.js
          grep -Fq 'What bonus resources are included with the free seat?' ops/qa-claude-faq-conversion-v1-20260910.js
          echo FAQ_CONVERSION_V1_STATIC_VALIDATION=PASS

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Locked preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SITE='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          OLD='/claude-faq-v2.js?v=faq15-final2-20260904'
          NEW='/claude-faq-conversion-v1-20260910.js?v=faq-conversion-v1-20260910'
          sikhadenge-funnel-lockctl check
          STATUS="$(sikhadenge-funnel-lockctl status)"
          printf '%s\n' "$STATUS" | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^LOCK_STATE=/{print $2}')" = 'LOCKED'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^CLAUDE_PUBLIC_SHA=/{print $2}')" = 'e5e74f1a2e20c13752d290bb4025c9b1daa303cf0377d963c68a121dfe794535'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^AI_PUBLIC_SHA=/{print $2}')" = 'b03ab6b210bceed43573d2037816ae8f8208969ea73cecaba60e14eef10c12d2'
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          python3 - "$SITE" "$OLD" "$NEW" <<'PY'
          import sys
          p,old,new=sys.argv[1:]
          s=open(p,encoding='utf-8',errors='ignore').read(); needle='location = /masterclass/claude/free {'; a=s.find(needle)
          if a<0: raise SystemExit('Claude route missing')
          q=s.find('{',a); d=0; quote=None; esc=False; end=None
          for i in range(q,len(s)):
              ch=s[i]
              if esc: esc=False; continue
              if ch=='\\': esc=True; continue
              if quote:
                  if ch==quote: quote=None
                  continue
              if ch in ('"',"'"): quote=ch; continue
              if ch=='{': d+=1
              elif ch=='}':
                  d-=1
                  if d==0: end=i+1; break
          if end is None: raise SystemExit('route parse failed')
          route=s[a:end]
          print('PREFLIGHT_FAQ_URL_COUNTS',route.count(old),route.count(new))
          if route.count(old)!=1 or route.count(new)!=0: raise SystemExit('unexpected FAQ route state')
          PY
          echo FAQ_CONVERSION_V1_PREFLIGHT=PASS
          REMOTE

      - name: Stage deployment file
        shell: bash
        run: |
          set -Eeuo pipefail
          scp -P "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            ops/deploy-claude-faq-conversion-v1-20260910.sh \
            "$SSH_USER@$SSH_HOST:/tmp/deploy-claude-faq-conversion-v1-20260910.sh"

      - name: Controlled FAQ Conversion V1 stage
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash /tmp/deploy-claude-faq-conversion-v1-20260910.sh stage'

      - name: Browser QA desktop tablet mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node ops/qa-claude-faq-conversion-v1-20260910.js

      - name: Reseal and lock Golden baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl reseal
          sikhadenge-funnel-lockctl lock
          sikhadenge-funnel-lockctl check
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          sleep 3
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(sikhadenge-funnel-lockctl status | awk -F= '/^LOCK_STATE=/{print $2}')" = 'LOCKED'
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          echo CLAUDE_FAQ_CONVERSION_V1_RESEALED_LOCKED=PASS
          REMOTE

      - name: Post-lock browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node ops/qa-claude-faq-conversion-v1-20260910.js
          echo FAQ_CONVERSION_V1_POST_LOCK_BROWSER=PASS

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'if [ -f /tmp/deploy-claude-faq-conversion-v1-20260910.sh ]; then bash /tmp/deploy-claude-faq-conversion-v1-20260910.sh rollback; else sikhadenge-funnel-lockctl lock || true; fi'

      - name: Clean temporary server file
        if: always()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'rm -f /tmp/deploy-claude-faq-conversion-v1-20260910.sh'
