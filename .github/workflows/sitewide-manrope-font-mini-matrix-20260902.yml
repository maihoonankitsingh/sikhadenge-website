name: Sitewide Manrope Font Mini Matrix 20260902

on:
  push:
    paths:
      - .github/workflows/sitewide-manrope-font-mini-matrix-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  mini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    steps:
      - name: SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'FONT_MATRIX_BEGIN'
          for item in \
            'MAIN|/var/www/sikhadenge.in/sikhadenge-website-space' \
            'CLAUDE3930|/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916' \
            'AIVIDEO3940|/var/www/sikhadenge.in/releases/production-ai-workflow-premium-zero-build-20260829-110420' \
            'CLAUDE3971|/var/www/sikhadenge.in/candidates/claude-ai-shift-research-v2-20260901-213954'; do
            n="${item%%|*}"; r="${item#*|}"
            s=""
            for f in app/layout.tsx app/globals.css styles/globals.css pages/_app.tsx src/app/layout.tsx src/app/globals.css; do
              [ -f "$r/$f" ] || continue
              x="$(grep -Ei 'next/font/google|\b(Manrope|Inter|Poppins|Roboto)\b|font-family' "$r/$f" 2>/dev/null | head -4 | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' || true)"
              [ -n "$x" ] && s="$s $f={$x}"
            done
            echo "RUNTIME=$n $s"
          done
          echo 'NGINX:'
          awk '
            /location = \/masterclass\/ai-video \{/ {p=1;c=0}
            /location = \/masterclass\/claude\/free \{/ {p=1;c=0}
            p {print; c++}
            p && /proxy_pass/ {p=0}
          ' /etc/nginx/sites-enabled/sikhadenge.in-ssl | sed 's/[[:space:]]\+/ /g' | head -20
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          for route in / /about-us /courses /contact /blog /reviews /privacy-policy /terms /gen-ai-masterclass/register-one-step /masterclass/ai-video /masterclass/claude/free; do
            k="$(printf '%s' "$route" | sha256sum | cut -c1-8)"; h="$tmp/$k.html"; c="$tmp/$k.css"; : > "$c"
            code="$(curl -L --compressed -ksS -o "$h" -w '%{http_code}' "https://sikhadenge.in$route" || true)"
            grep -oE 'href="[^"]+\.css[^\"]*"' "$h" 2>/dev/null | sed -E 's/^href="|"$//g' | sort -u | while read -r href; do
              [ -n "$href" ] || continue; case "$href" in http*) u="$href";; *) u="https://sikhadenge.in$href";; esac; curl -L --compressed -ksS "$u" >> "$c" || true; printf '\n' >> "$c"
            done
            m=0;i=0;p=0;r=0
            grep -Eqi 'Manrope' "$c" && m=1 || true
            grep -Eqi 'Inter' "$c" && i=1 || true
            grep -Eqi 'Poppins' "$c" && p=1 || true
            grep -Eqi 'Roboto' "$c" && r=1 || true
            echo "ROUTE=$route HTTP=$code M=$m I=$i P=$p R=$r"
          done
          echo 'FONT_MATRIX_END READ_ONLY=1'
          REMOTE
