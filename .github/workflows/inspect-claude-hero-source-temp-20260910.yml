name: Inspect Claude Hero Source Temp 20260910
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-claude-hero-source-temp-20260910.yml']
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Locate matching SSR file read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          echo '=== SSR CANDIDATES ==='
          find "$CWD/.next/server" -type f \( -path '*masterclass*claude*free*' -o -name '*.js' \) 2>/dev/null | while read -r f; do
            if grep -q 'faster execution & better results' "$f" 2>/dev/null; then
              echo "SSR_MATCH=$f SHA=$(sha256sum "$f"|awk '{print $1}') BYTES=$(wc -c <"$f")"
              python3 - "$f" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); p=s.find('faster execution & better results')
          print('CONTEXT=',s[max(0,p-450):p+500])
          PY
            fi
          done
          echo '=== CLIENT EXACT ==='
          F="$CWD/.next/static/chunks/pages/masterclass/claude/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js"
          echo "CLIENT=$F SHA=$(sha256sum "$F"|awk '{print $1}')"
          REMOTE
