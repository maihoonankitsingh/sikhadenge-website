name: Sitewide Live Proof Placement Fix

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-placement-fix-20260902.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Patch widget placement only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          FILE="/var/www/sikhadenge.in/social-proof-live/sitewide-live-proof-v1.js"
          test -f "$FILE"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="${FILE}.placement-backup-${TS}"
          cp -a "$FILE" "$BACKUP"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/var/www/sikhadenge.in/social-proof-live/sitewide-live-proof-v1.js')
          s=p.read_text(encoding='utf-8')
          old='''          left:18px;\n          bottom:18px;\n          width:318px;'''
          new='''          left:auto;\n          right:24px;\n          bottom:24px;\n          width:318px;'''
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'placement anchor count={n}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check "$FILE"
          grep -Fq 'right:24px;' "$FILE"
          grep -Fq 'bottom:24px;' "$FILE"
          grep -Fq 'left:auto;' "$FILE"

          echo "RESULT=PLACEMENT_UPDATED"
          echo "BACKUP=$BACKUP"
          REMOTE

      - name: Verify public widget endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS 'https://sikhadenge.in/api/social-proof/live?widget=1&placement=20260902' | grep -Fq 'right:24px;'
          echo 'PUBLIC_WIDGET_PLACEMENT=PASS'
