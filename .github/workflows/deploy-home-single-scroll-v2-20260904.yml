name: Deploy Home Single Scroll V2 20260904
on:
  push:
    paths:
      - '.github/workflows/deploy-home-single-scroll-v2-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Homepage single scroll only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/app/landing/page.tsx"
          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/var/tmp/sd-home-scroll-v2-$TS"
          BAK="/var/backups/sikhadenge/home-single-scroll-v2-$TS"
          STAGE="$LIVE/.next.home-scroll-v2-stage-$TS"
          OLDNEXT="$LIVE/.next.pre-home-scroll-v2-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT
          test -f "$SRC"
          test -f "$LIVE/.next/BUILD_ID"
          cp -a "$SRC" "$BAK/page.tsx.before"

          rsync -a --delete --exclude node_modules --exclude '.next*' --exclude public --exclude data "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          ln -s "$LIVE/public" "$CAND/public"
          ln -s "$LIVE/data" "$CAND/data"
          NEWSRC="$CAND/app/landing/page.tsx"

          python3 - "$NEWSRC" "$SRC" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); live=Path(sys.argv[2])
          before=p.read_text(encoding='utf-8')
          needle='export default function LandingPage() {\n  return ('
          if before.count(needle)!=1:
              raise SystemExit(f'anchor guard failed: {before.count(needle)}')
          hook='''export default function LandingPage() {
  useEffect(() => {
    const html = document.documentElement;
    const body = document.body;
    const previous = [
      [html, "height", html.style.getPropertyValue("height"), html.style.getPropertyPriority("height")],
      [html, "min-height", html.style.getPropertyValue("min-height"), html.style.getPropertyPriority("min-height")],
      [html, "overflow-y", html.style.getPropertyValue("overflow-y"), html.style.getPropertyPriority("overflow-y")],
      [body, "height", body.style.getPropertyValue("height"), body.style.getPropertyPriority("height")],
      [body, "min-height", body.style.getPropertyValue("min-height"), body.style.getPropertyPriority("min-height")],
      [body, "overflow-y", body.style.getPropertyValue("overflow-y"), body.style.getPropertyPriority("overflow-y")],
    ] as const;

    html.style.setProperty("height", "auto", "important");
    html.style.setProperty("min-height", "100%", "important");
    html.style.setProperty("overflow-y", "auto", "important");
    body.style.setProperty("height", "auto", "important");
    body.style.setProperty("min-height", "100%", "important");
    body.style.setProperty("overflow-y", "visible", "important");

    return () => {
      previous.forEach(([element, property, value, priority]) => {
        if (value) element.style.setProperty(property, value, priority);
        else element.style.removeProperty(property);
      });
    };
  }, []);

  return ('''
          after=before.replace(needle,hook,1)
          if after.replace(hook,needle,1)!=before:
              raise SystemExit('scope guard failed')
          if after.count('body.style.setProperty("overflow-y", "visible", "important")')!=1:
              raise SystemExit('marker guard failed')
          p.write_text(after,encoding='utf-8')
          if live.read_text(encoding='utf-8')!=before:
              raise SystemExit('live changed during candidate prep')
          print('HOME_SCROLL_PATCH_ONLY=1')
          PY

          cd "$CAND"
          npm run build
          test -f "$CAND/.next/BUILD_ID"
          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]
          rm -rf "$STAGE"
          mv "$CAND/.next" "$STAGE"
          test -f "$STAGE/BUILD_ID"

          cp -a "$NEWSRC" "$SRC"
          mv "$LIVE/.next" "$OLDNEXT"
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 7

          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?scrollv2=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?scrollv2=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then
            cp -a "$BAK/page.tsx.before" "$SRC"
            rm -rf "$LIVE/.next.failed-home-scroll-v2-$TS"
            mv "$LIVE/.next" "$LIVE/.next.failed-home-scroll-v2-$TS" || true
            mv "$OLDNEXT" "$LIVE/.next" || true
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
            exit 1
          fi

          grep -Fq 'body.style.setProperty("overflow-y", "visible", "important")' "$SRC"
          rm -rf "$OLDNEXT"
          echo "BACKUP_SOURCE=$BAK/page.tsx.before"
          echo 'HOME_SINGLE_SCROLL_V2_LIVE_SOURCE_OK=1 OTHER_PAGES_SOURCE_UNTOUCHED=1'
          REMOTE
