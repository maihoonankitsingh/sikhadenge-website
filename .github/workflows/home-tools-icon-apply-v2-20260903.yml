name: Home Tools Icon-Only Brand Audit 20260903

on:
  push:
    paths:
      - .github/workflows/home-tools-icon-apply-v2-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Audit icon-only LobeHub assets
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BASE='https://unpkg.com/@lobehub/icons-static-svg@latest/icons'
          slugs='openai claude gemini deepseek perplexity midjourney ideogram runway pika veo luma elevenlabs heygen descript notion zapier make n8n webflow gamma'
          for slug in $slugs; do
            for suffix in '' '-color' '-text'; do
              url="$BASE/${slug}${suffix}.svg"
              tmp="/tmp/lobe-${slug}${suffix}.svg"
              code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$url" || true)"
              size="$(wc -c <"$tmp" 2>/dev/null || echo 0)"
              head="$(head -c 120 "$tmp" 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g')"
              printf 'LOBE %-24s HTTP=%s SIZE=%s HEAD=%s\n' "${slug}${suffix}.svg" "$code" "$size" "$head"
            done
          done
          echo 'LIVE_CURRENT:'
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          CWD="$(readlink -f /proc/$PID/cwd)"
          grep -n -A24 '^const aiTools' "$CWD/app/landing/page.tsx" | head -30
          echo 'READ_ONLY=1'
          REMOTE
