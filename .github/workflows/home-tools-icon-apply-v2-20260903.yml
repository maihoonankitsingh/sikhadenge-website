name: Home Tools Transparent Logo Source Audit 20260903

on:
  push:
    paths:
      - .github/workflows/home-tools-icon-apply-v2-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify transparent logo sources read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BASE='https://cdn.jsdelivr.net/npm/simple-icons@latest/icons'
          for slug in openai claude googlegemini deepseek perplexity midjourney ideogram runway pika lumalabs elevenlabs heygen descript notion zapier make n8n webflow gamma; do
            code="$(curl -L -sS -o /tmp/si.svg -w '%{http_code}' "$BASE/$slug.svg" || true)"
            size="$(wc -c </tmp/si.svg 2>/dev/null || echo 0)"
            printf 'SIMPLEICON %-16s HTTP=%s SIZE=%s\n' "$slug" "$code" "$size"
          done
          echo 'LOCAL_SVG_VARIANTS:'
          find /var/www/sikhadenge.in/sikhadenge-website-space/public -type f \( -iname '*.svg' -o -iname '*.png' -o -iname '*.webp' \) 2>/dev/null | grep -Ei '/(chatgpt|openai|claude|gemini|deepseek|perplexity|midjourney|ideogram|runway|pika|veo|luma|eleven|heygen|descript|notion|zapier|make|n8n|webflow|gamma)' | head -240 || true
          echo 'READ_ONLY=1'
          REMOTE
