name: Inspect Registration First Paint Glitch 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-registration-first-paint-glitch-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production forensic
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata
          SNIP=/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf
          PAGE1="$(awk '/location = \/registration-v2-page1\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"
          HOT="$(awk '/location = \/registration-v2-hot\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"
          PRECSS="$(awk '/location = \/registration-mobile-prepaint-v64r2\.css/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"
          PREJS="$(awk '/location = \/registration-mobile-prepaint-v64r2\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"

          echo '===== FILES ====='
          printf 'PAGE1=%s\nHOT=%s\nPRECSS=%s\nPREJS=%s\n' "$PAGE1" "$HOT" "$PRECSS" "$PREJS"
          stat -c '%n | %y | %s bytes' "$PAGE1" "$HOT" "$PRECSS" "$PREJS" 2>/dev/null || true
          sha256sum "$PAGE1" "$HOT" "$PRECSS" "$PREJS" 2>/dev/null || true

          echo '===== NGINX REGISTRATION ROUTE ====='
          sed -n '1,180p' "$SNIP"

          echo '===== PREPAINT CSS ====='
          cat "$PRECSS" 2>/dev/null || true
          echo '===== PREPAINT JS ====='
          cat "$PREJS" 2>/dev/null || true

          echo '===== PAGE1 BOOT / DOM TIMING REFERENCES ====='
          grep -nE 'DOMContentLoaded|readyState|requestAnimationFrame|setTimeout|setInterval|MutationObserver|querySelector|appendChild|replaceChildren|innerHTML|style\.display|visibility|opacity|classList' "$PAGE1" | head -260 || true

          echo '===== PAGE1 FIRST 220 LINES ====='
          sed -n '1,220p' "$PAGE1"
          echo '===== PAGE1 LAST 220 LINES ====='
          tail -220 "$PAGE1"

          echo '===== HOT TIMING REFERENCES ====='
          grep -nE 'DOMContentLoaded|readyState|requestAnimationFrame|setTimeout|setInterval|MutationObserver|location\.reload|reload\(|replace\(|history|pushState|replaceState' "$HOT" | head -260 || true

          echo '===== RAW HTML FIRST PAINT EVIDENCE ====='
          for u in \
            'https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=ai-video-masterclass&paintscan=1' \
            'https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&paintscan=1'; do
            f="$(mktemp)"
            echo "URL=$u"
            curl -L --compressed -ksS -w 'http=%{http_code} ttfb=%{time_starttransfer} total=%{time_total}\n' -o "$f" "$u"
            echo "bytes=$(wc -c < "$f")"
            echo -n 'old_form_marker='; grep -cF 'Book free masterclass' "$f" || true
            echo -n 'old_goal_select='; grep -cF 'What is your goal for taking this program?' "$f" || true
            echo -n 'old_laptop_select='; grep -cF 'Do you have a laptop?' "$f" || true
            echo -n 'page1_script='; grep -cF '/registration-v2-page1.js' "$f" || true
            echo -n 'prepaint_css='; grep -cF '/registration-mobile-prepaint-v64r2.css' "$f" || true
            echo -n 'prepaint_js='; grep -cF '/registration-mobile-prepaint-v64r2.js' "$f" || true
            grep -oE '<link[^>]+registration-mobile-prepaint[^>]*>|<script[^>]+registration-mobile-prepaint[^>]*>|<script[^>]+registration-v2-(hot|page1)[^>]*>' "$f" | head -20 || true
          done

          echo '===== CTA DESTINATIONS ====='
          for u in \
            'https://sikhadenge.in/masterclass/ai-video?ctascan=1' \
            'https://sikhadenge.in/masterclass/claude/free?ctascan=1'; do
            f="$(mktemp)"
            echo "SOURCE=$u"
            curl -L --compressed -ksS "$u" -o "$f"
            grep -oE 'href="[^"]*register-one-step[^"]*"' "$f" | sort -u | head -30 || true
            grep -oE '/gen-ai-masterclass/register-one-step[^"'"'"' <]*' "$f" | sort -u | head -30 || true
          done

          echo '===== ASSET HTTP HEADERS/TIMINGS ====='
          for p in \
            '/registration-mobile-prepaint-v64r2.css' \
            '/registration-mobile-prepaint-v64r2.js' \
            '/registration-v2-hot.js' \
            '/registration-v2-page1.js'; do
            echo "ASSET=$p"
            curl -ksS -o /dev/null -D - -w 'ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\n' "https://sikhadenge.in$p?paintscan=1" | grep -Ei 'HTTP/|cache-control:|content-type:|ttfb=' || true
          done

          echo '===== READ ONLY COMPLETE ====='
          REMOTE
