name: Audit Community Tracking Focused 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-community-tracking-focused-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH and inspect exact registration file
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import re,hashlib,os
          p='/var/www/sikhadenge.in/releases/masterclass-registration-v72-tracking-fixed-20260902-213914/pages/gen-ai-masterclass/register-one-step.js'
          s=open(p,encoding='utf-8',errors='ignore').read(); lines=s.splitlines()
          print('FILE=',p); print('SHA=',hashlib.sha256(s.encode()).hexdigest()); print('LINES=',len(lines)); print('READ_ONLY=1')
          pats=[r'COMMUNITY_LINK',r'Join Community',r'gtag\s*\(',r'fbq\s*\(',r'dataLayer',r'CustomEvent',r'dispatchEvent',r'track',r'analytics',r'event']
          for pat in pats: print('COUNT',pat,len(re.findall(pat,s,re.I)))
          rx=re.compile(r'COMMUNITY_LINK|Join Community|gtag\s*\(|fbq\s*\(|dataLayer|CustomEvent|dispatchEvent|track|analytics|event',re.I)
          hits=[i for i,l in enumerate(lines) if rx.search(l)]
          groups=[]
          for i in hits:
            a=max(0,i-10); b=min(len(lines),i+11)
            if groups and a<=groups[-1][1]+1: groups[-1]=(groups[-1][0],max(groups[-1][1],b))
            else: groups.append((a,b))
          for a,b in groups:
            print(f'--- {a+1}-{b} ---')
            for j in range(a,b): print(f'{j+1:5d}: {lines[j]}')
          print('FOCUSED_COMMUNITY_AUDIT_PASS=1')
          PY
