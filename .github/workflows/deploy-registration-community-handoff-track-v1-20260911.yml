name: Audit Registration About You Screen 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-registration-community-handoff-track-v1-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Capture Step2 without lead write
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const norm=s=>(s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const lead=[],bad=[],errs=[];
              await p.setRequestInterception(true);
              p.on('request',req=>{if(req.method()==='POST'&&/\/api\/masterclass\/lead(?:\?|$)/.test(req.url())){lead.push(req.postData()||'');req.abort('blockedbyclient').catch(()=>{});}else req.continue().catch(()=>{});});
              p.on('pageerror',e=>errs.push(String(e)));
              p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)||r.request().resourceType()==='document'))bad.push(`${r.status()} ${u}`)});
              await p.goto(`https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&step2_audit=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,3500));
              await p.evaluate(()=>{
                const set=(id,v)=>{const e=document.getElementById(id);const d=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');d.set.call(e,v);e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));};
                set('sd-reg-name','QA Step Two');set('sd-reg-email','qa.step2@example.com');set('sd-reg-phone','9999999999');
                const b=document.querySelector('#sdv2-root [data-action="details-next"]');if(!b)throw new Error('details-next missing');b.click();
              });
              await new Promise(r=>setTimeout(r,700));
              const x=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();const vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>0&&r.height>0&&c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity||1)>0};
                const root=document.getElementById('sdv2-root');
                const roles=[...root.querySelectorAll('[data-role]')].map(e=>{const r=e.getBoundingClientRect();return {value:e.getAttribute('data-role')||'',text:n(e.textContent),visible:vis(e),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}});
                const buttons=[...root.querySelectorAll('button')].filter(vis).map(e=>({text:n(e.textContent),action:e.getAttribute('data-action')||'',disabled:!!e.disabled}));
                return {text:n(root.innerText),roles,buttons,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,rootRect:(()=>{const r=root.getBoundingClientRect();return {x:Math.round(r.x),w:Math.round(r.width),h:Math.round(r.height)}})()};
              });
              console.log('REG_ABOUT_YOU_AUDIT',name,JSON.stringify({state:x,leadWrites:lead.length,bad,errorCount:errs.length,errors:errs.slice(0,5)}));
              if(lead.length||bad.length||x.overflow||!x.text.includes('About You')||x.roles.filter(r=>r.visible).length<3)throw new Error(`About You audit fail ${name}`);
              await p.close();
            }
            await b.close();console.log('REGISTRATION_ABOUT_YOU_3VIEW_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
