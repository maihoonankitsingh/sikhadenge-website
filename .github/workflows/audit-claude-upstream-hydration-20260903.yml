name: Audit Claude Upstream Hydration 20260903

on:
  push:
    branches:
      - audit/claude-responsive-20260903
    paths:
      - .github/workflows/audit-claude-upstream-hydration-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH and tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          ssh -N -f -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -L 9393:127.0.0.1:3930 "$SSH_USER@$SSH_HOST"
          for i in $(seq 1 30); do if curl -fsS --max-time 3 'http://127.0.0.1:9393/masterclass/claude/free?v=upstream-audit' >/dev/null; then exit 0; fi; sleep 1; done
          exit 1

      - name: Browser test raw upstream only
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          cat > upstream.js <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const p=await b.newPage();await p.setViewport({width:1440,height:1000});const pe=[],ce=[],bad=[];p.on('pageerror',e=>pe.push(String(e)));p.on('console',m=>{if(m.type()==='error')ce.push(m.text())});p.on('response',r=>{if(r.status()>=400)bad.push({status:r.status(),url:r.url()})});await p.goto('http://127.0.0.1:9393/masterclass/claude/free?v=upstream-browser-20260903',{waitUntil:'domcontentloaded',timeout:45000});await new Promise(r=>setTimeout(r,9000));const hyd=[...pe,...ce].filter(x=>/#418|#425|invariant=418|invariant=425/i.test(x));console.log(JSON.stringify({hydration:hyd,pageErrors:pe,consoleErrors:ce.slice(0,20),bad:bad.slice(0,20),title:await p.title()},null,2));await b.close();if(hyd.length)process.exit(2)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node upstream.js
