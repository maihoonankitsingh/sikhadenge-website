name: Audit Claude Final Trust Footer 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-final-trust-footer-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect final footer DOM
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node - <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage();
            await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
            await p.goto(`https://sikhadenge.in/masterclass/claude/free?final_trust_audit=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,5000));
            const x=await p.evaluate(()=>{
              const n=s=>(s||'').replace(/\s+/g,' ').trim();
              const hits=[...document.querySelectorAll('body *')].filter(el=>el.children.length===0&&/SECURE PAYMENT OPTIONS|Trusted checkout experience|Net Banking/.test(n(el.textContent)));
              return hits.slice(0,12).map(el=>{
                const chain=[]; let cur=el;
                for(let i=0;i<5&&cur;i++,cur=cur.parentElement) chain.push({tag:cur.tagName,id:cur.id||'',class:String(cur.className||''),text:n(cur.innerText).slice(0,600),html:cur.outerHTML.slice(0,6000)});
                return {leaf:n(el.textContent),chain};
              });
            });
            console.log('FINAL_TRUST_DOM',JSON.stringify(x));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
