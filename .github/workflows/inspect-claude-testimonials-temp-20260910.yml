name: Audit Claude Locked Hydration Jitter 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-testimonials-temp-20260910.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Repeated locked baseline browser sampling
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sig=errs=>{const x={};for(const e of errs){const m=String(e).match(/Minified React error #(\d+)/);const k=m?`react-${m[1]}`:String(e);x[k]=(x[k]||0)+1;}return x;};
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const samples=[];
            for(let i=1;i<=8;i++){
              const p=await b.newPage(); await p.setViewport({width:1440,height:1000});
              const errs=[]; const bad=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('response',r=>{if(r.status()>=400&&(/\.css(?:\?|$)/.test(r.url())||/\.js(?:\?|$)/.test(r.url())))bad.push(`${r.status()} ${r.url()}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?locked_jitter_desktop=${i}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,5000));
              const state=await p.evaluate(()=>({
                hasV1b:[...document.scripts].some(s=>(s.src||'').includes('/claude-testimonials-conversion-v1b-20260910.js')),
                h1:(document.querySelector('h1')?.textContent||'').replace(/\s+/g,' ').trim(),
                sections:document.querySelectorAll('main section').length,
                faq:document.querySelectorAll('section[data-sd-claude-faq-v2="1"] details').length,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
              }));
              const s=sig(errs); samples.push(s); console.log('LOCKED_DESKTOP_SAMPLE',i,JSON.stringify(state),'ERRORS',JSON.stringify(s),'BAD',JSON.stringify(bad));
              if(state.hasV1b) throw Error('locked baseline unexpectedly has V1B');
              if(state.sections!==18||state.faq!==15||state.overflow||bad.length) throw Error(`baseline structural failure sample ${i}`);
              await p.close();
            }
            const aggregate={}; for(const s of samples) for(const [k,v] of Object.entries(s)){aggregate[k]=aggregate[k]||{min:v,max:v,seen:0};aggregate[k].min=Math.min(aggregate[k].min,v);aggregate[k].max=Math.max(aggregate[k].max,v);aggregate[k].seen++;}
            console.log('LOCKED_DESKTOP_ERROR_AGGREGATE',JSON.stringify(aggregate));
            await b.close(); console.log('LOCKED_HYDRATION_JITTER_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
