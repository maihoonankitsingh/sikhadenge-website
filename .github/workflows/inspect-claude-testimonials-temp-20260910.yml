name: Inspect Claude Testimonials Locked Baseline 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-testimonials-temp-20260910.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Browser baseline hydration and CSS audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const errs=[]; p.on('pageerror',e=>errs.push(String(e)));
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?testimonial_baseline=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,5000));
              const x=await p.evaluate(()=>{
                const r=document.getElementById('sd-claude-testimonials-v305');
                const v=r?.querySelector('.sd-v305-viewport'); const t=r?.querySelector('.sd-v305-track');
                const vs=v?getComputedStyle(v):null, ts=t?getComputedStyle(t):null;
                const rules=[];
                function walk(list,scope){
                  for(const rule of Array.from(list||[])){
                    try{
                      if(rule.cssRules){ walk(rule.cssRules,scope+' '+(rule.conditionText||rule.media?.mediaText||'')); continue; }
                      const txt=rule.cssText||'';
                      if(txt.includes('sd-v305-viewport')||txt.includes('sd-v305-track')) rules.push((scope+' '+txt).trim());
                    }catch{}
                  }
                }
                for(const sheet of Array.from(document.styleSheets)){ try{walk(sheet.cssRules,'')}catch{} }
                return {hasV1:!!document.querySelector('script[src*="claude-testimonials-conversion-v1-20260910.js"]'),overflowX:vs?.overflowX||'',overflowY:vs?.overflowY||'',scrollSnap:vs?.scrollSnapType||'',animation:ts?[ts.animationName,ts.animationDuration,ts.animationPlayState]:[],rules:rules.slice(-30)};
              });
              const counts={}; for(const e of errs){const m=e.match(/Minified React error #(\d+)/);const k=m?`react-${m[1]}`:e;counts[k]=(counts[k]||0)+1;}
              console.log('BASELINE',name,JSON.stringify(x),'PAGE_ERRORS',JSON.stringify(counts));
              await p.close();
            }
            await b.close(); console.log('LOCKED_BASELINE_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
