name: Inspect Claude Testimonials Active Owner Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-testimonials-temp-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ vars.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 6
    steps:
      - name: Browser active owner trace
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox']});const p=await b.newPage();await p.setViewport({width:1440,height:1000});await p.goto(`https://sikhadenge.in/masterclass/claude/free?v305_active_owner=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});await new Promise(r=>setTimeout(r,3500));const x=await p.evaluate(()=>{const r=document.getElementById('sd-claude-testimonials-v305');const c=r?.querySelector('.sd-v305-set .sd-v305-card');const poster=c?.querySelector('.sd-v305-poster');return {rootVersion:r?.getAttribute('data-sd-testimonial-version')||'',rootLayout:r?.getAttribute('data-sd-testimonial-layout')||'',firstCard:c?.outerHTML||'',posterBg:poster?getComputedStyle(poster).backgroundImage:'',scripts:[...document.scripts].map((s,i)=>({i,src:s.src||'',hasV305:(s.textContent||'').includes('__SD_CLAUDE_TESTIMONIALS_V305__'),hasRuntime:(s.textContent||'').includes('data-claude-runtime-loader')})).filter(x=>x.hasV305||x.hasRuntime||/testimonial|runtime-loader/i.test(x.src))}});console.log('ACTIVE_OWNER',JSON.stringify(x));await b.close();console.log('ACTIVE_OWNER_TRACE_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
