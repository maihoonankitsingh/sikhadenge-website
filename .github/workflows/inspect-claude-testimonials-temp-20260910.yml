name: Inspect Claude Testimonials Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-testimonials-temp-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 12
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Server owner and media audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|LOCK_STATE'
          L=/var/www/sikhadenge.in/claude-runtime-loader-v3.js
          test -s "$L"
          echo LOADER_SHA=$(sha256sum "$L"|awk '{print $1}')
          echo '=== TESTIMONIAL LOADER CORE ==='
          sed -n '40,115p' "$L"
          echo '=== PUBLIC LOADER TAG ==='
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 "https://sikhadenge.in/masterclass/claude/free?testimonial_owner=$(date +%s)" | grep -oE '<script[^>]+src="[^"]*claude-runtime-loader-v3[^>]*>' || true
          echo '=== MEDIA FILES ==='
          for n in 01 02 03 04 05 06; do
            J="/var/www/sikhadenge.in/ai-video-testimonials/$n.jpg"; V="/var/www/sikhadenge.in/ai-video-testimonials/$n.mp4"
            test -s "$J"; test -s "$V"
            printf 'MEDIA %s JPG_BYTES=%s JPG_SHA=%s MP4_BYTES=%s MP4_SHA=%s\n' "$n" "$(stat -c%s "$J")" "$(sha256sum "$J"|awk '{print $1}')" "$(stat -c%s "$V")" "$(sha256sum "$V"|awk '{print $1}')"
            file "$J" "$V" | sed 's#^#FILE #'
          done
          echo SERVER_TESTIMONIAL_OWNER_AUDIT_PASS
          REMOTE
      - name: Browser DOM and interaction audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const n=s=>(s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const bad=[]; p.on('response',r=>{if(r.status()>=400&&(/\.css(?:\?|$)/.test(r.url())||/\.js(?:\?|$)/.test(r.url())||/ai-video-testimonials\//.test(r.url())))bad.push(`${r.status()} ${r.url()}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?testimonial_dom=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000}); await new Promise(r=>setTimeout(r,3200));
              const x=await p.evaluate(()=>{
                const norm=s=>(s||'').replace(/\s+/g,' ').trim();
                const r=document.getElementById('sd-claude-testimonials-v305');
                if(!r)return {missing:true};
                const cards=[...r.querySelectorAll('.sd-v305-card')];
                const firstSet=r.querySelector('.sd-v305-set');
                const uniqueCards=firstSet?[...firstSet.querySelectorAll('.sd-v305-card')]:[];
                const all=[...document.querySelectorAll('main section')]; const idx=all.indexOf(r);
                const prev=all[idx-1],next=all[idx+1];
                const track=r.querySelector('.sd-v305-track'); const cs=track?getComputedStyle(track):null;
                return {
                  missing:false,index:idx,
                  pill:norm(r.querySelector('.sd-v305-pill')?.textContent),title:norm(r.querySelector('.sd-v305-title')?.textContent),desc:norm(r.querySelector('.sd-v305-desc')?.textContent),
                  totalCards:cards.length,uniqueCards:uniqueCards.length,
                  posters:uniqueCards.map(c=>c.querySelector('img')?.currentSrc||''),videos:uniqueCards.map(c=>c.dataset.video||''),alts:uniqueCards.map(c=>c.querySelector('img')?.alt||''),arias:uniqueCards.map(c=>c.querySelector('button')?.getAttribute('aria-label')||''),
                  cardRects:uniqueCards.slice(0,2).map(c=>{const q=c.getBoundingClientRect();return [Math.round(q.width),Math.round(q.height)]}),
                  sectionRect:(()=>{const q=r.getBoundingClientRect();return [Math.round(q.width),Math.round(q.height)]})(),
                  animation:cs?[cs.animationName,cs.animationDuration,cs.animationPlayState]:[],
                  prevHeading:norm(prev?.querySelector('h2')?.textContent||prev?.innerText?.slice(0,120)),nextHeading:norm(next?.querySelector('h2')?.textContent||next?.innerText?.slice(0,120)),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                  hasHeadingStyle:r.querySelector('.sd-v305-title')?.getAttribute('data-sd-testimonial-heading-v309')||'',layout:r.getAttribute('data-sd-testimonial-layout')||'',version:r.getAttribute('data-sd-testimonial-version')||''
                };
              });
              console.log('VIEW',name,JSON.stringify(x),'FAILED_ASSETS',JSON.stringify(bad));
              if(x.missing)throw Error(`${name}: testimonial root missing`);
              if(name==='desktop'){
                await p.click('#sd-claude-testimonials-v305 .sd-v305-open'); await new Promise(r=>setTimeout(r,1500));
                const play=await p.evaluate(()=>{const r=document.getElementById('sd-claude-testimonials-v305');const v=r?.querySelector('video');return {playing:!!v,src:v?.currentSrc||v?.querySelector('source')?.src||'',controls:!!v?.controls,paused:v?.paused,ready:v?.readyState||0,rootPlaying:r?.getAttribute('data-playing')||''}});
                console.log('DESKTOP_FIRST_VIDEO',JSON.stringify(play));
                if(!play.playing||!play.src.includes('/ai-video-testimonials/01.mp4'))throw Error('first testimonial video did not open');
              }
              if(bad.length||x.overflow||x.uniqueCards!==6||x.totalCards!==12)throw Error(`${name}: structural QA failed`);
              await p.close();
            }
            await b.close(); console.log('BROWSER_TESTIMONIAL_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
