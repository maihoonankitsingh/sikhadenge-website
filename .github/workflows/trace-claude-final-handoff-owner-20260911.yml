name: Trace Claude Final Handoff Owner 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trace-claude-final-handoff-owner-20260911.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace current chunk and heading compatibility layer
        shell: bash
        run: |
          set -Eeuo pipefail
          CHUNK='/_next/static/chunks/pages/masterclass/claude/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-audience-v1b-closing-v1-20260910.js'
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 45 "https://sikhadenge.in${CHUNK}" -o /tmp/chunk.js
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 45 'https://sikhadenge.in/claude-heading-v11-restore-current.js?v=old-v11-current-20260903b' -o /tmp/heading.js
          echo "CHUNK_SHA=$(sha256sum /tmp/chunk.js | awk '{print $1}')"
          echo "HEADING_SHA=$(sha256sum /tmp/heading.js | awk '{print $1}')"
          python3 - <<'PY'
          for p in ['/tmp/chunk.js','/tmp/heading.js']:
              s=open(p,encoding='utf-8',errors='ignore').read()
              print('FILE',p,'BYTES',len(s))
              for needle in [
                  'Your first AI workflow starts with one',
                  'live session.',
                  'Reserve your free seat and continue to the existing SikhaDenge registration page.',
                  'NEXT LIVE BATCH',
              ]:
                  print('COUNT',repr(needle),s.count(needle))
                  i=s.find(needle)
                  if i>=0: print('SNIP',s[max(0,i-700):i+1800])
          PY
