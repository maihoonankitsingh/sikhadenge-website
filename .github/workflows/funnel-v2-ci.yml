name: Funnel v2 CI

on:
  push:
    branches:
      - feature/ai-masterclass-funnel-v2
  pull_request:
    paths:
      - 'components/funnel/**'
      - 'data/funnels.ts'
      - 'docs/funnels/**'
      - 'lib/funnel/**'
      - 'pages/masterclass/**'
      - 'pages/workshop/**'
      - 'pages/program/**'
      - 'pages/api/funnel/**'
      - 'pages/api/admin/funnel-dashboard.ts'
      - 'pages/api/admin/funnel-crm.ts'
      - 'pages/api/admin/funnel-crm/**'
      - 'pages/admin/funnel-dashboard.tsx'
      - 'pages/admin/funnel-crm/**'
      - 'pages/admin/index.tsx'
      - 'prisma/**'
      - 'scripts/funnel-security-check.cjs'
      - 'scripts/funnel-db-smoke.cjs'
      - 'styles/funnel*.css'
      - 'styles/workshop-funnel.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/funnel-v2-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_shadow
      NEXT_PUBLIC_MASTERCLASS_ENTRY_PRICE: '9'
      NEXT_PUBLIC_IMPLEMENTATION_WORKSHOP_PRICE: '1499'
      NEXT_PUBLIC_IMPLEMENTATION_WORKSHOP_REGULAR_PRICE: '1999'
      NEXT_PUBLIC_AI_EXPERT_PROGRAM_PRICE: '14999'
      NEXT_PUBLIC_AI_EXPERT_PROGRAM_DURATION: '10-week structured program'
      NEXT_PUBLIC_MASTERCLASS_DATE_LABEL: 'CI Test Batch'
      NEXT_PUBLIC_MASTERCLASS_TIME_LABEL: '8:00 PM IST'
      NEXT_PUBLIC_CHATGPT_MASTERCLASS_BATCH_ID: 'chatgpt-ci'
      NEXT_PUBLIC_CLAUDE_MASTERCLASS_BATCH_ID: 'claude-ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Payment security self-tests
        run: npm run test:funnel-security

      - name: Production dependency audit visibility
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Fresh database migration rehearsal
        run: npm run db:migrate:deploy

      - name: Database integrity smoke test
        run: npm run test:funnel-db

      - name: Build Next.js application
        run: npm run build
