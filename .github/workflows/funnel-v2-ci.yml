name: Funnel v2 CI

on:
  push:
    branches:
      - feature/ai-masterclass-funnel-v2
  pull_request:
    paths:
      - 'components/funnel/**'
      - 'data/funnels.ts'
      - 'lib/funnel/**'
      - 'pages/masterclass/**'
      - 'pages/api/funnel/**'
      - 'pages/api/admin/funnel-dashboard.ts'
      - 'pages/admin/funnel-dashboard.tsx'
      - 'prisma/**'
      - 'styles/funnel*.css'
      - 'package.json'
      - '.github/workflows/funnel-v2-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_shadow
      NEXT_PUBLIC_MASTERCLASS_ENTRY_PRICE: '9'
      NEXT_PUBLIC_MASTERCLASS_DATE_LABEL: 'CI Test Batch'
      NEXT_PUBLIC_MASTERCLASS_TIME_LABEL: '8:00 PM IST'
      NEXT_PUBLIC_CHATGPT_MASTERCLASS_BATCH_ID: 'chatgpt-ci'
      NEXT_PUBLIC_CLAUDE_MASTERCLASS_BATCH_ID: 'claude-ci'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
