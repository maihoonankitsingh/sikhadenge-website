name: Claude Proof Swap Fast Inspect 20260902

on:
  push:
    paths:
      - .github/workflows/claude-proof-swap-fast-inspect-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Fast source inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '===== ACTIVE NGINX CLAUDE BLOCK ====='
          sed -n '30,90p' /etc/nginx/sites-enabled/sikhadenge.in-ssl
          echo '===== INCLUDED ACTIVE ASSET FILES ====='
          grep -nE 'include .*claude|include .*ai-video' /etc/nginx/sites-enabled/sikhadenge.in-ssl || true
          for f in /etc/nginx/snippets/*claude* /etc/nginx/snippets/*ai-video* /etc/nginx/conf.d/*claude* /etc/nginx/conf.d/*ai-video*; do [[ -f "$f" ]] || continue; echo "--- $f ---"; sed -n '1,280p' "$f"; done
          echo '===== AI VIDEO LIVE SECTION TEXT ====='
          curl -fsS --max-time 20 https://sikhadenge.in/masterclass/ai-video -o /tmp/aiv.html
          python3 -c "from pathlib import Path; s=Path('/tmp/aiv.html').read_text(errors='ignore'); ms=['AI &amp; automation are reshaping','AI & automation are reshaping','hundreds of millions of jobs']; ps=[s.find(m) for m in ms if s.find(m)>=0]; p=min(ps) if ps else -1; print('POS',p,'LEN',len(s)); print(s[max(0,p-3000):min(len(s),p+26000)] if p>=0 else s[:3000])"
          echo '===== LIKELY AI VIDEO SOURCE FILES ====='
          find /var/www/sikhadenge.in -maxdepth 5 -type f \( -name '*.tsx' -o -name '*.js' -o -name '*.html' \) -newermt '2026-08-30' -print0 2>/dev/null | xargs -0 -r grep -Il -E 'hundreds of millions of jobs|increasing the value of AI skills|10\.35M' 2>/dev/null | head -40 || true
          echo '===== LIKELY CLAUDE CURRENT SOURCE FILES ====='
          find /var/www/sikhadenge.in -maxdepth 5 -type f \( -name 'free.tsx' -o -name '*.js' \) -newermt '2026-08-30' -print0 2>/dev/null | xargs -0 -r grep -Il -E 'THE AI SHIFT|moving ahead faster' 2>/dev/null | head -40 || true
          REMOTE
