name: Claude Proof Swap Fast Inspect 20260902

on:
  push:
    paths:
      - .github/workflows/claude-proof-swap-fast-inspect-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Extract exact AI Video proof runtime source
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          F=/var/www/sikhadenge.in/releases/production-ai-workflow-premium-zero-build-20260829-110420/public/ai-video-icons-hotfix.js
          test -f "$F"
          echo '===== FILE META ====='
          wc -lc "$F"
          sha256sum "$F"
          echo '===== MARKER LINES ====='
          grep -nE 'hundreds of millions of jobs|increasing the value of AI skills|10\.35M|30 Crore|40 Crore|9\.2 Crore|AI_VIDEO.*JOB|AI_VIDEO.*SKILL|ai-v80|ai-v85' "$F" | head -180 || true
          echo '===== SECTION AROUND JOBS MARKER ====='
          L=$(grep -n -m1 'hundreds of millions of jobs' "$F" | cut -d: -f1 || true)
          if [[ "$L" =~ ^[0-9]+$ ]]; then A=$((L-220)); ((A<1)) && A=1; B=$((L+360)); sed -n "${A},${B}p" "$F"; fi
          echo '===== SECTION AROUND SKILLS MARKER ====='
          L=$(grep -n -m1 'increasing the value of AI skills' "$F" | cut -d: -f1 || true)
          if [[ "$L" =~ ^[0-9]+$ ]]; then A=$((L-220)); ((A<1)) && A=1; B=$((L+360)); sed -n "${A},${B}p" "$F"; fi
          echo '===== EXACT CLAUDE CURRENT AI SHIFT SOURCE ON 3930 ====='
          ps -eo pid,cmd | grep -E '3930|claude' | grep -v grep | head -80 || true
          for d in /var/www/sikhadenge.in/candidates/* /var/www/sikhadenge.in/preview-builds/* /var/www/sikhadenge.in/releases/*; do
            [[ -d "$d" ]] || continue
            if grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git -E 'Why AI-skilled professionals are|moving ahead faster' "$d" 2>/dev/null | head -1 | grep -q .; then
              echo "--- MATCH ROOT $d ---"
              grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git -E 'Why AI-skilled professionals are|moving ahead faster' "$d" 2>/dev/null | head -12
            fi
          done | tail -120
          REMOTE
