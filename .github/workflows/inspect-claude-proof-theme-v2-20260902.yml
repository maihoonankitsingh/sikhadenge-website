name: Inspect Claude Proof Theme V2 20260902

on:
  push:
    paths:
      - .github/workflows/inspect-claude-proof-theme-v2-20260902.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture rendered Claude page
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          DOM="$RUNNER_TEMP/claude-proof-final.html"
          PNG="$RUNNER_TEMP/claude-proof-final.png"
          URL='https://sikhadenge.in/masterclass/claude/free?v=visual-static-v4-final-20260902'

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$URL" > "$DOM"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --hide-scrollbars --window-size=1440,5200 --screenshot="$PNG" "$URL"

          echo "static=$(grep -o 'data-claude-proof-static=\"v4\"' "$DOM" | wc -l || true)"
          echo "jobs=$(grep -o 'id=\"ai-video-job-impact-v80\"' "$DOM" | wc -l || true)"
          echo "skills=$(grep -o 'id=\"ai-video-ai-opportunity-v85\"' "$DOM" | wc -l || true)"
          echo "titles=$(grep -o 'data-sd-claude-title=\"1\"' "$DOM" | wc -l || true)"
          echo "highlights=$(grep -o 'data-sd-claude-highlight=\"1\"' "$DOM" | wc -l || true)"
          echo "cta=$(grep -o 'data-sd-claude-cta=\"1\"' "$DOM" | wc -l || true)"
          echo "old_ai_shift=$(grep -oi 'Why AI-skilled professionals are moving ahead faster' "$DOM" | wc -l || true)"
          echo "old_why=$(grep -oi 'Move from quick answers to structured, reviewable work' "$DOM" | wc -l || true)"
          echo "jobtext=$(grep -oi 'hundreds of millions of jobs' "$DOM" | wc -l || true)"
          echo "skilltext=$(grep -oi 'increasing the value of AI skills' "$DOM" | wc -l || true)"

          grep -Fq 'data-claude-proof-static="v4"' "$DOM"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'data-sd-claude-highlight="1"' "$DOM" | wc -l)" -eq 2
          grep -Fq 'data-sd-claude-cta="1"' "$DOM"
          grep -Fq '30 Crore' "$DOM"
          grep -Fq '40 Crore' "$DOM"
          grep -Fq '9.2 Crore' "$DOM"
          grep -Fq '+69%' "$DOM"
          grep -Fq '+78M' "$DOM"
          grep -Fq '10.35M' "$DOM"
          if grep -Fqi 'Move from quick answers to structured, reviewable work' "$DOM"; then exit 1; fi
          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$DOM"; then exit 1; fi
          ls -lh "$PNG" "$DOM"

          cp "$PNG" "$GITHUB_WORKSPACE/claude-proof-final.png"
          cp "$DOM" "$GITHUB_WORKSPACE/claude-proof-final.html"

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-proof-static-v4-visual
          path: |
            claude-proof-final.png
            claude-proof-final.html
          retention-days: 1
