name: Audit Registration Community Click V1 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-registration-community-click-v1-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only production source audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          JS='/var/www/sikhadenge.in/registration-stable-v72-20260903-131023/registration-stable-hot-v72.js'
          SNIP='/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf'
          test -f "$JS"; test -f "$SNIP"
          echo "REG_JS_SHA=$(sha256sum "$JS" | awk '{print $1}')"
          echo "REG_SNIP_SHA=$(sha256sum "$SNIP" | awk '{print $1}')"
          python3 - "$JS" "$SNIP" <<'PY'
          import sys,re
          js=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          sn=open(sys.argv[2],encoding='utf-8',errors='ignore').read()
          terms=['click_whatsapp_button','JOIN WHATSAPP COMMUNITY','sd_consent_v1','policyVersion','registration_step_view','/api/masterclass/lead']
          for t in terms:
              print('\n===== TERM',t,'=====')
              start=0; n=0
              while True:
                  i=js.find(t,start)
                  if i<0: break
                  n+=1
                  print('OCCURRENCE',n,'INDEX',i)
                  print(js[max(0,i-900):min(len(js),i+1500)])
                  start=i+len(t)
              print('COUNT',n)
          print('\n===== REGISTRATION SNIPPET =====')
          print(sn)
          print('===== END SNIPPET =====')
          PY
          REMOTE
