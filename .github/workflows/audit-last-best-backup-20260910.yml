name: Audit Last Best Funnel Backup 20260910

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-last-best-backup-20260910.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deep read-only Sep4-Sep5 AI Video candidate audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== LIVE NOW ==='
          curl -fsSL --max-time 20 'https://sikhadenge.in/masterclass/ai-video?audit=sep45-main' -o /tmp/live-ai.html
          echo "LIVE_SHA=$(sha256sum /tmp/live-ai.html | awk '{print $1}') LIVE_BYTES=$(wc -c </tmp/live-ai.html)"
          grep -Eo 'ai-video-ui-v[0-9]+[^"< ]*|Create cinematic AI videos|30 Crore|Six blocks[^<]{0,80}|Understand the tools behind[^<]{0,100}|Real learners[^<]{0,100}' /tmp/live-ai.html | head -40 || true

          echo '=== ALL RELEASE DIRS SEP3-SEP6 ==='
          find /var/www/sikhadenge.in/releases -maxdepth 1 -mindepth 1 -type d -newermt '2026-09-03 00:00:00' ! -newermt '2026-09-07 00:00:00' -printf '%TY-%Tm-%Td %TH:%TM:%TS|%p\n' 2>/dev/null | sort

          echo '=== ALL BACKUP DIRS SEP3-SEP6 ==='
          find /var/backups/sikhadenge -maxdepth 1 -mindepth 1 -type d -newermt '2026-09-03 00:00:00' ! -newermt '2026-09-07 00:00:00' -printf '%TY-%Tm-%Td %TH:%TM:%TS|%p\n' 2>/dev/null | sort

          echo '=== AI HERO FILES IN SEP3-SEP6 BACKUPS ==='
          find /var/backups/sikhadenge -type f -newermt '2026-09-03 00:00:00' ! -newermt '2026-09-07 00:00:00' -size -4M -print0 2>/dev/null | xargs -0 grep -Ilm1 'Create cinematic AI videos' 2>/dev/null | head -160 | while read -r f; do
            echo "FILE=$f"
            stat -c 'MTIME=%y BYTES=%s' "$f"
            echo "SHA=$(sha256sum "$f" | awk '{print $1}')"
            grep -Eo 'ai-video-ui-v[0-9]+[^"< ]*|Create cinematic AI videos|30 Crore|Six blocks[^<]{0,80}|Understand the tools behind[^<]{0,100}|Real learners[^<]{0,100}' "$f" 2>/dev/null | head -20 || true
          done

          echo '=== AI HERO FILES IN SEP3-SEP6 RELEASES ==='
          find /var/www/sikhadenge.in/releases -type f -newermt '2026-09-03 00:00:00' ! -newermt '2026-09-07 00:00:00' -size -4M -print0 2>/dev/null | xargs -0 grep -Ilm1 'Create cinematic AI videos' 2>/dev/null | head -160 | while read -r f; do
            echo "FILE=$f"
            stat -c 'MTIME=%y BYTES=%s' "$f"
            echo "SHA=$(sha256sum "$f" | awk '{print $1}')"
          done

          echo '=== NGINX AI ROUTE ==='
          nginx -T 2>/dev/null | awk '/location = \/masterclass\/ai-video/ {show=1;d=0} show{print} show&&/{/{d++} show&&/}/{d--;if(d<=0)exit}' || true
          REMOTE

# sep4-sep5 main-page deep audit: 20260910-0340