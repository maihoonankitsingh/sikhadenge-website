name: Inspect Home Tools Active Route 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-home-tools-active-route-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Identify active route source
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          echo '=== ROUTE FILE CANDIDATES ==='
          for f in "$ROOT/app/page.tsx" "$ROOT/app/landing/page.tsx" "$ROOT/pages/index.tsx" "$ROOT/src/app/page.tsx"; do
            if [ -e "$f" ]; then
              stat -c '%y %s %n' "$f"
              grep -nE 'redirect\(|landing|AI Tools You Will Master|ToolsLogosSection|TOOLS ECOSYSTEM|tool\.icon|tool\.category' "$f" | head -50 || true
            else echo "MISSING $f"; fi
          done
          echo '=== ALL EXACT MATCH FILES ==='
          mapfile -t FILES < <(for d in app src pages components; do [ -d "$ROOT/$d" ] && grep -RIlF --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git 'AI Tools You Will Master' "$ROOT/$d" 2>/dev/null || true; done | sort -u)
          printf 'COUNT=%s\n' "${#FILES[@]}"
          for f in "${FILES[@]}"; do
            stat -c '%y %s %n' "$f"
            n=$(grep -nF 'AI Tools You Will Master' "$f" | head -1 | cut -d: -f1)
            a=$((n>30?n-30:1)); b=$((n+55))
            echo "--- SNIP $f $a-$b ---"
            sed -n "${a},${b}p" "$f" | grep -E 'AI Tools You Will Master|TOOLS ECOSYSTEM|aiTools\.map|tool\.icon|tool\.logo|tool\.category|img|Image|rounded|gradient|category|tool.name|Practical workflows|Guided execution|Portfolio-ready output' || true
          done
          echo '=== LIVE UNIQUE MARKERS ==='
          H=$(mktemp); trap 'rm -f "$H"' EXIT
          curl -L --compressed -ksS https://sikhadenge.in/ -o "$H"
          for s in 'Practical workflows' 'Guided execution' 'Portfolio-ready output' 'TOOLS ECOSYSTEM' 'ASSISTANT' 'PRESENTATION'; do
            printf '%s=' "$s"; grep -Foc "$s" "$H" || true
          done
          echo '=== BUILD ID / APP ROUTE MANIFEST ==='
          [ -f "$ROOT/.next/BUILD_ID" ] && cat "$ROOT/.next/BUILD_ID" || true
          if [ -f "$ROOT/.next/server/app-paths-manifest.json" ]; then node -e 'const x=require(process.argv[1]); console.log(JSON.stringify(Object.fromEntries(Object.entries(x).filter(([k])=>k==="/page"||k.includes("landing"))),null,2))' "$ROOT/.next/server/app-paths-manifest.json"; fi
          REMOTE
