name: Deploy Registration Stable V72 First Paint 20260903

on:
  push:
    paths:
      - .github/workflows/deploy-registration-stable-v72-first-paint-20260903.yml
      - ops/deploy-registration-stable-v72-first-paint.sh

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: whatsapp-agent-production
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Deploy guarded stable V72 assets
        shell: bash
        run: bash ops/deploy-registration-stable-v72-first-paint.sh

      - name: Browser QA both sources desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          for item in \
            'ai|https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=ai-video-masterclass&qa=stablev72' \
            'claude|https://sikhadenge.in/gen-ai-masterclass/register-one-step?qa=stablev72'; do
            name="${item%%|*}"
            url="${item#*|}"

            for size in '1440,1000' '390,900'; do
              key="${size/,/x}"
              dom="$RUNNER_TEMP/${name}-${key}.html"

              "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --virtual-time-budget=10000 \
                --window-size="$size" \
                --dump-dom "$url" > "$dom"

              grep -Fq 'sdreg72-ready' "$dom"
              grep -Fq 'Your Details' "$dom"
              grep -Fq 'About You' "$dom"
              grep -Fq 'Your Goal' "$dom"
              grep -Fq 'Bonuses' "$dom"
              grep -Fq 'Confirmation' "$dom"

              echo "BROWSER_QA_PASS $name $size"
            done
          done
