name: Deploy Claude Exact AI Video Proof 20260902

on:
  push:
    paths:
      - .github/workflows/deploy-claude-exact-ai-video-proof-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy only the Claude proof replacement
        shell: bash
        env:
          CLAUDE_PROOF_JS_B64: ""
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "CLAUDE_PROOF_JS_B64='$CLAUDE_PROOF_JS_B64' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          NG="/etc/nginx/sites-enabled/sikhadenge.in-ssl"
          ASSET="/var/www/sikhadenge.in/claude-proof-exact-v1.js"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-proof-exact-$TS"

          test -f "$NG"
          mkdir -p "$BACKUP"
          cp "$NG" "$BACKUP/sikhadenge.in-ssl.before"
          if [[ -f "$ASSET" ]]; then
            cp "$ASSET" "$BACKUP/claude-proof-exact-v1.js.before"
          fi

          rollback() {
            set +e
            cp "$BACKUP/sikhadenge.in-ssl.before" "$NG"
            if [[ -f "$BACKUP/claude-proof-exact-v1.js.before" ]]; then
              cp "$BACKUP/claude-proof-exact-v1.js.before" "$ASSET"
            else
              rm -f "$ASSET"
            fi
            nginx -t && systemctl reload nginx
          }
          trap 'rc=$?; echo "DEPLOY FAILED rc=$rc"; rollback; exit $rc' ERR

          printf '%s' "$CLAUDE_PROOF_JS_B64" | base64 --decode > "$ASSET"
          chmod 0644 "$ASSET"

          python3 - "$NG" <<'PY'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          text = path.read_text()

          route = "location = /masterclass/claude/free {"
          start = text.find(route)
          if start < 0:
              raise SystemExit("Claude exact route not found")

          end = text.find("\n    }", start)
          if end < 0:
              raise SystemExit("Claude exact route closing brace not found")
          end += len("\n    }")

          segment = text[start:end]
          script = '<script src="/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902"></script>'

          pattern = re.compile(
              r'(<script src="/sitewide-live-proof-assets/sitewide-live-proof-v1\.js\?v=[^"]+"></script>)'
              r'(?:<script src="/claude-proof-exact-v1\.js\?v=[^"]+"></script>)?'
          )
          updated, count = pattern.subn(lambda m: m.group(1) + script, segment, count=1)
          if count != 1 and script not in segment:
              raise SystemExit("Claude sitewide sub_filter injection anchor not found")

          text = text[:start] + updated + text[end:]

          marker = "# CLAUDE_EXACT_AI_VIDEO_PROOF_ASSET_V1"
          if marker not in text:
              anchor = "# SIKHADENGE_SCANNER_GUARD_V1"
              if anchor not in text:
                  raise SystemExit("Nginx asset insertion anchor not found")
              block = """# CLAUDE_EXACT_AI_VIDEO_PROOF_ASSET_V1
          location = /claude-proof-exact-v1.js {
              alias /var/www/sikhadenge.in/claude-proof-exact-v1.js;
              default_type application/javascript;
              add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
              access_log off;
          }
          # CLAUDE_EXACT_AI_VIDEO_PROOF_ASSET_V1_END

          """
              text = text.replace(anchor, block + anchor, 1)

          path.write_text(text)
          PY

          nginx -t
          systemctl reload nginx

          sleep 1

          echo "===== VERIFY ASSET ====="
          curl -fsS --max-time 20 https://sikhadenge.in/claude-proof-exact-v1.js | grep -Fq "__CLAUDE_EXACT_AI_VIDEO_PROOF_V1__"

          echo "===== VERIFY CLAUDE INJECTION ====="
          HTML="$(mktemp)"
          curl -fsS --max-time 25 https://sikhadenge.in/masterclass/claude/free -o "$HTML"
          test "$(grep -o '/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902' "$HTML" | wc -l)" -eq 1
          grep -Fq 'Why AI-skilled professionals' "$HTML"
          grep -Fq 'sitewide-live-proof-v1.js' "$HTML"

          echo "BACKUP=$BACKUP"
          echo "NGINX_AND_ASSET_OK"
          trap - ERR
          REMOTE

      - name: Verify rendered Claude DOM in headless Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          DOM="$RUNNER_TEMP/claude-rendered.html"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=18000 \
            --dump-dom \
            "https://sikhadenge.in/masterclass/claude/free?proofverify=20260902" > "$DOM"

          grep -Fq 'data-claude-exact-ai-video-proof="ready"' "$DOM"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$DOM" | wc -l)" -eq 1
          grep -Fq 'AI &amp; automation are reshaping' "$DOM"
          grep -Fq 'hundreds of millions of jobs' "$DOM"
          grep -Fq '30 Crore' "$DOM"
          grep -Fq '40 Crore' "$DOM"
          grep -Fq '9.2 Crore' "$DOM"
          grep -Fq '+69%' "$DOM"
          grep -Fq '+78M' "$DOM"
          grep -Fq '10.35M' "$DOM"

          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$DOM"; then
            echo "Old AI Shift section still rendered"
            exit 1
          fi

          echo "RENDERED_EXACT_PROOF_OK"
