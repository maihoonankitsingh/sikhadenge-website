name: Deploy Claude Hide Old Proof V2 20260902

on:
  push:
    paths:
      - .github/workflows/deploy-claude-hide-old-proof-v2-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepend immediate hide guard to live Claude proof runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ASSET='/var/www/sikhadenge.in/claude-proof-exact-v1.js'
          SOURCE='https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/864d445b52af02cad90b3b510caf5b6310a510d2/public/claude-proof-hide-old-v2.js'
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-proof-fast-hide-$TS"
          test -f "$ASSET"
          mkdir -p "$BACKUP"
          cp "$ASSET" "$BACKUP/claude-proof-exact-v1.js.before"
          if ! grep -Fq '__CLAUDE_HIDE_OLD_PROOF_V2__' "$ASSET"; then
            HIDE="$(mktemp)"
            NEW="$(mktemp)"
            curl -fsSL --max-time 30 "$SOURCE" -o "$HIDE"
            grep -Fq '__CLAUDE_HIDE_OLD_PROOF_V2__' "$HIDE"
            cat "$HIDE" "$ASSET" > "$NEW"
            install -m 0644 "$NEW" "$ASSET"
          fi
          curl -fsS --max-time 20 'https://sikhadenge.in/claude-proof-exact-v1.js?v=fast-hide-v2' | grep -Fq '__CLAUDE_HIDE_OLD_PROOF_V2__'
          echo "BACKUP=$BACKUP"
          echo 'RUNTIME_FAST_HIDE_INSTALLED'
          REMOTE

      - name: Verify fast hide and final exact replacement in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          FAST="$RUNNER_TEMP/claude-fast.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1500 --dump-dom 'https://sikhadenge.in/masterclass/claude/free?v=fast-hide-v2' > "$FAST"
          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$FAST"; then
            grep -Fq 'data-claude-old-proof-hidden="1"' "$FAST"
          fi
          echo 'FAST_OLD_SECTION_NOT_VISIBLE_OK'
          FINAL="$RUNNER_TEMP/claude-final.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom 'https://sikhadenge.in/masterclass/claude/free?v=fast-hide-v2-final' > "$FINAL"
          grep -Fq 'data-claude-exact-ai-video-proof="ready"' "$FINAL"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$FINAL" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$FINAL" | wc -l)" -eq 1
          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$FINAL"; then
            echo 'Old proof still present after final mount'
            exit 1
          fi
          echo 'FINAL_EXACT_REPLACEMENT_OK'
