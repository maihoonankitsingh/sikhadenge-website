name: Deploy Claude Hide Old Proof V2 20260902

on:
  push:
    paths:
      - .github/workflows/deploy-claude-hide-old-proof-v2-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy immediate old-section hide guard
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          NG="/etc/nginx/sites-enabled/sikhadenge.in-ssl"
          ASSET="/var/www/sikhadenge.in/claude-proof-hide-old-v2.js"
          SOURCE="https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/864d445b52af02cad90b3b510caf5b6310a510d2/public/claude-proof-hide-old-v2.js"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-hide-old-proof-v2-$TS"

          test -f "$NG"
          mkdir -p "$BACKUP"
          cp "$NG" "$BACKUP/sikhadenge.in-ssl.before"
          [[ ! -f "$ASSET" ]] || cp "$ASSET" "$BACKUP/claude-proof-hide-old-v2.js.before"

          rollback() {
            set +e
            cp "$BACKUP/sikhadenge.in-ssl.before" "$NG"
            if [[ -f "$BACKUP/claude-proof-hide-old-v2.js.before" ]]; then
              cp "$BACKUP/claude-proof-hide-old-v2.js.before" "$ASSET"
            else
              rm -f "$ASSET"
            fi
            nginx -t && systemctl reload nginx
          }
          trap 'rc=$?; echo "DEPLOY FAILED rc=$rc"; rollback; exit $rc' ERR

          TMP="$(mktemp)"
          curl -fsSL --max-time 30 "$SOURCE" -o "$TMP"
          grep -Fq "__CLAUDE_HIDE_OLD_PROOF_V2__" "$TMP"
          install -m 0644 "$TMP" "$ASSET"

          python3 - "$NG" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          route='location = /masterclass/claude/free {'
          start=s.find(route)
          if start < 0:
              raise SystemExit('Claude exact route not found')
          end=s.find('\n    }', start)
          if end < 0:
              raise SystemExit('Claude route end not found')
          end += len('\n    }')
          seg=s[start:end]
          hide='<script src="/claude-proof-hide-old-v2.js?v=20260902-2300"></script>'
          proof='<script src="/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902"></script>'
          if hide not in seg:
              if proof in seg:
                  seg=seg.replace(proof, hide+proof, 1)
              else:
                  marker='</body>'
                  pos=seg.find(marker)
                  if pos < 0:
                      raise SystemExit('No body injection anchor in Claude route')
                  seg=seg[:pos]+hide+seg[pos:]
          s=s[:start]+seg+s[end:]
          asset_marker='# CLAUDE_HIDE_OLD_PROOF_V2_ASSET'
          if asset_marker not in s:
              insertion='''# CLAUDE_HIDE_OLD_PROOF_V2_ASSET
          location = /claude-proof-hide-old-v2.js {
              alias /var/www/sikhadenge.in/claude-proof-hide-old-v2.js;
              default_type application/javascript;
              add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
              access_log off;
          }
          # CLAUDE_HIDE_OLD_PROOF_V2_ASSET_END

          '''
              anchor='# SIKHADENGE_SCANNER_GUARD_V1'
              if anchor in s:
                  s=s.replace(anchor, insertion+anchor, 1)
              else:
                  idx=s.find(route)
                  if idx < 0:
                      raise SystemExit('Could not place hide asset location')
                  s=s[:idx]+insertion+s[idx:]
          p.write_text(s)
          PY

          nginx -t
          systemctl reload nginx
          sleep 1

          echo '===== VERIFY SERVER HTML ====='
          curl -fsS --max-time 20 https://sikhadenge.in/claude-proof-hide-old-v2.js | grep -Fq '__CLAUDE_HIDE_OLD_PROOF_V2__'
          HTML="$(mktemp)"
          curl -fsS --max-time 25 'https://sikhadenge.in/masterclass/claude/free?v=hide-old-proof-v2' -o "$HTML"
          test "$(grep -o '/claude-proof-hide-old-v2.js?v=20260902-2300' "$HTML" | wc -l)" -eq 1
          grep -Fq '/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902' "$HTML"
          grep -Fq '/api/social-proof/live?widget=1' "$HTML"
          echo "BACKUP=$BACKUP"
          echo 'SERVER_INJECTION_OK'
          trap - ERR
          REMOTE

      - name: Verify fast hide and final exact replacement in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          FAST="$RUNNER_TEMP/claude-fast.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1500 --dump-dom \
            'https://sikhadenge.in/masterclass/claude/free?v=hide-old-proof-v2-fast' > "$FAST"

          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$FAST"; then
            grep -Fq 'data-claude-old-proof-hidden="1"' "$FAST"
          fi
          echo 'FAST_OLD_SECTION_NOT_VISIBLE_OK'

          FINAL="$RUNNER_TEMP/claude-final.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom \
            'https://sikhadenge.in/masterclass/claude/free?v=hide-old-proof-v2-final' > "$FINAL"

          grep -Fq 'data-claude-exact-ai-video-proof="ready"' "$FINAL"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$FINAL" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$FINAL" | wc -l)" -eq 1
          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$FINAL"; then
            echo 'Old proof still present after final mount'
            exit 1
          fi
          echo 'FINAL_EXACT_REPLACEMENT_OK'
