name: Footer Professional Live Deploy 20260904
on:
  push:
    paths:
      - '.github/workflows/footer-professional-live-deploy-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy footer only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          FOOTER_COMMIT='f288528bbbe67c6cf86b6cbd60893e9227d362c6'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/components/Footer.tsx"
          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/tmp/sd-footer-pro-v2-$TS"
          BAK="/var/backups/sikhadenge/footer-professional-v2-$TS"
          STAGE="$LIVE/.next.footer-v2-stage-$TS"
          ROLLBACK_STAGE="$LIVE/.next.footer-v2-rollback-$TS"
          OLDNEXT="$LIVE/.next.pre-footer-v2-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT

          test -f "$SRC"
          grep -q 'FOOTERLESS_CHECKOUT_PATH' "$SRC"
          grep -q 'sikhadenge-header-safe-320.png' "$SRC"
          cp -a "$SRC" "$BAK/Footer.tsx.before"
          cp -a "$LIVE/.next" "$BAK/.next.before"

          rsync -a --delete --exclude node_modules --exclude .next "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/$FOOTER_COMMIT/components/Footer.tsx" -o "$CAND/components/Footer.tsx"

          NEW="$CAND/components/Footer.tsx"
          test -s "$NEW"
          grep -q 'FOOTERLESS_CHECKOUT_PATH' "$NEW"
          grep -q 'sikhadenge-header-safe-320.png' "$NEW"
          grep -q 'instagram.com/sikhadenge.institute' "$NEW"
          grep -q 'linkedin.com/company/sikhadenge' "$NEW"
          grep -q 'pinterest.com/sikhadenge' "$NEW"
          grep -q 'wa.me/918808505575' "$NEW"
          grep -q 'function SocialIcon' "$NEW"
          grep -q 'footer-instagram-gradient' "$NEW"
          grep -q 'fill="#0A66C2"' "$NEW"
          grep -q 'fill="#E60023"' "$NEW"
          grep -q 'fill="#25D366"' "$NEW"
          if grep -q 'cdn.simpleicons.org' "$NEW"; then echo EXTERNAL_ICON_CDN_STILL_PRESENT; exit 1; fi

          echo '=== FOOTER-ONLY SOURCE DIFF ==='
          diff -u "$SRC" "$NEW" || true

          cd "$CAND"
          npm run build

          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]

          rm -rf "$STAGE" "$ROLLBACK_STAGE"
          cp -a "$CAND/.next" "$STAGE"
          cp -a "$BAK/.next.before" "$ROLLBACK_STAGE"
          test -f "$STAGE/BUILD_ID"
          test -f "$ROLLBACK_STAGE/BUILD_ID"

          rollback(){
            echo ROLLBACK_START
            cp -a "$BAK/Footer.tsx.before" "$SRC" || true
            if [ -d "$LIVE/.next" ]; then mv "$LIVE/.next" "$LIVE/.next.failed-footer-v2-$TS" || true; fi
            if [ -d "$ROLLBACK_STAGE" ]; then mv "$ROLLBACK_STAGE" "$LIVE/.next" || true; else cp -a "$BAK/.next.before" "$LIVE/.next" || true; fi
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
          }

          cp -a "$NEW" "$SRC"
          if [ -d "$LIVE/.next" ]; then mv "$LIVE/.next" "$OLDNEXT"; fi
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 6

          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?footerv2=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?footerv2=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then rollback; exit 1; fi

          for needle in \
            'instagram.com/sikhadenge.institute' \
            'linkedin.com/company/sikhadenge' \
            'pinterest.com/sikhadenge' \
            'wa.me/918808505575' \
            'ThinkGrow Pvt. Ltd. Practical, future-ready learning' \
            'Working hours: 10:00 AM - 7:00 PM' \
            'mailto:support@sikhadenge.in' \
            'tel:+918808505575'; do
            if ! grep -q "$needle" "$P"; then echo "MISSING=$needle"; rollback; exit 1; fi
          done

          if grep -q 'href="https://www.instagram.com/"' "$P"; then echo OLD_GENERIC_INSTAGRAM_PRESENT; rollback; exit 1; fi
          if grep -q 'href="https://www.linkedin.com/"' "$P"; then echo OLD_GENERIC_LINKEDIN_PRESENT; rollback; exit 1; fi

          echo "BACKUP=$BAK"
          echo "PREVIOUS_NEXT=$OLDNEXT"
          echo 'FOOTER_PROFESSIONAL_LIVE_OK=1 FOOTER_ONLY=1 VERIFIED_SOCIAL_LINKS=1 LOCAL_SOCIAL_SVGS=1'
          REMOTE
# trigger 3
