name: Verify Two Funnel Golden Lock Temp 20260910

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-two-funnel-golden-lock-temp-20260910.yml']

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  server-lock-qa:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 7
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify timer service seal and deep check
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer | grep -qx enabled
          systemctl is-active sikhadenge-funnel-golden-guard.timer | grep -qx active
          test -L /var/lib/sikhadenge-funnel-golden-lock/current
          /usr/local/sbin/sikhadenge-funnel-lockctl check
          echo '=== SERVICE ==='
          systemctl show sikhadenge-funnel-golden-guard.service -p Result -p ExecMainStatus -p ActiveEnterTimestamp -p InactiveEnterTimestamp
          echo '=== TIMER ==='
          systemctl list-timers sikhadenge-funnel-golden-guard.timer --no-pager
          echo '=== RECENT GUARD LOG ==='
          tail -20 /var/log/sikhadenge-funnel-golden-lock.log
          echo 'SERVER_GOLDEN_LOCK_QA=PASS'
          REMOTE

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install chromium
      - name: Verify both locked pages desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const pages=[
            {name:'ai',url:'https://sikhadenge.in/masterclass/ai-video?golden-browser=1',markers:['Create cinematic AI videos','Six blocks','Understand the tools'],grids:['.ai-video-masterclass_outcomeGrid__1PlgA','.ai-video-masterclass_moduleGrid__LvmU9','.ai-video-masterclass_toolGrid__kIEhe']},
            {name:'claude',url:'https://sikhadenge.in/masterclass/claude/free?golden-browser=1',markers:['AI tools','better results'],grids:[]}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              for(const target of pages){
                const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
                const bad=[];
                page.on('response',r=>{const p=new URL(r.url()).pathname;if((p.endsWith('.css')||p.endsWith('.js'))&&r.status()>=400)bad.push([r.status(),r.url()]);});
                const resp=await page.goto(target.url+'&vp='+vp.name,{waitUntil:'networkidle',timeout:90000});
                if(!resp||resp.status()!==200) throw new Error(`${target.name}/${vp.name} HTTP ${resp&&resp.status()}`);
                await page.waitForTimeout(1000);
                const body=await page.locator('body').innerText();
                for(const m of target.markers) if(!body.toLowerCase().includes(m.toLowerCase())) throw new Error(`${target.name}/${vp.name} marker missing ${m}`);
                for(const sel of target.grids){const el=page.locator(sel).first();if(!await el.count())throw new Error(`${target.name}/${vp.name} selector missing ${sel}`);const d=await el.evaluate(e=>getComputedStyle(e).display);if(d!=='grid')throw new Error(`${target.name}/${vp.name} ${sel} display=${d}`);}
                const overflow=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-window.innerWidth);
                if(overflow>6) console.log(`WARN_HORIZONTAL_OVERFLOW ${target.name}/${vp.name} px=${overflow}`);
                if(bad.length) throw new Error(`${target.name}/${vp.name} failed CSS/JS ${JSON.stringify(bad)}`);
                console.log(`BROWSER_QA=PASS page=${target.name} viewport=${vp.name} overflow=${overflow}`);
                await page.close();
              }
            }
            await browser.close(); console.log('REAL_BROWSER_BOTH_LOCKED_PAGES=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
