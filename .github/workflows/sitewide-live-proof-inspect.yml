name: Sitewide Live Proof Inspect

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Inspect live architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata

          echo '===== NGINX SIKHADENGE SITE ====='
          for f in /etc/nginx/sites-enabled/sikhadenge.in /etc/nginx/sites-enabled/sikhadenge.in-ssl; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -n '1,260p' "$f"
            fi
          done

          echo '===== NGINX GLOBAL / SUB_FILTER REFERENCES ====='
          grep -RniE 'sub_filter|registration-v2-page1|social-proof|register-one-step' /etc/nginx 2>/dev/null | head -n 260 || true

          echo '===== PM2 APPS ====='
          pm2 jlist 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{for(const x of JSON.parse(s)){console.log(JSON.stringify({name:x.name,pid:x.pid,status:x.pm2_env?.status,cwd:x.pm2_env?.pm_cwd,script:x.pm2_env?.pm_exec_path,args:x.pm2_env?.args}))}}catch(e){console.error(e.message)}})
          ' || true

          echo '===== LISTENERS ====='
          ss -lntp | grep -E ':(3000|3100|3200|3300|3400|3500|3600|3700|3800|3900|3942|4000|4100|4200|4300|4400|4500|5000|8000|8080)\b' || true

          echo '===== SOCIAL PROOF SOURCE FILES ====='
          mapfile -t files < <(grep -RIl --exclude='*.map' --exclude-dir=node_modules --exclude-dir=.next/cache '/api/social-proof/live\|SD_REAL_ACTIVITY_V10_START\|LIVE ACTIVITY' /var/www /opt 2>/dev/null | head -n 40)
          printf '%s\n' "${files[@]:-}"
          for f in "${files[@]:-}"; do
            [ -f "$f" ] || continue
            echo "--- FILE: $f ---"
            grep -nEi -C 12 '/api/social-proof/live|SD_REAL_ACTIVITY_V10_START|LIVE ACTIVITY' "$f" | head -n 220 || true
          done

          echo '===== REGISTRATION ROUTE SOURCE FILES ====='
          mapfile -t regfiles < <(grep -RIl --exclude='*.map' --exclude-dir=node_modules --exclude-dir=.next/cache 'register-one-step\|registration.*create\|registrations' /var/www /opt 2>/dev/null | head -n 50)
          printf '%s\n' "${regfiles[@]:-}"
          for f in "${regfiles[@]:-}"; do
            [ -f "$f" ] || continue
            case "$f" in
              *.js|*.ts|*.tsx|*.mjs|*.cjs|*.conf|*.json)
                echo "--- FILE: $f ---"
                grep -nEi -C 10 'social-proof|register-one-step|registration.*create|registrations' "$f" | head -n 220 || true
                ;;
            esac
          done

          echo '===== PUBLIC API SHAPE (SANITIZED KEYS ONLY) ====='
          curl -L --compressed -fsS 'https://sikhadenge.in/api/social-proof/live?inspect=1' | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const o=JSON.parse(s);const out={};for(const [k,v] of Object.entries(o)){out[k]=Array.isArray(v)?`array(${v.length})`:v&&typeof v==="object"?Object.keys(v):typeof v;}console.log(JSON.stringify(out))}catch(e){console.log("NON_JSON")}})
          ' || true

          echo '===== NGINX FULL CONFIG ROUTING EXCERPT ====='
          nginx -T 2>/dev/null | grep -nEi -C 8 'server_name sikhadenge\.in|api/social-proof|registration-v2-page1|register-one-step|proxy_pass' | head -n 500 || true
          REMOTE
