name: Sitewide Live Proof Inspect

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Inspect exact HTML routes and immutable SHAs
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SITE=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          REG=/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf
          AV=/etc/nginx/snippets/sikhadenge-ai-video-3940.conf
          SP=/var/www/sikhadenge.in/social-proof-live/server.js
          PAGE1="$(awk '/location = \/registration-v2-page1\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$REG")"
          HOT="$(awk '/location = \/registration-v2-hot\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$REG")"

          echo '===== SHA GUARDS ====='
          sha256sum "$SITE" "$REG" "$AV" "$SP" "$PAGE1" "$HOT"

          echo '===== SITE 1-90 ====='
          sed -n '1,90p' "$SITE"
          echo '===== SITE 230-395 ====='
          sed -n '230,395p' "$SITE"
          echo '===== ALL PROXY HTML LOCATIONS ====='
          awk '
            /^[[:space:]]*location[[:space:]]/ {loc=$0}
            /proxy_pass[[:space:]]+http:\/\/127\.0\.0\.1:(3930|3940|3955)/ {print loc " => " $0}
          ' "$SITE"
          echo '===== AI VIDEO ROUTE HEAD ====='
          sed -n '1,70p' "$AV"
          REMOTE
