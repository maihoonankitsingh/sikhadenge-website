name: Sitewide Live Proof Inspect

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Inspect production architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata

          echo '===== NGINX SITE FILES ====='
          ls -l /etc/nginx/sites-enabled/sikhadenge* 2>/dev/null || true
          for f in /etc/nginx/sites-enabled/sikhadenge.in /etc/nginx/sites-enabled/sikhadenge.in-ssl; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -n '1,340p' "$f"
          done

          echo '===== REGISTRATION HOT SNIPPET ====='
          SNIP=/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf
          [ -f "$SNIP" ] && sed -n '1,320p' "$SNIP" || true

          echo '===== PM2 SUMMARY ====='
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{for(const x of JSON.parse(s)){console.log(JSON.stringify({name:x.name,pid:x.pid,status:x.pm2_env?.status,cwd:x.pm2_env?.pm_cwd,script:x.pm2_env?.pm_exec_path,args:x.pm2_env?.args}))}}catch(e){}})' || true

          echo '===== KNOWN REGISTRATION ASSET ====='
          PAGE1="$(awk '/location = \/registration-v2-page1\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP" 2>/dev/null || true)"
          HOT="$(awk '/location = \/registration-v2-hot\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP" 2>/dev/null || true)"
          echo "PAGE1=$PAGE1"
          echo "HOT=$HOT"
          [ -f "$PAGE1" ] && grep -nEi -C 14 '/api/social-proof/live|LIVE ACTIVITY|SD_REAL_ACTIVITY' "$PAGE1" | head -n 280 || true
          [ -f "$HOT" ] && grep -nEi -C 12 'registration|lead|api/' "$HOT" | head -n 260 || true

          echo '===== PM2 SOURCE TARGETS ====='
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{for(const x of JSON.parse(s)){const c=x.pm2_env?.pm_cwd;if(c&&(/sikhadenge/i.test(x.name)||/sikhadenge/i.test(c))) console.log(c)}catch(e){}})' | sort -u | while read -r d; do
            [ -d "$d" ] || continue
            echo "--- CWD $d ---"
            timeout 8s grep -RIl --include='*.js' --include='*.ts' --include='*.tsx' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.next '/api/social-proof/live' "$d" 2>/dev/null | head -n 20 || true
            timeout 8s grep -RIl --include='*.js' --include='*.ts' --include='*.tsx' --include='*.mjs' --exclude-dir=node_modules --exclude-dir=.next 'register-one-step' "$d" 2>/dev/null | head -n 20 || true
          done

          echo '===== SOCIAL API RESPONSE KEYS ====='
          curl -L --compressed -fsS 'https://sikhadenge.in/api/social-proof/live?inspect=2' | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const o=JSON.parse(s);console.log(JSON.stringify({keys:Object.keys(o),nested:Object.fromEntries(Object.entries(o).filter(([,v])=>v&&typeof v==="object").map(([k,v])=>[k,Object.keys(v)]))}))}catch(e){console.log("NON_JSON")}})' || true

          echo '===== NGINX ROUTING REFERENCES ====='
          grep -RniE 'social-proof|register-one-step|registration-v2-page1|sub_filter' /etc/nginx/sites-enabled /etc/nginx/snippets 2>/dev/null | head -n 360 || true
          REMOTE
