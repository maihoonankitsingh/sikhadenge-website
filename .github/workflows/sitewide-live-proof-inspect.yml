name: Sitewide Live Proof Inspect

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Inspect social proof and injection points
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata

          echo '===== SOCIAL PROOF SERVER ====='
          SP=/var/www/sikhadenge.in/social-proof-live/server.js
          test -f "$SP"
          stat -c 'file=%n mtime=%y size=%s' "$SP"
          sha256sum "$SP"
          sed -n '1,360p' "$SP"

          echo '===== SOCIAL PROOF DIRECTORY ====='
          find /var/www/sikhadenge.in/social-proof-live -maxdepth 2 -type f -printf '%p\n' | sort | head -n 100

          echo '===== API RESPONSE SANITIZED ====='
          curl -L --compressed -fsS 'https://sikhadenge.in/api/social-proof/live?inspect=3' | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const o=JSON.parse(s);const sanitize=(v)=>{if(Array.isArray(v))return v.map(x=>x&&typeof x==="object"?Object.keys(x):typeof x);if(v&&typeof v==="object")return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,x&&typeof x==="object"?Object.keys(x):typeof x]));return typeof v};console.log(JSON.stringify({keys:Object.keys(o),shape:sanitize(o)}))}catch(e){console.log("NON_JSON")}})'

          echo '===== ALL SUB_FILTER DIRECTIVES ====='
          grep -RniE 'sub_filter(_once|_types)?[[:space:]]|Accept-Encoding' /etc/nginx/sites-enabled /etc/nginx/snippets 2>/dev/null | head -n 500 || true

          echo '===== AI VIDEO SNIPPET ====='
          AV=/etc/nginx/snippets/sikhadenge-ai-video-3940.conf
          [ -f "$AV" ] && sed -n '1,320p' "$AV" || true

          echo '===== MAIN DEFAULT LOCATION ====='
          SITE=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          grep -nE '^[[:space:]]*location[[:space:]]+/|proxy_pass http://127\.0\.0\.1:3955' "$SITE" | tail -n 40 || true
          LINE="$(grep -nE '^[[:space:]]*location[[:space:]]+/[[:space:]]*\{' "$SITE" | tail -1 | cut -d: -f1 || true)"
          if [ -n "$LINE" ]; then
            START=$((LINE-10)); [ "$START" -lt 1 ] && START=1
            END=$((LINE+140))
            sed -n "${START},${END}p" "$SITE"
          fi

          echo '===== LEAD API SOURCE CANDIDATES ====='
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          find "$ROOT" -maxdepth 6 -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' -not -path '*/.next/*' -print0 2>/dev/null | xargs -0 grep -Il '/api/masterclass/lead\|masterclass/lead' 2>/dev/null | head -n 40 | while read -r f; do
            echo "--- $f ---"
            grep -nEi -C 18 'masterclass/lead|MasterclassLead|registration' "$f" | head -n 260 || true
          done
          REMOTE
