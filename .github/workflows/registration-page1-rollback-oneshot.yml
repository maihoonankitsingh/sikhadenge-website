name: Registration Page1 Rollback One-Shot

on:
  push:
    paths:
      - .github/workflows/registration-page1-rollback-oneshot.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  restore-page1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Guarded production restore
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata
          SNIPPET="/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf"
          CAND="/var/backups/sikhadenge/mobile-step3-fit-v18-20260902-102442/page1.before"
          EXPECT_CAND_SHA="96cb8c27a3cc278bf698cd5c64223619c8542e305ebc9e0abd92f9fe9757ca40"
          EXPECT_LIVE_SHA="d4c49e811c6c390e4bdd5fd9719dc8fe1937a0b9138fab388f9b41f282d5f2c5"
          EXPECT_HOT_SHA="6e6361e54b575178cf6cad115234ab3e9c5d25d666a9e89df5a11001eab9c3d0"
          PAGE1="$(awk '/location = \/registration-v2-page1\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIPPET")"
          HOT="$(awk '/location = \/registration-v2-hot\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIPPET")"
          test -f "$PAGE1"; test -f "$HOT"; test -f "$CAND"

          echo '===== 1. IMMUTABLE GUARDS ====='
          CAND_SHA="$(sha256sum "$CAND" | awk '{print $1}')"
          LIVE_SHA="$(sha256sum "$PAGE1" | awk '{print $1}')"
          HOT_SHA="$(sha256sum "$HOT" | awk '{print $1}')"
          echo "candidate_sha=$CAND_SHA"
          echo "live_before_sha=$LIVE_SHA"
          echo "hot_sha=$HOT_SHA"
          test "$CAND_SHA" = "$EXPECT_CAND_SHA"
          test "$LIVE_SHA" = "$EXPECT_LIVE_SHA"
          test "$HOT_SHA" = "$EXPECT_HOT_SHA"
          MT="$(date -r "$CAND" '+%Y-%m-%d %H:%M:%S')"
          [[ "$MT" > '2026-09-01 22:00:00' && "$MT" < '2026-09-02 10:00:00' ]]
          echo "candidate_window=PASS ($MT IST)"
          cp -a "$CAND" /tmp/sd-page1-restore-candidate.js
          node --check /tmp/sd-page1-restore-candidate.js >/dev/null
          echo 'candidate_js_syntax=PASS'
          for required in \
            'SD_CLAUDE_V5_START' \
            'SD_REMOVE_PAGE1_SUBTITLE_START' \
            'SD_SYNC_BOTH_THEMES_START' \
            'SD_BOTH_EQUAL_SIZE_V6_START' \
            'SD_REAL_ACTIVITY_V10_START' \
            'SIKHADENGE_MOBILE_6POINTS_FULLWIDTH_V63_START' \
            'Your Details' 'About You' 'Your Goal' 'Bonuses' 'Confirmation' \
            '2 Hours Live' 'WhatsApp Community Access' \
            '5,00,000+ SikhaDenge Community' \
            'Secure Registration' 'Takes less than 1 minute' '100% Free Registration'; do
              grep -Fq "$required" "$CAND" || { echo "MISSING_REQUIRED=$required"; exit 1; }
          done
          echo 'content_guards=PASS'

          echo '===== 2. FRESH ROLLBACK BACKUP ====='
          TS="$(date +%Y%m%d-%H%M%S)"
          TAG="v67-restore-${TS}"
          BK="/var/backups/sikhadenge/page1-restore-v67-final-${TS}"
          mkdir -p "$BK"
          cp -a "$PAGE1" "$BK/registration-v2-page1.js.before"
          cp -a "$SNIPPET" "$BK/sikhadenge-registration-v2-hot.conf.before"
          sha256sum "$BK/registration-v2-page1.js.before" > "$BK/page1-before.sha256"
          sha256sum "$BK/sikhadenge-registration-v2-hot.conf.before" > "$BK/snippet-before.sha256"
          echo "rollback_backup=$BK"

          rollback() {
            set +e
            echo 'AUTO_ROLLBACK_START'
            cp -a "$BK/registration-v2-page1.js.before" "$PAGE1"
            cp -a "$BK/sikhadenge-registration-v2-hot.conf.before" "$SNIPPET"
            nginx -t && systemctl reload nginx
            echo 'AUTO_ROLLBACK_DONE'
          }
          trap 'rc=$?; if [ $rc -ne 0 ]; then rollback; fi; exit $rc' EXIT

          echo '===== 3. RESTORE EXACT 23:30 SNAPSHOT ====='
          cat "$CAND" > "$PAGE1"
          chmod --reference="$BK/registration-v2-page1.js.before" "$PAGE1"
          chown --reference="$BK/registration-v2-page1.js.before" "$PAGE1"
          node --check "$PAGE1" >/dev/null
          RESTORED_SHA="$(sha256sum "$PAGE1" | awk '{print $1}')"
          echo "restored_sha=$RESTORED_SHA"
          test "$RESTORED_SHA" = "$EXPECT_CAND_SHA"

          echo '===== 4. CACHE-BUST ONLY ====='
          export SNIPPET TAG
          python3 <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['SNIPPET'])
          s=p.read_text(encoding='utf-8')
          replacement=f'/registration-v2-page1.js?v={os.environ["TAG"]}'
          s2,n=re.subn(r'/registration-v2-page1\.js(?:\?v=[^"\x27< ]+)?', replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'cache-bust replacement count={n}')
          p.write_text(s2,encoding='utf-8')
          print('cache_bust=',replacement)
          PY
          grep -Fq "/registration-v2-page1.js?v=${TAG}" "$SNIPPET"
          nginx -t
          systemctl reload nginx
          echo 'nginx_reload=PASS'

          echo '===== 5. PUBLIC ASSET SHA ====='
          PUB="/tmp/registration-v2-page1-public-${TS}.js"
          curl -L --compressed -fsS "https://sikhadenge.in/registration-v2-page1.js?v=${TAG}" -o "$PUB"
          node --check "$PUB" >/dev/null
          PUB_SHA="$(sha256sum "$PUB" | awk '{print $1}')"
          echo "public_sha=$PUB_SHA"
          test "$PUB_SHA" = "$EXPECT_CAND_SHA"

          echo '===== 6. BOTH FUNNELS ====='
          for u in \
            "https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&restore=${TS}" \
            "https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=ai-video-masterclass&restore=${TS}" \
            "https://sikhadenge.in/gen-ai-masterclass/register-one-step?restore=${TS}"; do
              code="$(curl -L --compressed -sS -o /tmp/sd-page.html -w '%{http_code}' "$u")"
              echo "$code $u"
              test "$code" = '200'
            done

          echo '===== 7. SOCIAL PROOF API ====='
          API="$(curl -L --compressed -fsS "https://sikhadenge.in/api/social-proof/live?restore=${TS}")"
          echo "social_proof=$API"
          printf '%s' "$API" | grep -Fq '"ok":true'

          echo '===== 8. PRESERVATION ====='
          HOT_AFTER="$(sha256sum "$HOT" | awk '{print $1}')"
          echo "hot_after_sha=$HOT_AFTER"
          test "$HOT_AFTER" = "$EXPECT_HOT_SHA"
          echo -n 'snippet_tag='; grep -o "registration-v2-page1.js?v=${TAG}" "$SNIPPET" | head -1
          echo 'RESULT=PAGE1_V67_20260901_233020_RESTORED'
          echo "BACKUP=$BK"
          echo "TAG=$TAG"
          trap - EXIT
          REMOTE
