name: Sitewide Manrope Main Fontrefs 20260902

on:
  push:
    paths:
      - .github/workflows/sitewide-manrope-main-fontrefs-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Audit exact font refs
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          REG=/var/www/sikhadenge.in/registration-v2-hot-20260831-145106
          echo 'MAIN_FONTREFS_BEGIN'
          echo "MANROPE_ASSET_MAIN=$(test -f "$ROOT/public/fonts/Manrope-Variable.ttf" && echo yes || echo no)"
          echo 'LAYOUT_SNIPPET:'; sed -n '1,22p;108,124p' "$ROOT/app/layout.tsx" | grep -nEi 'font|Inter|Manrope|body' || true
          echo 'GLOBAL_SNIPPET:'; sed -n '325,365p' "$ROOT/app/globals.css" || true
          echo 'SOURCE_FILES_WITH_NON_MANROPE_FONT_DECLARATIONS:'
          find "$ROOT" -type f \( -name '*.css' -o -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*' -print0 \
            | xargs -0 grep -IlEi 'font-family[^;]*(Inter|Bricolage|Poppins|Roboto|Arial|Helvetica)' 2>/dev/null \
            | sed "s#^$ROOT/##" | sort | head -100 || true
          echo 'SOURCE_FILES_WITH_NEXT_GOOGLE_FONT:'
          find "$ROOT" -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*' -print0 \
            | xargs -0 grep -Il 'next/font/google' 2>/dev/null | sed "s#^$ROOT/##" | sort | head -100 || true
          echo 'REGISTRATION_FONT_FILES:'
          if [ -d "$REG" ]; then grep -RIlEi 'font-family[^;]*(Inter|Bricolage|Poppins|Roboto|Arial|Helvetica)' "$REG" --include='*.css' --include='*.js' 2>/dev/null | sed "s#^$REG/##" | sort | head -100 || true; fi
          echo 'MAIN_FONTREFS_END READ_ONLY=1'
          REMOTE
