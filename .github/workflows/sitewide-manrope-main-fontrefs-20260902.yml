name: Sitewide Manrope AI Video Binding QA 20260902

on:
  push:
    paths:
      - .github/workflows/sitewide-manrope-main-fontrefs-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect generated binding
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          R=/var/www/sikhadenge.in/releases/production-ai-workflow-premium-zero-build-20260829-110420
          H="$(mktemp)"
          C="$(mktemp)"
          trap 'rm -f "$H" "$C"' EXIT
          echo 'AI_VIDEO_FONT_BINDING_BEGIN'
          echo 'SOURCE_LAYOUT:'
          grep -nEi 'localFont|Manrope-Variable|font-manrope|body className' "$R/app/layout.tsx" || true
          echo 'BUILT_CSS_MANROPE_REFS:'
          grep -RniEi 'Manrope|font-manrope|localFont' "$R/.next/static/css" 2>/dev/null | head -30 || true
          code="$(curl -L --compressed -ksS -o "$H" -w '%{http_code}' https://sikhadenge.in/masterclass/ai-video || true)"
          echo "LIVE_HTTP=$code"
          grep -oE '/_next/static/css/[^" ]+\.css[^" ]*' "$H" | sort -u | while read -r href; do
            echo "CSS=$href"
            curl -L --compressed -ksS "https://sikhadenge.in$href" >> "$C" || true
            printf '\n' >> "$C"
          done
          echo 'LIVE_FONT_FAMILY_SAMPLES:'
          grep -oiE 'font-family:[^;}]{1,180}' "$C" | head -30 || true
          echo 'LIVE_FONT_FACE_SAMPLES:'
          grep -oiE '@font-face[^}]{1,500}' "$C" | head -10 || true
          echo 'HTML_BODY_CLASSES:'
          grep -oE '<body[^>]*>' "$H" | head -3 || true
          echo 'BROWSER_BIN:'
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
          echo 'NODE_BROWSER_MODULES:'
          for m in playwright puppeteer puppeteer-core; do [ -d "$R/node_modules/$m" ] && echo "$m=YES" || true; done
          test "$code" = 200
          grep -q 'Manrope-Variable.ttf' "$R/app/layout.tsx"
          echo 'AI_VIDEO_SOURCE_MANROPE_BINDING_OK=1 READ_ONLY=1'
          REMOTE
