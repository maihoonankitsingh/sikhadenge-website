name: Sitewide Manrope Main Fontrefs 20260902

on:
  push:
    paths:
      - .github/workflows/sitewide-manrope-main-fontrefs-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Active source font declarations
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          REG=/var/www/sikhadenge.in/registration-v2-hot-20260831-145106
          echo 'ACTIVE_FONT_DECLARATIONS_BEGIN'
          cd "$ROOT"
          for d in app pages components styles src public; do
            [ -e "$d" ] || continue
            find "$d" -type f \( -name '*.css' -o -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -print0 2>/dev/null
          done | xargs -0 grep -nEi 'next/font/(google|local)|font-family[[:space:]]*:|fontFamily[[:space:]]*:|\b(Inter|Manrope|Bricolage|Poppins|Roboto)\(' 2>/dev/null | head -240 || true
          echo 'REGISTRATION_ACTIVE:'
          if [ -d "$REG" ]; then grep -RniEi 'font-family[[:space:]]*:|fontFamily[[:space:]]*:|Manrope|Inter|Bricolage|Poppins|Roboto' "$REG" --include='*.css' --include='*.js' 2>/dev/null | head -160 || true; fi
          echo 'ACTIVE_FONT_DECLARATIONS_END READ_ONLY=1'
          REMOTE
