name: AI Video Funnel Tracking Readonly Audit 20260903

on:
  push:
    paths:
      - .github/workflows/audit-ai-video-funnel-tracking-readonly-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Focused tracking audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeu
          pid_for_port(){ ss -ltnp 2>/dev/null | awk -v p=":$1" '$4 ~ p"$" {if(match($0,/pid=[0-9]+/)){print substr($0,RSTART+4,RLENGTH-4);exit}}'; }
          echo '===== FOCUSED_TRACKING_FINAL_AUDIT ====='
          for port in 3940 3971 3955 3400; do
            pid="$(pid_for_port "$port" || true)"; cwd="$(readlink -f /proc/$pid/cwd 2>/dev/null || true)"; echo "PORT=$port PID=${pid:-NONE} CWD=$cwd"
            [[ -d "$cwd" ]] || continue
            echo '-- env tracking keys --'
            for e in "$cwd/.env" "$cwd/.env.local" "$cwd/.env.production" "$cwd/.env.production.local"; do
              [[ -f "$e" ]] || continue; echo "ENV=$e"
              grep -E '^(NEXT_PUBLIC_GA_MEASUREMENT_ID|NEXT_PUBLIC_GA4_MEASUREMENT_ID|GA4_MEASUREMENT_ID|NEXT_PUBLIC_GOOGLE_ADS_ID|GOOGLE_ADS_ID|GOOGLE_ADS_CONVERSION_LABEL|NEXT_PUBLIC_META_PIXEL_ID|META_PIXEL_ID|NEXT_PUBLIC_CLARITY_ID|CLARITY_PROJECT_ID|NEXT_PUBLIC_SEGMENT_WRITE_KEY)=' "$e" 2>/dev/null | sed -E 's/=(.{0,40}).*/=\1.../' || true
              grep -E '^(GA4_API_SECRET|META_CAPI_ACCESS_TOKEN|META_CONVERSIONS_ACCESS_TOKEN|META_ACCESS_TOKEN|GOOGLE_ADS_ACCESS_TOKEN|SEGMENT_WRITE_KEY|LEAD_INGEST_WEBHOOK_SECRET)=' "$e" 2>/dev/null | sed -E 's/=.*/=PRESENT/' || true
            done
            echo '-- active source markers --'
            find "$cwd" -maxdepth 5 -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' \) -not -path '*/node_modules/*' -not -path '*/.next/*' -not -path '*/.git/*' 2>/dev/null | head -500 | while read -r f; do
              if grep -Eq 'clarity\.ms|analytics\.load|segment\.com|googletagmanager|gtag\(|fbq\(|META_PIXEL|GOOGLE_ADS|utm_campaign_id|gclid|fbclid|masterclass/lead' "$f" 2>/dev/null; then
                echo "FILE=$f"; grep -nE -C 2 'clarity\.ms|analytics\.load|segment\.com|googletagmanager|gtag\(|fbq\(|META_PIXEL|GOOGLE_ADS|utm_campaign_id|utm_adset_id|utm_ad_id|gclid|fbclid|masterclass/lead|eventID|event_id' "$f" 2>/dev/null | head -120 || true
              fi
            done
          done
          echo '===== V72 HASH LOCK ====='
          sha256sum /var/www/sikhadenge.in/registration-stable-v72-20260903-131023/registration-stable-page1-v72.js /var/www/sikhadenge.in/registration-stable-v72-20260903-131023/registration-stable-hot-v72.js 2>/dev/null || true
          echo '===== CTA RAW LIVE ====='
          for u in 'https://sikhadenge.in/masterclass/ai-video?utm_source=meta&utm_medium=paid_social&utm_campaign=audit&utm_campaign_id=111&utm_adset_id=222&utm_ad_id=333&fbclid=FBX&gclid=GX' 'https://sikhadenge.in/masterclass/claude/free?utm_source=meta&utm_medium=paid_social&utm_campaign=audit&utm_campaign_id=111&utm_adset_id=222&utm_ad_id=333&fbclid=FBX&gclid=GX'; do
            echo "URL=$u"; curl -LksS --max-time 20 "$u" | grep -Eo '/gen-ai-masterclass/register-one-step[^"'"'< ]*' | sed 's/&amp;/\&/g' | sort -u | head -50 || true
          done
          echo 'RESULT=FOCUSED_TRACKING_FINAL_AUDIT_COMPLETE'
          REMOTE
