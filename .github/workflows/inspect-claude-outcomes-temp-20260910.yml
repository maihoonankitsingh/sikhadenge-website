name: Inspect Claude Outcomes Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-outcomes-temp-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only guard inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== CURRENT SAFE STATUS ==='; sikhadenge-funnel-lockctl status | sed -n '1,45p'
          echo '=== COMMAND OWNERS ==='; command -v sikhadenge-funnel-lockctl; readlink -f "$(command -v sikhadenge-funnel-lockctl)" || true
          echo '=== SYSTEMD UNIT ==='; systemctl cat sikhadenge-funnel-golden-guard.service || true; systemctl cat sikhadenge-funnel-golden-guard.timer || true
          echo '=== GOLDEN FILES ==='; find /usr/local/bin /usr/local/lib /opt /var/lib/sikhadenge-funnel-golden-lock -maxdepth 3 -type f \( -iname '*funnel*golden*' -o -iname '*funnel*lock*' -o -iname '*golden*guard*' \) -print 2>/dev/null | head -100
          echo '=== DEEP CHECK OWNER ==='; grep -Rnl 'DEEP_ASSET_CHECK\|ASSET_MISMATCH\|manual review required' /usr/local/bin /usr/local/lib /opt 2>/dev/null | head -30 || true
          echo '=== CURL / DEEP CHECK CONTEXT ==='
          for f in $(grep -RIl 'DEEP_ASSET_CHECK\|ASSET_MISMATCH' /usr/local/bin /usr/local/lib /opt 2>/dev/null | head -20); do echo "FILE=$f SHA=$(sha256sum "$f"|awk '{print $1}')"; grep -n -B8 -A20 -E 'DEEP_ASSET_CHECK|ASSET_MISMATCH|curl ' "$f" | head -220 || true; done
          REMOTE
