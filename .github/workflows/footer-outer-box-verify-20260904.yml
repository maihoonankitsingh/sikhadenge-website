name: Footer Outer Box Verify 20260904
on:
  push:
    paths:
      - '.github/workflows/footer-outer-box-verify-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Verify exact live footer only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          OLD='rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          NEW='p-6 sm:p-8 lg:p-10'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/components/Footer.tsx"
          echo "LIVE=$LIVE"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          old='rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          new='p-6 sm:p-8 lg:p-10'
          print('SOURCE_OLD_COUNT=', s.count(old))
          print('SOURCE_NEW_COUNT=', s.count(new))
          if s.count(old)!=0 or s.count(new)<1:
              raise SystemExit('live footer source is not updated')
          PY
          P="$(mktemp)"
          code="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?footerverify=$(date +%s)" || true)"
          echo "PUBLIC_HTTP=$code"
          [ "$code" = 200 ]
          python3 - "$P" <<'PY'
          from pathlib import Path
          import sys
          html=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore')
          marker='Parent Company: ThinkGrow Pvt. Ltd.'
          m=html.find(marker)
          if m<0: raise SystemExit('footer marker missing')
          start=html.rfind('<footer',0,m)
          end=html.find('</footer>',m)
          if start<0 or end<0: raise SystemExit('footer bounds missing')
          footer=html[start:end+9]
          old='rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          new='p-6 sm:p-8 lg:p-10'
          print('FOOTER_LENGTH=',len(footer))
          print('FOOTER_HAS_OLD=',old in footer)
          print('FOOTER_HAS_NEW=',new in footer)
          if old in footer: raise SystemExit('outer box still present in footer fragment')
          if new not in footer: raise SystemExit('new plain footer wrapper missing')
          for x in ['instagram.com/sikhadenge.ai/','linkedin.com/company/sikhadenge','pinterest.com/sikhadenge','wa.me/918808505575','support@sikhadenge.in','+91 88085 05575']:
              if x not in footer: raise SystemExit('missing preserved footer marker: '+x)
          print('EXACT_LIVE_FOOTER_OUTER_BOX_REMOVED=1')
          PY
          REMOTE
