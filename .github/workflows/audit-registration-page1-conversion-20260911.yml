name: Audit Registration Page1 Conversion 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-registration-page1-conversion-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit registration Page-1 without submitting lead
        shell: bash
        run: |
          set -Eeuo pipefail
          echo REG_PAGE1_AUDIT_TRIGGER=2
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const norm=s=>(s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const bad=[],errs=[];
              p.on('pageerror',e=>errs.push(String(e)));
              p.on('response',r=>{const u=r.url(); if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)||r.request().resourceType()==='document')) bad.push(`${r.status()} ${r.request().resourceType()} ${u}`)});
              const url=`https://sikhadenge.in/gen-ai-masterclass/register-one-step?utm_source=qa&utm_medium=internal&utm_campaign=claude-page1-audit&source=claude-masterclass&qa=${name}-${Date.now()}`;
              await p.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              const samples=[];
              for(const ms of [0,250,750,1500,3000]){
                if(ms) await new Promise(r=>setTimeout(r,ms-(samples.at(-1)?.ms||0)));
                samples.push(await p.evaluate(ms=>({ms,text:(document.body.innerText||'').replace(/\s+/g,' ').trim().slice(0,2400),w:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}),ms));
              }
              await new Promise(r=>setTimeout(r,2500));
              const x=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const visible=el=>{if(!el)return false;const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden'&&parseFloat(cs.opacity||'1')>0};
                const els=[...document.querySelectorAll('input,select,textarea,button,a')].filter(visible);
                const fields=els.filter(e=>/^(INPUT|SELECT|TEXTAREA)$/.test(e.tagName)).map(e=>{const r=e.getBoundingClientRect(); const cs=getComputedStyle(e); return {tag:e.tagName.toLowerCase(),id:e.id,name:e.name,type:e.type||'',placeholder:e.placeholder||'',value:e.value||'',required:!!e.required,autocomplete:e.autocomplete||'',aria:e.getAttribute('aria-label')||'',label:e.id?n(document.querySelector(`label[for="${CSS.escape(e.id)}"]`)?.textContent):'',rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},fontSize:cs.fontSize};});
                const buttons=els.filter(e=>e.tagName==='BUTTON'||(e.tagName==='INPUT'&&['submit','button'].includes(e.type))||e.tagName==='A').map(e=>{const r=e.getBoundingClientRect();let path='';try{path=new URL(e.href||'',location.href).pathname}catch{};return {tag:e.tagName.toLowerCase(),id:e.id,text:n(e.textContent||e.value),type:e.type||'',path,aria:e.getAttribute('aria-label')||'',rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}}).filter(x=>x.text||x.aria);
                const links=[...document.querySelectorAll('a[href]')].filter(visible).map(a=>{let path='';try{path=new URL(a.href,location.href).pathname}catch{};return {text:n(a.textContent),path,href:a.href,target:a.target||''}});
                const scripts=[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/registration|attribution|masterclass|page1|v72/i.test(s));
                const text=n(document.body.innerText);
                const cueTerms=['Live Activity','2 Hours Live','WhatsApp Community Access','5,00,000+ SikhaDenge Community','3 Hours Live','WhatsApp Joining Link','Bonus Resources'];
                const cues={}; for(const t of cueTerms)cues[t]=text.toLowerCase().includes(t.toLowerCase());
                return {title:document.title,h1:n(document.querySelector('h1')?.textContent),h2s:[...document.querySelectorAll('h2')].map(e=>n(e.textContent)).filter(Boolean).slice(0,10),text:text.slice(0,5000),fields,buttons,links,scripts,cues,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,bodyW:document.documentElement.clientWidth,bodyH:document.documentElement.scrollHeight,sourceLS:localStorage.getItem('sd_funnel_attribution_v1'),anon:localStorage.getItem('sd_anonymous_id_v1'),session:localStorage.getItem('sd_session_id_v1')};
              });
              console.log('REG_PAGE1_AUDIT',name,JSON.stringify({state:x,samples,bad,errorCount:errs.length,errors:errs.slice(0,8)}));
              if(x.overflow||bad.length||x.fields.filter(f=>['sd-reg-name','sd-reg-email','sd-reg-phone'].includes(f.id)).length!==3) throw new Error(`registration Page1 structural audit fail ${name}`);
              await p.close();
            }
            await b.close(); console.log('REGISTRATION_PAGE1_3VIEW_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
NODE