name: Registration Hang Emergency Fix

on:
  push:
    paths:
      - .github/workflows/registration-hang-emergency-fix-20260902.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Remove global widget from registration route only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata
          SNIP=/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf
          TS="$(date +%Y%m%d-%H%M%S)"
          BK="/var/backups/sikhadenge/registration-hang-emergency-fix-${TS}"
          mkdir -p "$BK"
          cp -a "$SNIP" "$BK/sikhadenge-registration-v2-hot.conf.before"

          PAGE1="$(awk '/location = \/registration-v2-page1\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"
          HOT="$(awk '/location = \/registration-v2-hot\.js/ {f=1} f && /alias / {gsub(";", "", $2); print $2; exit}' "$SNIP")"
          P1_SHA="$(sha256sum "$PAGE1" | awk '{print $1}')"
          HOT_SHA="$(sha256sum "$HOT" | awk '{print $1}')"

          rollback() {
            set +e
            echo AUTO_ROLLBACK_START
            cp -a "$BK/sikhadenge-registration-v2-hot.conf.before" "$SNIP"
            nginx -t && systemctl reload nginx
            echo AUTO_ROLLBACK_DONE
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback; fi; exit "$rc"' EXIT

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/nginx/snippets/sikhadenge-registration-v2-hot.conf')
          s=p.read_text(encoding='utf-8')
          needle='<script src="/api/social-proof/live?widget=1&amp;v=sitewide-live-proof-v1-20260902-224804"></script>'
          n=s.count(needle)
          if n != 1:
              raise SystemExit(f'registration global widget occurrence count={n}')
          s=s.replace(needle,'',1)
          p.write_text(s,encoding='utf-8')
          PY

          nginx -t
          systemctl reload nginx

          test "$(sha256sum "$PAGE1" | awk '{print $1}')" = "$P1_SHA"
          test "$(sha256sum "$HOT" | awk '{print $1}')" = "$HOT_SHA"

          echo "BACKUP=$BK"
          echo "PAGE1_SHA=$P1_SHA"
          echo "HOT_SHA=$HOT_SHA"
          echo RESULT=REGISTRATION_GLOBAL_WIDGET_REMOVED
          trap - EXIT
          REMOTE

      - name: Verify both registration funnels
        shell: bash
        run: |
          set -Eeuo pipefail
          for u in \
            'https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=claude-masterclass&hangfix=1' \
            'https://sikhadenge.in/gen-ai-masterclass/register-one-step?source=ai-video-masterclass&hangfix=1'; do
            TMP="$(mktemp)"
            code="$(curl -L --compressed -sS -o "$TMP" -w '%{http_code}' "$u")"
            echo "$code $u"
            test "$code" = 200
            grep -Fq '/registration-v2-hot.js' "$TMP"
            grep -Fq '/registration-v2-page1.js' "$TMP"
            if grep -Fq 'api/social-proof/live?widget=1' "$TMP"; then
              echo 'ERROR: global live-proof widget still injected on registration page'
              exit 1
            fi
          done
          echo REGISTRATION_HANG_FIX_PUBLIC=PASS
