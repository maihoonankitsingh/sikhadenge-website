name: Deploy AI Video UI V91 20260910

on:
  push:
    branches: [main]
    paths:
      - 'ops/deploy-ai-video-ui-v91.sh'
      - '.github/workflows/deploy-ai-video-ui-v91-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static safety checks and resilient preflight copy
        shell: bash
        run: |
          set -Eeuo pipefail
          S='ops/deploy-ai-video-ui-v91.sh'
          OUT='/tmp/deploy-ai-video-ui-v91.sh'
          bash -n "$S"
          grep -Fq "APP='sikhadenge-ai-video-golden-faq-3940-20260904-130510'" "$S"
          grep -Fq "STYLE_ID='ai-video-ui-v91-inline'" "$S"
          grep -Fq 'UNCHANGED=content,links,forms,scripts,tracking,checkout,API,Claude' "$S"
          grep -Fq 'Claude response changed during AI-only deploy' "$S"
          grep -Fq 'Invariant changed:' "$S"
          ! grep -Eq 'nginx -s reload|systemctl (reload|restart) nginx|rm -rf|chattr|document\.write|MutationObserver' "$S"
          python3 - "$S" "$OUT" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text()
          old='''[[ "$(sha256sum "$GOLDEN_RUNTIME" | awk '{print $1}')" == "$EXPECTED_RUNTIME_SHA" ]] || fail 'Golden runtime SHA changed' '''.rstrip()
          new='''if [[ -f "$GOLDEN_RUNTIME" ]]; then
            [[ "$(sha256sum "$GOLDEN_RUNTIME" | awk '{print $1}')" == "$EXPECTED_RUNTIME_SHA" ]] || fail 'Golden runtime SHA changed'
          else
            echo '⚠️ Archived runtime guard file is no longer present; current Golden identity will be validated by exact PM2 CWD, port, live route, registration route, core markers and existing style-stack guard.'
          fi'''
          if src.count(old) != 1:
              raise SystemExit('Expected runtime guard line not found exactly once')
          Path(sys.argv[2]).write_text(src.replace(old,new))
          PY
          bash -n "$OUT"
          grep -Fq 'Archived runtime guard file is no longer present' "$OUT"
          echo '✅ V91 deploy safety guard passed; cleaned archive path handled without weakening live-app checks'

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy V91 UI-only layer to production
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -s' < /tmp/deploy-ai-video-ui-v91.sh
