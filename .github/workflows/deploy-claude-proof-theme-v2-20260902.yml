name: Deploy Claude Proof Theme V2 20260902

on:
  push:
    paths:
      - .github/workflows/deploy-claude-proof-theme-v2-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy only Claude cloned-proof theme
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          NG="/etc/nginx/sites-enabled/sikhadenge.in-ssl"
          ASSET="/var/www/sikhadenge.in/claude-proof-theme-v2.js"
          SOURCE="https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/2df70b0c05b86afc2d24ccffe6dc85a6dc843658/public/claude-proof-theme-v2.js"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-proof-theme-v2-$TS"

          test -f "$NG"
          mkdir -p "$BACKUP"
          cp "$NG" "$BACKUP/sikhadenge.in-ssl.before"
          [[ ! -f "$ASSET" ]] || cp "$ASSET" "$BACKUP/claude-proof-theme-v2.js.before"

          rollback() {
            set +e
            cp "$BACKUP/sikhadenge.in-ssl.before" "$NG"
            if [[ -f "$BACKUP/claude-proof-theme-v2.js.before" ]]; then
              cp "$BACKUP/claude-proof-theme-v2.js.before" "$ASSET"
            else
              rm -f "$ASSET"
            fi
            nginx -t && systemctl reload nginx
          }
          trap 'rc=$?; echo "DEPLOY FAILED rc=$rc"; rollback; exit $rc' ERR

          TMP="$(mktemp)"
          curl -fsSL --max-time 30 "$SOURCE" -o "$TMP"
          grep -Fq '__CLAUDE_PROOF_THEME_V2__' "$TMP"
          grep -Fq 'hundreds of millions of jobs.' "$TMP"
          grep -Fq "It's increasing the value of AI skills." "$TMP"
          install -m 0644 "$TMP" "$ASSET"

          python3 - "$NG" <<'PY'
from pathlib import Path
import sys

p = Path(sys.argv[1])
s = p.read_text()
route = 'location = /masterclass/claude/free {'
start = s.find(route)
if start < 0:
    raise SystemExit('Claude exact route not found')
end = s.find('\n    }', start)
if end < 0:
    raise SystemExit('Claude exact route end not found')
end += len('\n    }')
seg = s[start:end]

proof = '<script src="/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902"></script>'
theme = '<script src="/claude-proof-theme-v2.js?v=claude-orange-theme-v2-20260902"></script>'

if theme not in seg:
    if proof in seg:
        seg = seg.replace(proof, proof + theme, 1)
    else:
        anchor = "</body>';"
        pos = seg.find(anchor)
        if pos < 0:
            raise SystemExit('Claude body injection anchor not found')
        seg = seg[:pos] + theme + seg[pos:]

s = s[:start] + seg + s[end:]

asset_marker = '# CLAUDE_PROOF_THEME_V2_ASSET'
if asset_marker not in s:
    block = '''    # CLAUDE_PROOF_THEME_V2_ASSET
    location = /claude-proof-theme-v2.js {
        alias /var/www/sikhadenge.in/claude-proof-theme-v2.js;
        default_type application/javascript;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        access_log off;
    }
    # CLAUDE_PROOF_THEME_V2_ASSET_END

'''
    idx = s.find(route)
    if idx < 0:
        raise SystemExit('Could not place Claude theme asset location')
    s = s[:idx] + block + s[idx:]

p.write_text(s)
PY

          nginx -t
          systemctl reload nginx
          sleep 1

          echo '===== VERIFY SERVER INJECTION ====='
          curl -fsS --max-time 20 https://sikhadenge.in/claude-proof-theme-v2.js | grep -Fq '__CLAUDE_PROOF_THEME_V2__'
          HTML="$(mktemp)"
          curl -fsS --max-time 25 'https://sikhadenge.in/masterclass/claude/free?v=claude-theme-v2-server' -o "$HTML"
          test "$(grep -o '/claude-proof-theme-v2.js?v=claude-orange-theme-v2-20260902' "$HTML" | wc -l)" -eq 1
          test "$(grep -o '/claude-proof-exact-v1.js?v=claude-exact-ai-video-proof-20260902' "$HTML" | wc -l)" -eq 1
          grep -Fq '/api/social-proof/live?widget=1' "$HTML"

          AI_VIDEO="$(mktemp)"
          curl -fsS --max-time 25 'https://sikhadenge.in/masterclass/ai-video?v=claude-theme-isolation-check' -o "$AI_VIDEO"
          if grep -Fq '/claude-proof-theme-v2.js' "$AI_VIDEO"; then
            echo 'Theme leaked into AI Video source page'
            exit 1
          fi

          echo "BACKUP=$BACKUP"
          echo 'SERVER_THEME_INJECTION_OK'
          trap - ERR
          REMOTE

      - name: Verify Claude theme and content in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"

          DOM="$RUNNER_TEMP/claude-proof-theme-v2.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=23000 --dump-dom \
            'https://sikhadenge.in/masterclass/claude/free?v=claude-proof-theme-v2-final' > "$DOM"

          grep -Fq 'data-claude-exact-ai-video-proof="ready"' "$DOM"
          grep -Fq 'data-claude-proof-theme="v2"' "$DOM"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'data-sd-claude-highlight="1"' "$DOM" | wc -l)" -eq 2
          test "$(grep -o 'data-sd-claude-title="1"' "$DOM" | wc -l)" -eq 2
          grep -Fq 'data-sd-claude-cta="1"' "$DOM"

          grep -Fq 'hundreds of millions of jobs.' "$DOM"
          grep -Fq "It's increasing the value of AI skills." "$DOM"
          grep -Fq '30 Crore' "$DOM"
          grep -Fq '40 Crore' "$DOM"
          grep -Fq '9.2 Crore' "$DOM"
          grep -Fq '+69%' "$DOM"
          grep -Fq '+78M' "$DOM"
          grep -Fq '10.35M' "$DOM"
          grep -Fq '/gen-ai-masterclass/register-one-step' "$DOM"

          if grep -Fqi 'Why AI-skilled professionals are moving ahead faster' "$DOM"; then
            echo 'Old Claude proof section returned'
            exit 1
          fi

          grep -Fq 'rgb(243, 106, 49)' "$DOM"
          echo 'CLAUDE_ORANGE_THEME_V2_OK'
