name: Funnel Final Readonly Audit 20260903

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/funnel-final-readonly-audit-20260903.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure production SSH
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
          SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect exact snapshot wiring
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== CLAUDE ASSET SNIPPET ==='
          cat /etc/nginx/snippets/sikhadenge-claude-31aug6pm-assets-final.conf
          echo '=== CLAUDE BEST BACKUP DIR ==='
          find /var/backups/sikhadenge/claude-before-best-restore-20260831-234122 -maxdepth 2 -type f -printf '%p | %s\n' | sort
          echo '=== CLAUDE 6PM RESTORE DIR ==='
          find /var/backups/sikhadenge/claude-6pm-route-restore-20260831-214151 -maxdepth 2 -type f -printf '%p | %s\n' | sort
          echo '=== SAVED HTML ASSET URLS ==='
          python3 - <<'PY'
          import re
          p='/var/backups/sikhadenge/claude-before-best-restore-20260831-234122/free.html.current'
          s=open(p,encoding='utf-8',errors='ignore').read()
          urls=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)',r'<link[^>]+href=["\']([^"\']+)']:
            urls += re.findall(pat,s,re.I)
          for u in dict.fromkeys(urls): print(u)
          PY
          echo '=== AI 3940 RELEASE PAGE SOURCE HITS ==='
          grep -RIl 'Create cinematic AI videos' /var/www/sikhadenge.in/releases/production-ai-video-golden-faq-final-20260904-130510/pages /var/www/sikhadenge.in/releases/production-ai-video-golden-faq-final-20260904-130510/app 2>/dev/null | head -20 || true
          REMOTE
