name: Funnel Final Readonly Audit 20260903

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/funnel-final-readonly-audit-20260903.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure production SSH
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
          SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inventory rollback candidates read only
        env:
          SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
          SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== BACKUP DIRS RELEVANT AUG29-SEP10 ==='
          find /var/backups/sikhadenge -maxdepth 1 -mindepth 1 -type d -printf '%TY-%Tm-%Td %TH:%TM:%TS | %f\n' 2>/dev/null \
            | sort \
            | grep -Ei '2026-08-(29|30|31)|2026-09-(0[1-9]|10)|ai|claude|heading|ecosystem|restore|video|snapshot|rollback|funnel' \
            | tail -260 || true
          echo '=== BACKUP FILES RELEVANT ==='
          find /var/backups/sikhadenge -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS | %p | %s\n' 2>/dev/null \
            | grep -Ei 'ai-video|claude|nginx|site|html|source|manifest|route|conf|before' \
            | sort | tail -320 || true
          echo '=== RELEASE DIRS ==='
          find /var/www/sikhadenge.in/releases -maxdepth 1 -mindepth 1 -type d -printf '%TY-%Tm-%Td %TH:%TM:%TS | %f\n' 2>/dev/null | sort | tail -160 || true
          echo '=== CANDIDATE DIRS ==='
          find /var/www/sikhadenge.in/candidates -maxdepth 1 -mindepth 1 -type d -printf '%TY-%Tm-%Td %TH:%TM:%TS | %f\n' 2>/dev/null | sort | tail -120 || true
          echo '=== PM2 PROCESS NAMES ==='
          export PM2_HOME=/root/.pm2
          pm2 ls --no-color 2>/dev/null || true
          echo '=== PORT LISTENERS 3900-3999 ==='
          ss -ltnp 2>/dev/null | grep -E ':39[0-9][0-9][[:space:]]' || true
          echo '=== NGINX SITE BACKUP POINTERS / COMMENTS ==='
          grep -nEi 'masterclass/ai-video|masterclass/claude/free|snapshot|backup|31aug|ai-video|claude' /etc/nginx/sites-enabled/sikhadenge.in-ssl 2>/dev/null | head -240 || true
          echo '=== EXISTING NGINX SNIPPETS RELEVANT ==='
          find /etc/nginx/snippets -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | grep -Ei 'ai|claude|masterclass|registration' | sort || true
          REMOTE
