name: Phase 9 Next 16 Finalize

on:
  push:
    branches:
      - feature/ai-masterclass-funnel-v2
    paths:
      - '.github/workflows/phase9-next16-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-next16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-masterclass-funnel-v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Synchronize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Migrate async App Router request APIs
        run: npx --yes @next/codemod@latest next-async-request-api app --force

      - name: Show migration diff
        run: git diff --stat && git diff -- app package-lock.json

      - name: Commit generated migration changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app package-lock.json
          git commit -m 'chore: finalize Next 16 async API migration'
          git push origin HEAD:feature/ai-masterclass-funnel-v2
