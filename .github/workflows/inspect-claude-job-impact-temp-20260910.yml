name: Inspect Claude Job Impact Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-job-impact-temp-20260910.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only source trace
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          TMP="/tmp/claude-job-impact-$$.html"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 "https://sikhadenge.in/masterclass/claude/free?job_impact_trace=$(date +%s)" -o "$TMP"
          echo '=== CURRENT SECTION TEXT ==='
          python3 - "$TMP" <<'PY'
          import re,sys,html
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          # extract around AI SHIFT in rendered HTML
          txt=re.sub(r'<[^>]+>',' ',s); txt=html.unescape(re.sub(r'\s+',' ',txt))
          i=txt.find('THE AI SHIFT')
          print(txt[i:i+6000] if i>=0 else 'THE AI SHIFT NOT FOUND')
          print('=== SCRIPT URLS ===')
          for u in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I): print(html.unescape(u))
          PY
          echo '=== PUBLIC SCRIPT OWNERS ==='
          python3 - "$TMP" <<'PY'
          import re,sys,html,subprocess,tempfile,os
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          urls=[html.unescape(u) for u in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I)]
          needles=['THE AI SHIFT','full-time jobs exposed to AI automation','Jobs asking for AI skills are outpacing','300M jobs globally exposed','AI Prompt Engineers Earn $300k']
          for u in urls:
              if not u.startswith('/'): continue
              p=tempfile.NamedTemporaryFile(delete=False); p.close()
              try:
                  r=subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','4','--max-time','20','https://sikhadenge.in'+u],stdout=open(p.name,'wb'),stderr=subprocess.DEVNULL)
                  if r.returncode: continue
                  b=open(p.name,'rb').read(); t=b.decode('utf-8','ignore')
                  hits=[n for n in needles if n in t]
                  if hits: print('OWNER_URL',u,'HITS',hits,'BYTES',len(b))
              finally:
                  os.unlink(p.name)
          PY
          echo '=== ON-DISK OWNER SEARCH ==='
          for root in /var/www/sikhadenge.in /var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916; do
            [ -d "$root" ] || continue
            grep -RIl --include='*.js' --include='*.html' --include='*.conf' -m1 -E 'full-time jobs exposed to AI automation|Jobs asking for AI skills are outpacing|300M jobs globally exposed|AI Prompt Engineers Earn \$300k' "$root" 2>/dev/null | head -40 || true
          done
          echo '=== CLAUDE EXACT ROUTE MATCHING LINES ==='
          python3 - <<'PY'
          p='/etc/nginx/sites-enabled/sikhadenge.in-ssl'; s=open(p,encoding='utf-8',errors='ignore').read(); a=s.find('location = /masterclass/claude/free {')
          q=s.find('{',a); d=0; quote=None; esc=False; end=None
          for i in range(q,len(s)):
              ch=s[i]
              if esc: esc=False; continue
              if ch=='\\': esc=True; continue
              if quote:
                  if ch==quote: quote=None
                  continue
              if ch in ('"',"'"): quote=ch; continue
              if ch=='{': d+=1
              elif ch=='}':
                  d-=1
                  if d==0: end=i+1; break
          r=s[a:end]
          for line in r.splitlines():
              if any(x in line for x in ['job','AI SHIFT','300M','75M','Prompt Engineers','opportunity','free-']): print(line)
          PY
          rm -f "$TMP"
          echo JOB_IMPACT_SOURCE_TRACE=PASS
          REMOTE
