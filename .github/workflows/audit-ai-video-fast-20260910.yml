name: Audit AI Video Fast 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ai-video-fast-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Fast read-only audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'ROUTE:'
          grep -A24 -F 'location = /masterclass/ai-video {' /etc/nginx/sites-enabled/sikhadenge.in-ssl | head -25 || true
          echo 'BACKUPS:'
          find /var/backups/sikhadenge -maxdepth 1 -mindepth 1 -type d -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' | grep -Ei 'ai-video|golden|faq|mobile|responsive' | sort -r | head -40 || true
          echo 'PM2:'
          export PM2_HOME=/root/.pm2
          pm2 jlist | python3 -c 'import json,sys; a=json.load(sys.stdin); [print(x.get("name"),x.get("pm2_env",{}).get("status"),x.get("pm2_env",{}).get("pm_exec_path"),x.get("pm2_env",{}).get("env",{}).get("PORT")) for x in a if any(k in (x.get("name") or "").lower() for k in ["ai-video","golden"])]'
          echo 'P3940:'
          curl -sS --connect-timeout 2 --max-time 4 -o /tmp/3940.html -w 'HTTP=%{http_code} BYTES=%{size_download}\n' http://127.0.0.1:3940/masterclass/ai-video || true
          grep -Eo 'Create cinematic AI videos|Six blocks\. Zero filler\.|Frequently Asked Questions' /tmp/3940.html 2>/dev/null | sort -u || true
          echo 'P3930:'
          curl -sS --connect-timeout 2 --max-time 4 -o /tmp/3930.html -w 'HTTP=%{http_code} BYTES=%{size_download}\n' http://127.0.0.1:3930/masterclass/ai-video || true
          grep -Eo 'Create cinematic AI videos|Six blocks\. Zero filler\.|Frequently Asked Questions' /tmp/3930.html 2>/dev/null | sort -u || true
          REMOTE
