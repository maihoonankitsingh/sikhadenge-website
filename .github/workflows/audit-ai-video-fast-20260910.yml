name: Audit AI Video Fast 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ai-video-fast-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 7
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inventory current live UI structure
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          LIVE='https://sikhadenge.in/masterclass/ai-video?ui-inventory=20260910-v91'
          curl -fsS --connect-timeout 5 --max-time 25 "$LIVE" -o /tmp/ai-v91-inventory.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/ai-v91-inventory.html',errors='ignore').read()
          print('=== SECTION STARTS ===')
          for m in re.finditer(r'<section\b([^>]*)>',s,re.I):
              attrs=m.group(1)
              cid=re.search(r'id=["\']([^"\']+)',attrs,re.I)
              cls=re.search(r'class=["\']([^"\']+)',attrs,re.I)
              tail=s[m.end():m.end()+900]
              txt=' '.join(re.sub(r'<[^>]+>',' ',tail).split())[:180]
              print('id=',cid.group(1) if cid else '-', '| class=',cls.group(1) if cls else '-', '| text=',html.unescape(txt))
          print('\n=== AI MASTERCLASS CLASSES ===')
          classes=[]
          for q in re.findall(r'class=["\']([^"\']+)["\']',s,re.I):
              for c in q.split():
                  if c.startswith('ai-video-masterclass_'): classes.append(c)
          for c in sorted(set(classes)): print(c)
          print('\n=== NON-MODULE V* / CUSTOM CLASSES ===')
          custom=[]
          for q in re.findall(r'class=["\']([^"\']+)["\']',s,re.I):
              for c in q.split():
                  if c.startswith(('v1','ai-','hero-','proof-','social-','faq-','trust-')) and not c.startswith('ai-video-masterclass_'): custom.append(c)
          for c in sorted(set(custom))[:400]: print(c)
          print('\n=== IMPORTANT TEXT -> NEAREST OPEN TAG ===')
          for text in ['Everyone says AI will replace you','30 Crore','AI isn’t only changing jobs','Six blocks','Understand the tools behind','Real learners','Built for people who want','Questions before']:
              i=s.lower().find(text.lower())
              print('\nMARKER',text,'@',i)
              if i>=0:
                  j=s.rfind('<',0,i); print(s[j:i+250].replace('\n',' ')[:900])
          PY
          REMOTE
