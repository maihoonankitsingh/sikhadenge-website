name: Audit AI Video CSS Assets 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ai-video-css-assets-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deep read-only CSS and asset audit
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          LIVE='https://sikhadenge.in/masterclass/ai-video?css-audit=20260910b'
          curl -fsSL --max-time 25 "$LIVE" -o /tmp/ai-css-audit.html
          echo "PUBLIC_BYTES=$(wc -c </tmp/ai-css-audit.html) SHA=$(sha256sum /tmp/ai-css-audit.html | awk '{print $1}')"
          echo '=== LINK/SCRIPT ASSETS ==='
          python3 - <<'PY' >/tmp/ai-assets.txt
import re,html
s=open('/tmp/ai-css-audit.html',errors='ignore').read()
assets=[]
for u in re.findall(r'<link[^>]+href=["\']([^"\']+)',s,re.I):
    u=html.unescape(u)
    if u.startswith('/'): assets.append(('LINK',u))
for u in re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I):
    u=html.unescape(u)
    if u.startswith('/'): assets.append(('SCRIPT',u))
seen=set()
for typ,u in assets:
    if (typ,u) not in seen:
        seen.add((typ,u)); print(typ+'|'+u)
PY
          while IFS='|' read -r typ u; do
            code=$(curl -L -sS --max-time 15 -o /tmp/asset.out -w '%{http_code}' "https://sikhadenge.in$u" || true)
            echo "$typ|$code|$(wc -c </tmp/asset.out 2>/dev/null || echo 0)|$u"
          done </tmp/ai-assets.txt
          echo '=== AFFECTED SECTION DOM ==='
          python3 - <<'PY'
import re
s=open('/tmp/ai-css-audit.html',errors='ignore').read()
for needle in ['Learn the workflow behind','Six blocks.','Understand the tools behind']:
  i=s.lower().find(needle.lower())
  print('\n###',needle,'pos',i)
  if i<0: continue
  starts=[m for m in re.finditer(r'<section\b[^>]*>',s[:i],re.I)]
  start=starts[-1].start() if starts else max(0,i-2000)
  end=s.find('</section>',i); end=end+10 if end>=0 else min(len(s),i+9000)
  seg=s[start:end]
  tag=re.match(r'<section\b[^>]*>',seg,re.I)
  print('SECTION_TAG=',tag.group(0) if tag else 'NONE')
  ids=sorted(set(re.findall(r'id=["\']([^"\']+)',seg,re.I)))
  cls=sorted(set(c for x in re.findall(r'class=["\']([^"\']+)',seg,re.I) for c in x.split()))
  print('IDS=',ids[:60]); print('CLASSES=',cls[:120]); print('SEG_BYTES=',len(seg.encode()))
PY
          echo '=== STYLE COVERAGE ==='
          python3 - <<'PY'
import re
s=open('/tmp/ai-css-audit.html',errors='ignore').read(); styles=[]
for m in re.finditer(r'<style([^>]*)>(.*?)</style>',s,re.I|re.S):
  attrs,css=m.group(1),m.group(2); im=re.search(r'id=["\']([^"\']+)',attrs,re.I); styles.append((im.group(1) if im else '(no-id)',css))
for n in ['#outcomes','#learn','#ai-workflow','workflow','six','tools','ai-video-tools','ai-video-workflow']:
  hits=[sid for sid,css in styles if n.lower() in css.lower()]
  print(n,'=>',hits[:40], 'count=',len(hits))
print('STYLE_BLOCKS=',len(styles),'STYLE_OPEN=',s.lower().count('<style'),'STYLE_CLOSE=',s.lower().count('</style>'))
print('SCRIPT_OPEN=',s.lower().count('<script'),'SCRIPT_CLOSE=',s.lower().count('</script>'))
PY
          echo '=== DONE ==='
          REMOTE
# trigger
