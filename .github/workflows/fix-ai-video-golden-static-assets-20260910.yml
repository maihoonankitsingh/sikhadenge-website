name: Fix AI Video Golden Static Assets 20260910

on:
  push:
    branches: [main]
    paths:
      - 'ops/fix-ai-video-golden-static-assets-20260910.sh'
      - '.github/workflows/fix-ai-video-golden-static-assets-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Static safety checks
        shell: bash
        run: |
          set -Eeuo pipefail
          S='ops/fix-ai-video-golden-static-assets-20260910.sh'
          bash -n "$S"
          grep -Fq "CSS='/_next/static/css/0dc2b316d6c10c6c.css'" "$S"
          grep -Fq "PAGEJS='/_next/static/chunks/pages/masterclass/ai-video-e4484da06cac6162.js'" "$S"
          grep -Fq "proxy_pass http://127.0.0.1:3940" "$S"
          grep -Fq 'Claude changed during AI-only asset fix' "$S"
          grep -Fq 'UNCHANGED=AI content,CTA,forms,tracking,API,registration,Claude' "$S"
          # Disallow broad Next.js namespace interception. Only exact hashed locations are permitted.
          ! grep -Eq 'location[[:space:]]+\^~[[:space:]]+/_next/static|location[[:space:]]+/(_next|\_next)/static' "$S"
          # No page HTML/source mutation is allowed in this asset-routing repair.
          ! grep -Eq 'ai-video\.html.*(sed|perl)|cp .*ai-video\.html|install .*ai-video\.html' "$S"
          echo '✅ Static safety checks passed: exact two-asset routing only'

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = 'ssh-ed25519'
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Apply guarded exact-asset production fix
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < ops/fix-ai-video-golden-static-assets-20260910.sh
