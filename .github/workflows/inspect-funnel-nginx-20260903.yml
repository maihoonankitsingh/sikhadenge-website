name: Inspect Funnel Nginx 20260903
on:
  push:
    paths:
      - .github/workflows/inspect-funnel-nginx-20260903.yml
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
      - name: Locate tracking identifiers
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo '=== META PIXEL REFERENCES ==='
          grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.git '966093361669466' /var/www/sikhadenge.in /opt/sikhadenge-dashboard 2>/dev/null | head -80 || true
          echo '=== ENV SECRET PRESENCE ANYWHERE ==='
          find /var/www/sikhadenge.in /opt/sikhadenge-dashboard /root/.pm2 -maxdepth 7 -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' -o -name '.env.production.local' -o -name 'dump.pm2' \) 2>/dev/null | while read -r f; do
            h=$(grep -E 'META_CAPI_ACCESS_TOKEN|META_CONVERSIONS_ACCESS_TOKEN|META_ACCESS_TOKEN|GA4_API_SECRET|SEGMENT_WRITE_KEY|NEXT_PUBLIC_SEGMENT_WRITE_KEY|GOOGLE_ADS_ACCESS_TOKEN|GOOGLE_ADS_CONVERSION_LABEL|LEAD_INGEST_WEBHOOK_SECRET' "$f" 2>/dev/null || true)
            [ -n "$h" ] || continue
            echo "FILE=$f"
            printf '%s\n' "$h" | sed -E 's/([A-Z0-9_]+)[" ]*[:=].*/\1=PRESENT/' | sort -u
          done
          echo '=== GA4 IDS ==='
          grep -RhoE --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'G-[A-Z0-9]{8,}' /var/www/sikhadenge.in/releases /var/www/sikhadenge.in/candidates /var/www/sikhadenge.in/.bk_admission_payment_2026-02-14-051845 2>/dev/null | sort -u | head -80 || true
          echo '=== GOOGLE ADS IDS ==='
          grep -RhoE --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'AW-[0-9]{6,}' /var/www/sikhadenge.in/releases /var/www/sikhadenge.in/candidates /var/www/sikhadenge.in/.bk_admission_payment_2026-02-14-051845 2>/dev/null | sort -u | head -80 || true
          echo '=== SEGMENT CONFIG REFERENCES ==='
          grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.git -E 'NEXT_PUBLIC_SEGMENT_WRITE_KEY|SEGMENT_WRITE_KEY' /var/www/sikhadenge.in/releases /var/www/sikhadenge.in/candidates /var/www/sikhadenge.in/.bk_admission_payment_2026-02-14-051845 2>/dev/null | head -80 || true
          echo '=== META API TOKEN KEY REFERENCES ==='
          grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.git -E 'META_CAPI_ACCESS_TOKEN|META_CONVERSIONS_ACCESS_TOKEN|META_ACCESS_TOKEN' /var/www/sikhadenge.in /opt/sikhadenge-dashboard 2>/dev/null | head -100 || true
          echo '=== ACTIVE ROUTE HEALTH ==='
          for u in https://sikhadenge.in/masterclass/ai-video https://sikhadenge.in/masterclass/claude/free https://sikhadenge.in/gen-ai-masterclass/register-one-step https://dashboard.sikhadenge.in; do printf '%s ' "$u"; curl -LksS --max-time 15 -o /dev/null -w '%{http_code}\n' "$u" || true; done
          echo IDENTIFIERS_INSPECT_DONE
          REMOTE
