name: Final Claude Funnel E2E Audit 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-claude-funnel-e2e-audit-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Static QA validation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check ops/qa-claude-free-final-trust-v1-20260911.js
          node --check ops/qa-registration-native-suppress-v1-20260910.js
          node --check ops/qa-registration-community-handoff-track-v1b-20260911.js
          echo FINAL_STATIC_QA=PASS

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Production Golden read-only integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          REG_JS='/var/www/sikhadenge.in/registration-stable-v72-20260903-131023/registration-stable-hot-v72.js'
          sikhadenge-funnel-lockctl check
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          STATUS="$(sikhadenge-funnel-lockctl status)"
          printf '%s\n' "$STATUS" | grep -E 'SEALED_AT|AI_PUBLIC_SHA|CLAUDE_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^LOCK_STATE=/{print $2}')" = 'LOCKED'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^AI_PUBLIC_SHA=/{print $2}')" = 'b03ab6b210bceed43573d2037816ae8f8208969ea73cecaba60e14eef10c12d2'
          test "$(printf '%s\n' "$STATUS" | awk -F= '/^CLAUDE_PUBLIC_SHA=/{print $2}')" = '87f0dd7849d2f26b6eb1eb24a886f6faedb046bbbfd37414553761d3274d7355'
          test "$(sha256sum "$REG_JS" | awk '{print $1}')" = '040b0a1bbc2d185d8e8e3d13cbd96b86251af5da041ffaf2083806814f3e582b'
          test "$(grep -Fc 'SIKHADENGE_REGISTRATION_COMMUNITY_HANDOFF_TRACK_V1_START' "$REG_JS")" = '1'
          test "$(grep -Fc "'whatsapp_community_handoff'" "$REG_JS")" = '1'
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          echo FINAL_GOLDEN_INTEGRITY=PASS
          REMOTE

      - name: Install browser QA dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"

      - name: Claude landing final trust 3-view QA
        shell: bash
        run: |
          set -Eeuo pipefail
          node ops/qa-claude-free-final-trust-v1-20260911.js

      - name: Landing to registration 3-view E2E with no QA lead write
        shell: bash
        run: |
          set -Eeuo pipefail
          node ops/qa-registration-native-suppress-v1-20260910.js

      - name: Consent-aware WhatsApp community handoff E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          node ops/qa-registration-community-handoff-track-v1b-20260911.js

      - name: Final public hash and asset checks
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 45 'https://sikhadenge.in/masterclass/claude/free' -o /tmp/claude.html
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 45 'https://sikhadenge.in/masterclass/ai-video' -o /tmp/ai.html
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 45 -H 'Cache-Control: no-cache' 'https://sikhadenge.in/registration-stable-hot-v72.js?v=20260903-131023&final_audit=1' -o /tmp/reg.js
          CLAUDE_SHA="$(sha256sum /tmp/claude.html | awk '{print $1}')"
          AI_SHA="$(sha256sum /tmp/ai.html | awk '{print $1}')"
          REG_SHA="$(sha256sum /tmp/reg.js | awk '{print $1}')"
          echo "FINAL_CLAUDE_SHA=$CLAUDE_SHA"
          echo "FINAL_AI_SHA=$AI_SHA"
          echo "FINAL_REGISTRATION_ASSET_SHA=$REG_SHA"
          test "$CLAUDE_SHA" = '87f0dd7849d2f26b6eb1eb24a886f6faedb046bbbfd37414553761d3274d7355'
          test "$AI_SHA" = 'b03ab6b210bceed43573d2037816ae8f8208969ea73cecaba60e14eef10c12d2'
          test "$REG_SHA" = '040b0a1bbc2d185d8e8e3d13cbd96b86251af5da041ffaf2083806814f3e582b'
          grep -Fq 'SIKHADENGE_REGISTRATION_COMMUNITY_HANDOFF_TRACK_V1_START' /tmp/reg.js
          echo FINAL_PUBLIC_HASHES=PASS

      - name: Final verdict
        shell: bash
        run: |
          echo 'CLAUDE_FUNNEL_FINAL_E2E_ACCEPTANCE=PASS'
