name: Reconcile Admission Source Readonly 20260904

on:
  push:
    branches:
      - reconcile/production-source-next15-20260904
    paths:
      - .github/workflows/reconcile-admission-source-readonly-20260904.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    if: github.ref == 'refs/heads/reconcile/production-source-next15-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read admission dependency source only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/releases/sitewide-manrope-font-20260902-231335
          test -d "$ROOT"
          echo '===== ADMISSION TOKEN ====='
          sha256sum "$ROOT/lib/admission-token.ts"
          sed -n '1,260p' "$ROOT/lib/admission-token.ts"
          echo '===== PRISMA ADMISSION MODEL ====='
          awk 'BEGIN{p=0} /^model Admission[[:space:]]*\{/{p=1} p{print} p && /^\}/{exit}' "$ROOT/prisma/schema.prisma"
          echo '===== DASHBOARD AUTH ====='
          sha256sum "$ROOT/lib/dashboard-auth.ts"
          sed -n '1,260p' "$ROOT/lib/dashboard-auth.ts"
          echo '===== READONLY COMPLETE ====='
          REMOTE
