name: Inspect Claude Extra Strip 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-claude-extra-strip-20260903.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect rendered DOM around extra strip
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          URL='https://sikhadenge.in/masterclass/claude/free?v=inspect-extra-strip-dom-20260903'
          DOM="$RUNNER_TEMP/claude-extra-strip.html"
          PNG="$RUNNER_TEMP/claude-extra-strip.png"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom "$URL" > "$DOM"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --hide-scrollbars --window-size=1900,5000 --screenshot="$PNG" "$URL"
          python3 -m pip -q install beautifulsoup4
          python3 - "$DOM" <<'PY'
          from bs4 import BeautifulSoup, Tag
          from pathlib import Path
          import sys,re
          s=Path(sys.argv[1]).read_text(errors='ignore')
          soup=BeautifulSoup(s,'html.parser')
          def norm(x): return re.sub(r'\s+',' ',x.get_text(' ',strip=True)).strip()
          def find_text(needle):
              for el in soup.find_all(True):
                  t=norm(el)
                  if needle in t and not any(needle in norm(c) for c in el.find_all(recursive=False) if isinstance(c,Tag)):
                      return el
              return None
          def desc(el):
              if not el: return None
              return {'tag':el.name,'id':el.get('id'),'class':el.get('class'),'style':el.get('style'),'text':norm(el)[:180]}
          top=find_text('Specially designed for working professionals')
          bottom=find_text('CURRENT BATCH ADVANTAGE')
          print('===== TOP TARGET ====='); print(desc(top))
          print('===== BOTTOM TARGET ====='); print(desc(bottom))
          print('===== TOP ANCESTORS =====')
          n=top
          for i in range(8):
              if not n: break
              print(i,desc(n)); n=n.parent if isinstance(n.parent,Tag) else None
          print('===== BOTTOM ANCESTORS =====')
          n=bottom
          for i in range(8):
              if not n: break
              print(i,desc(n)); n=n.parent if isinstance(n.parent,Tag) else None
          # Find nearest section-like ancestors and print their adjacent siblings.
          def sectionish(el):
              n=el
              while n and n.name not in ('section','main','article'):
                  n=n.parent if isinstance(n.parent,Tag) else None
              return n
          for label,el in [('TOP',top),('BOTTOM',bottom)]:
              sec=sectionish(el)
              print(f'===== {label} SECTION ====='); print(desc(sec))
              if sec:
                  sibs=[]
                  for x in [sec.previous_sibling,sec.next_sibling]:
                      while x is not None and not isinstance(x,Tag): x=x.previous_sibling if x is sec.previous_sibling else x.next_sibling
                      sibs.append(desc(x) if isinstance(x,Tag) else None)
                  print('ADJACENT',sibs)
          print('===== KEY CLASS/ID OCCURRENCES =====')
          for el in soup.find_all(True):
              ident=' '.join([el.get('id') or '', ' '.join(el.get('class') or [])])
              if any(k in ident.lower() for k in ['spacer','divider','gap','band','strip','separator']):
                  print(desc(el))
          PY
          cp "$DOM" "$GITHUB_WORKSPACE/claude-extra-strip.html"
          cp "$PNG" "$GITHUB_WORKSPACE/claude-extra-strip.png"
      - name: Upload inspect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-extra-strip-inspect
          path: |
            claude-extra-strip.html
            claude-extra-strip.png
          retention-days: 1
