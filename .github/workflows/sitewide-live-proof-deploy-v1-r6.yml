name: Sitewide Live Registration Proof V1 R6

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-deploy-v1-r6.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Prepare existing-endpoint deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/scripts/sitewide-live-proof-v1.sh /tmp/sitewide-live-proof-v1-r6.sh
          python3 <<'PY'
          from pathlib import Path

          p=Path('/tmp/sitewide-live-proof-v1-r6.sh')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label} count={n}')
              s=s.replace(old,new,1)

          once(
            'ASSET_DIR="/var/www/sikhadenge.in/sitewide-live-proof-v1"',
            'ASSET_DIR="/var/www/sikhadenge.in/social-proof-live"',
            'asset-dir'
          )

          once(
            'script = f\'<script src="/sitewide-live-proof-v1.js?v={tag}"></script>\'',
            'script = f\'<script src="/api/social-proof/live?widget=1&amp;v={tag}"></script>\'',
            'script-url'
          )

          once(
            'https://sikhadenge.in/sitewide-live-proof-v1.js?v=${TAG}',
            'https://sikhadenge.in/api/social-proof/live?widget=1&v=${TAG}',
            'public-curl-url'
          )

          once(
            '  local label="$1" url="$2" out="/tmp/sd-proof-${label}-${TS}.html"',
            '  local label="$1" url="$2"\n  local out="/tmp/sd-proof-${label}-${TS}.html"',
            'qa-local-init'
          )

          # Remove the new static asset location entirely; existing /api/social-proof/live remains the only transport.
          start_token="asset_block = f'''"
          end_token="s = s.replace(anchor, anchor + asset_block, 1)"
          start=s.find(start_token)
          end=s.find(end_token,start)
          if start < 0 or end < 0:
              raise SystemExit('main asset block tokens missing')
          end += len(end_token)
          s=s[:start] + 'asset_block = ""\ns = s.replace(anchor, anchor, 1)' + s[end:]

          # Existing live endpoint returns JS only when widget=1, JSON otherwise.
          live_anchor='''    if (\n      req.method === "GET" &&\n      url.pathname === "/api/social-proof/live"\n    ) {\n      return json(res, 200, await getStats());\n    }\n'''
          if s.count(live_anchor) != 1:
              raise SystemExit(f'live route anchor count={s.count(live_anchor)}')

          live_route='''    if (\n      req.method === "GET" &&\n      url.pathname === "/api/social-proof/live"\n    ) {\n      if (url.searchParams.get("widget") === "1") {\n        const body = fs.readFileSync(\n          path.join(__dirname, "sitewide-live-proof-v1.js"),\n          "utf8"\n        );\n        res.writeHead(200, {\n          "Content-Type": "application/javascript; charset=utf-8",\n          "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",\n          "Pragma": "no-cache",\n          "Expires": "0",\n          "X-Content-Type-Options": "nosniff",\n          "Content-Length": Buffer.byteLength(body)\n        });\n        res.end(body);\n        return;\n      }\n\n      return json(res, 200, await getStats());\n    }\n'''
          s=s.replace(live_anchor,live_route,1)

          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/sitewide-live-proof-v1-r6.sh
          grep -Fq '/api/social-proof/live?widget=1' /tmp/sitewide-live-proof-v1-r6.sh
          grep -Fq 'url.searchParams.get("widget") === "1"' /tmp/sitewide-live-proof-v1-r6.sh
          grep -Fq 'local out="/tmp/sd-proof-${label}-${TS}.html"' /tmp/sitewide-live-proof-v1-r6.sh
          if grep -Fq 'anchor + asset_block' /tmp/sitewide-live-proof-v1-r6.sh; then exit 1; fi
          if grep -Fq 'location = /sitewide-live-proof-v1.js' /tmp/sitewide-live-proof-v1-r6.sh; then exit 1; fi

      - name: Deploy sitewide live proof R6
        shell: bash
        run: bash /tmp/sitewide-live-proof-v1-r6.sh
