name: Production Source Reconciliation Readonly 20260904

on:
  push:
    branches:
      - fix/nonvisual-hardening-integration-20260904
    paths:
      - .github/workflows/production-source-reconciliation-readonly-20260904.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    if: github.ref == 'refs/heads/fix/nonvisual-hardening-integration-20260904'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read production topology and source inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PM2_HOME=/root/.pm2

          echo '===== PM2 SIKHADENGE PROCESSES ====='
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{for(const x of JSON.parse(s)){if(/sikhadenge/i.test(x.name||"")){console.log(JSON.stringify({name:x.name,status:x.pm2_env?.status,cwd:x.pm2_env?.pm_cwd,script:x.pm2_env?.pm_exec_path,args:x.pm2_env?.args,pid:x.pid}))}}})'

          echo '===== LISTENERS ====='
          ss -ltnp 2>/dev/null | grep -E ':(39[0-9]{2}|40[0-9]{2})[[:space:]]' || true

          echo '===== NGINX SIKHADENGE ROUTES ====='
          NG=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          test -f "$NG"
          grep -nE 'location |proxy_pass http://127\.0\.0\.1:|alias /var/www/sikhadenge\.in|root /var/www/sikhadenge\.in' "$NG" | sed -n '1,500p' || true

          echo '===== ACTIVE PROCESS CWD INVENTORY ====='
          pm2 jlist 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const out=[];for(const x of JSON.parse(s))if(/sikhadenge/i.test(x.name||"")&&x.pm2_env?.pm_cwd)out.push(x.pm2_env.pm_cwd);console.log([...new Set(out)].join("\n"))})' | while IFS= read -r root; do
            [ -n "$root" ] || continue
            [ -d "$root" ] || continue
            echo "--- ROOT=$root ---"
            if [ -f "$root/package.json" ]; then
              node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log(JSON.stringify({name:p.name,next:p.dependencies?.next||p.devDependencies?.next,react:p.dependencies?.react||p.devDependencies?.react,reactDom:p.dependencies?.["react-dom"]||p.devDependencies?.["react-dom"]}))' "$root/package.json"
            fi
            if [ -f "$root/.next/BUILD_ID" ]; then printf 'BUILD_ID='; cat "$root/.next/BUILD_ID"; echo; fi
            if [ -d "$root/.git" ]; then printf 'GIT_HEAD='; git -C "$root" rev-parse HEAD 2>/dev/null || true; else echo 'GIT_HEAD=NOT_GIT'; fi

            echo 'SOURCE_FILES_BEGIN'
            find "$root" -maxdepth 7 -type f \
              \( -path "$root/app/*" -o -path "$root/pages/*" -o -path "$root/components/*" -o -path "$root/lib/*" -o -path "$root/src/*" \) \
              \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.css' \) \
              -not -path '*/node_modules/*' -not -path '*/.next/*' \
              -printf '%P\n' 2>/dev/null | sort | sed -n '1,2500p' || true
            echo 'SOURCE_FILES_END'

            echo 'CRITICAL_HASHES_BEGIN'
            for rel in \
              components/Footer.tsx \
              pages/index.tsx \
              pages/contact.tsx \
              pages/contact-us.tsx \
              app/page.tsx \
              app/contact-us/page.tsx \
              app/admin/dashboard/page.tsx \
              app/api/admission/complete/route.ts \
              package.json \
              next.config.js; do
              if [ -f "$root/$rel" ]; then sha256sum "$root/$rel" | sed "s#  $root/##"; else echo "MISSING $rel"; fi
            done
            echo 'CRITICAL_HASHES_END'

            for rel in app/admin/dashboard/page.tsx app/api/admission/complete/route.ts; do
              if [ -f "$root/$rel" ]; then
                echo "FILE_BEGIN $rel"
                sed -n '1,260p' "$root/$rel"
                echo "FILE_END $rel"
              fi
            done
          done

          echo '===== READONLY AUDIT COMPLETE ====='
          REMOTE
