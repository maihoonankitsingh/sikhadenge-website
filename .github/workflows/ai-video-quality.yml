name: AI Video Quality Gate

on:
  pull_request:
    paths:
      - "pages/masterclass/ai-video/**"
      - "styles/ai-video-masterclass.module.css"
      - "styles/ai-video-process-premium.module.css"
      - "styles/ai-video-warm-reference.css"
      - "pages/_app.tsx"
      - "pages/_document.tsx"
      - "next.config.js"
      - "scripts/audit-ai-video-masterclass.mjs"
      - "scripts/qa-ai-video-masterclass.mjs"
      - "scripts/qa-ai-video-sections.mjs"
      - "scripts/check-ai-video-lighthouse.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-video-quality.yml"
  push:
    branches:
      - "redesign/ai-video-90-plus-20260903"
    paths:
      - "pages/masterclass/ai-video/**"
      - "styles/ai-video-masterclass.module.css"
      - "styles/ai-video-process-premium.module.css"
      - "styles/ai-video-warm-reference.css"
      - "pages/_app.tsx"
      - "pages/_document.tsx"
      - "next.config.js"
      - "scripts/audit-ai-video-masterclass.mjs"
      - "scripts/qa-ai-video-masterclass.mjs"
      - "scripts/qa-ai-video-sections.mjs"
      - "scripts/check-ai-video-lighthouse.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-video-quality.yml"

permissions:
  contents: read

concurrency:
  group: ai-video-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    name: Source architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run AI Video source audit
        run: node scripts/audit-ai-video-masterclass.mjs

  candidate-build:
    name: Candidate build + browser + Lighthouse 90+
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Re-run source audit after install
        run: npm run ai-video:audit

      - name: Lint AI Video route and shared shell
        run: npx next lint --file pages/masterclass/ai-video/index.tsx --file pages/_app.tsx --file pages/_document.tsx

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Install Chromium for real browser QA
        run: npx playwright install --with-deps chromium

      - name: Start production candidate
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          nohup npm start -- -p 3000 > /tmp/ai-video-next.log 2>&1 &
          echo $! > /tmp/ai-video-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/masterclass/ai-video >/dev/null; then
              echo "Candidate server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ai-video-next.log || true
          echo "Candidate server failed to become ready"
          exit 1

      - name: Desktop tablet mobile browser QA — each view 90+
        env:
          AI_VIDEO_QA_BASE_URL: http://127.0.0.1:3000
          AI_VIDEO_QA_OUTPUT: artifacts/ai-video-qa
        run: npm run ai-video:qa

      - name: Section-by-section scroll-context visual QA — 90+
        env:
          AI_VIDEO_QA_BASE_URL: http://127.0.0.1:3000
          AI_VIDEO_SECTION_QA_OUTPUT: artifacts/ai-video-qa/sections
        run: node scripts/qa-ai-video-sections.mjs

      - name: Lighthouse desktop 90+ categories
        run: |
          mkdir -p artifacts/ai-video-lighthouse
          CHROME_PATH="$(node -e "const {chromium}=require('playwright'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/masterclass/ai-video \
            --quiet \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=artifacts/ai-video-lighthouse/desktop.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Lighthouse mobile 90+ categories
        run: |
          CHROME_PATH="$(node -e "const {chromium}=require('playwright'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/masterclass/ai-video \
            --quiet \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=artifacts/ai-video-lighthouse/mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      - name: Enforce Lighthouse 90+ + Core Web Vitals proxy budgets
        env:
          AI_VIDEO_LIGHTHOUSE_DIR: artifacts/ai-video-lighthouse
        run: node scripts/check-ai-video-lighthouse.mjs

      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-90-plus-evidence
          path: |
            artifacts/ai-video-qa
            artifacts/ai-video-lighthouse
            /tmp/ai-video-next.log
          if-no-files-found: warn
          retention-days: 14
