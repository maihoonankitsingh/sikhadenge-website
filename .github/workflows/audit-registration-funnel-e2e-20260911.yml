name: Audit Claude Registration Funnel E2E 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-registration-funnel-e2e-20260911.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit Page1 to Step2 without lead write
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const norm=s=>(s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await browser.newPage();
              await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              let leadWrites=[]; const bad=[]; const errors=[];
              p.on('pageerror',e=>errors.push(String(e)));
              p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)||r.request().resourceType()==='document'))bad.push(`${r.status()} ${r.request().resourceType()} ${u}`)});
              await p.setRequestInterception(true);
              p.on('request',req=>{
                if(req.method()==='POST'&&/\/api\/masterclass\/lead(?:\?|$)/.test(req.url())){
                  leadWrites.push({url:req.url(),body:req.postData()||''});
                  req.abort('blockedbyclient');
                } else req.continue();
              });
              const url=`https://sikhadenge.in/gen-ai-masterclass/register-one-step?utm_source=qa&utm_medium=internal&utm_campaign=step2_audit_${name}&source=claude-masterclass&qa=${Date.now()}`;
              await p.goto(url,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,4500));
              const page1=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const vis=e=>!!e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length);
                const btn=[...document.querySelectorAll('button')].find(b=>vis(b)&&/Continue — 2 quick questions/i.test(n(b.textContent)));
                return {body:n(document.body.innerText).slice(0,2800),button:n(btn?.textContent),fields:['sd-reg-name','sd-reg-email','sd-reg-phone'].map(id=>({id,visible:vis(document.getElementById(id)),required:!!document.getElementById(id)?.required})),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              });
              await p.evaluate(()=>{
                const set=(el,val)=>{const d=Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el),'value');if(d&&d.set)d.set.call(el,val);else el.value=val;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};
                set(document.getElementById('sd-reg-name'),'QA Step Two');
                set(document.getElementById('sd-reg-email'),'qa.step2@example.com');
                set(document.getElementById('sd-reg-phone'),'9999999999');
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const b=[...document.querySelectorAll('button')].find(x=>(x.offsetWidth||x.offsetHeight||x.getClientRects().length)&&/Continue — 2 quick questions/i.test(n(x.textContent)));
                if(!b)throw new Error('Page1 Continue missing'); b.click();
              });
              await new Promise(r=>setTimeout(r,1200));
              const step2=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const vis=e=>!!e&&(e.offsetWidth||e.offsetHeight||e.getClientRects().length);
                const controls=[...document.querySelectorAll('input,select,textarea,button')].filter(vis).map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName.toLowerCase(),id:e.id||'',name:e.name||'',type:e.type||'',text:n(e.textContent||e.value),placeholder:e.placeholder||'',value:e.value||'',required:!!e.required,aria:e.getAttribute('aria-label')||'',rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}}});
                return {body:n(document.body.innerText).slice(0,4200),controls,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,source:location.search,attr:localStorage.getItem('sd_funnel_attribution_v1'),session:sessionStorage.getItem('sd_session_id_v1')||''};
              });
              console.log('REG_STEP2_AUDIT',name,JSON.stringify({page1,step2,leadWrites,bad,errorCount:errors.length,errors:errors.slice(0,5)}));
              if(leadWrites.length)throw new Error(`Unexpected lead write attempt before Step2 ${name}`);
              if(page1.overflow||step2.overflow||bad.length)throw new Error(`Structural failure ${name}`);
              if(!/About You/i.test(step2.body))throw new Error(`Step2 not reached ${name}`);
              await p.close();
            }
            await browser.close();
            console.log('REGISTRATION_STEP2_NO_LEAD_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
