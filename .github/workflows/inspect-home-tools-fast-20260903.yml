name: Inspect Home Tools Fast 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-home-tools-fast-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect active source only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/var/www/sikhadenge.in/sikhadenge-website-space
          echo "ROOT=$ROOT"
          test -d "$ROOT"
          echo '===== TOP LEVEL ====='
          find "$ROOT" -maxdepth 2 -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.jsx' -o -name '*.js' -o -name '*.css' \) | head -120
          echo '===== EXACT PHRASE ====='
          timeout 20s grep -RInF --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude='*.map' 'AI Tools You Will Master' "$ROOT" 2>/dev/null | head -30 || true
          echo '===== TOOL NAMES COLOCATED ====='
          timeout 20s grep -RInF --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude='*.map' 'Gamma AI' "$ROOT" 2>/dev/null | head -30 || true
          echo '===== HOME HTML ====='
          H=$(mktemp); trap 'rm -f "$H"' EXIT
          curl -L --compressed -ksS https://sikhadenge.in/ -o "$H"
          grep -oE '.{0,120}AI Tools You Will Master.{0,260}' "$H" | head -2 || true
          REMOTE
