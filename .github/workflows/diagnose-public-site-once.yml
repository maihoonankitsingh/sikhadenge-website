name: Diagnose Public Site Once

on:
  pull_request:
    branches:
      - live-clean-sync-20260424
    paths:
      - .github/workflows/diagnose-public-site-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/public-site-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          test -n "$key_material"
          canonical_host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s %s\n' "$canonical_host" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Read-only VPS diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/public-site-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          LIVE_APP=/var/www/sikhadenge.in/sikhadenge-website-space
          echo 'DIAGNOSTIC_START'
          echo "GIT_BRANCH=$(git -C "$LIVE_APP" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
          echo "GIT_SHA=$(git -C "$LIVE_APP" rev-parse HEAD 2>/dev/null || true)"
          echo "TRACKED_DIRTY_COUNT=$(git -C "$LIVE_APP" status --porcelain --untracked-files=no 2>/dev/null | wc -l | tr -d ' ')"
          echo 'TRACKED_DIRTY_FILES_START'
          git -C "$LIVE_APP" diff --name-status -- . || true
          echo 'TRACKED_DIRTY_FILES_END'
          echo 'TRACKED_DIRTY_NUMSTAT_START'
          git -C "$LIVE_APP" diff --numstat -- . || true
          echo 'TRACKED_DIRTY_NUMSTAT_END'
          echo 'RELEASE_FILES_STATUS_START'
          git -C "$LIVE_APP" status --short --untracked-files=no -- \
            pages/_app.tsx \
            pages/masterclass/claude/free.tsx \
            styles/claude-masterclass-live.module.css || true
          echo 'RELEASE_FILES_STATUS_END'
          echo 'PM2_PUBLIC_START'
          pm2 jlist 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s)){if(p.name==="sikhadenge-in")console.log(`PM2_NAME=${p.name} STATUS=${p.pm2_env?.status||""} CWD=${p.pm2_env?.pm_cwd||""}`)}}catch(e){console.log("PM2_PARSE_FAILED")}})'
          echo 'PM2_PUBLIC_END'
          echo 'DIAGNOSTIC_END'
          REMOTE
