name: Diagnose Public Site Once

on:
  pull_request:
    branches:
      - live-clean-sync-20260424
    paths:
      - .github/workflows/diagnose-public-site-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

    steps:
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then echo 'SSH_PORT=22' >> "$GITHUB_ENV"; SSH_PORT=22; fi
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/public-site-production"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          test -n "$key_material"
          canonical_host="[$SSH_HOST]:$SSH_PORT"
          printf '%s %s %s\n' "$canonical_host" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Read-only VPS diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/public-site-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'DIAGNOSTIC_START'
          for path in \
            /var/www/sikhadenge.in/sikhadenge-website-space \
            /var/www/sikhadenge.in \
            /var/www/sikhadenge-website-space \
            /var/www/sikhadenge; do
            if [[ -e "$path" ]]; then
              echo "PATH_EXISTS=$path"
              if git -C "$path" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                echo "GIT_ROOT=$path"
                echo "GIT_BRANCH=$(git -C "$path" rev-parse --abbrev-ref HEAD 2>/dev/null || true)"
                echo "GIT_SHA=$(git -C "$path" rev-parse HEAD 2>/dev/null || true)"
                echo "TRACKED_DIRTY_COUNT=$(git -C "$path" status --porcelain --untracked-files=no 2>/dev/null | wc -l | tr -d ' ')"
              fi
            fi
          done
          echo 'DISCOVERED_GIT_ROOTS_START'
          find /var/www -maxdepth 4 -type d -name .git -print 2>/dev/null | sed 's#/.git$##' | head -20
          echo 'DISCOVERED_GIT_ROOTS_END'
          echo 'PM2_START'
          pm2 jlist 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const p of JSON.parse(s)){console.log(`PM2_NAME=${p.name} STATUS=${p.pm2_env?.status||""} CWD=${p.pm2_env?.pm_cwd||""}`)}}catch(e){console.log("PM2_PARSE_FAILED")}})'
          echo 'PM2_END'
          echo 'NGINX_MATCHES_START'
          grep -RIl --include='*.conf' 'server_name.*sikhadenge\.in' /etc/nginx 2>/dev/null | head -20 || true
          echo 'NGINX_MATCHES_END'
          echo 'DIAGNOSTIC_END'
          REMOTE
