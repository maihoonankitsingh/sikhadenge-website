name: Upgrade Two Funnel Deploy Guard 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-two-funnel-deploy-guard-20260910.yml'
      - 'ops/sikhadenge-funnel-lockctl.sh'
      - 'ops/sikhadenge-funnel-golden-guard.sh'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  install-deploy-guard:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate guard scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ops/sikhadenge-funnel-lockctl.sh
          bash -n ops/sikhadenge-funnel-golden-guard.sh
          grep -Fq 'assert-unlocked)' ops/sikhadenge-funnel-lockctl.sh
          grep -Fq 'DEPLOY_GATE=BLOCKED' ops/sikhadenge-funnel-lockctl.sh
          grep -Fq 'last-incident.epoch' ops/sikhadenge-funnel-golden-guard.sh
          echo 'STATIC_DEPLOY_GUARD_VALIDATION=PASS'
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Stage updated guard utilities
        shell: bash
        run: |
          set -Eeuo pipefail
          SCP=(scp -P "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SCP[@]}" ops/sikhadenge-funnel-lockctl.sh "$SSH_USER@$SSH_HOST:/tmp/sikhadenge-funnel-lockctl.sh"
          "${SCP[@]}" ops/sikhadenge-funnel-golden-guard.sh "$SSH_USER@$SSH_HOST:/tmp/sikhadenge-funnel-golden-guard.sh"
      - name: Install and prove locked deploy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          bash -n /tmp/sikhadenge-funnel-lockctl.sh
          bash -n /tmp/sikhadenge-funnel-golden-guard.sh
          install -o root -g root -m 0755 /tmp/sikhadenge-funnel-lockctl.sh /usr/local/sbin/sikhadenge-funnel-lockctl
          install -o root -g root -m 0755 /tmp/sikhadenge-funnel-golden-guard.sh /usr/local/sbin/sikhadenge-funnel-golden-guard
          # Current approved funnels MUST be locked, therefore a deploy gate attempt must be rejected.
          set +e
          out=$(/usr/local/sbin/sikhadenge-funnel-lockctl assert-unlocked 2>&1)
          rc=$?
          set -e
          echo "$out"
          [[ $rc -eq 73 ]]
          grep -Fq 'DEPLOY_GATE=BLOCKED' <<< "$out"
          /usr/local/sbin/sikhadenge-funnel-lockctl check
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer | grep -qx enabled
          systemctl is-active sikhadenge-funnel-golden-guard.timer | grep -qx active
          ai=$(curl -L -sS --max-time 25 -o /tmp/deploy-guard-ai -w '%{http_code}' 'https://sikhadenge.in/masterclass/ai-video?deploy-guard=1')
          cl=$(curl -L -sS --max-time 25 -o /tmp/deploy-guard-cl -w '%{http_code}' 'https://sikhadenge.in/masterclass/claude/free?deploy-guard=1')
          [[ "$ai" == 200 && "$cl" == 200 ]]
          grep -Fqi 'Six blocks' /tmp/deploy-guard-ai
          grep -Fqi 'better results' /tmp/deploy-guard-cl
          echo "DEPLOY_GUARD_INSTALL=PASS AI_HTTP=$ai CLAUDE_HTTP=$cl"
          REMOTE
