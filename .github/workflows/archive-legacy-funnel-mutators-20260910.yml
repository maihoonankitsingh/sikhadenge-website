name: Archive Legacy Funnel Mutators 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-legacy-funnel-mutators-20260910.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move legacy page-mutating workflows out of active Actions directory
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ops/legacy-funnel-workflows
          shopt -s nullglob
          files=(
            .github/workflows/deploy-claude-*.yml
            .github/workflows/deploy-ai-video-ui-v91-20260910.yml
            .github/workflows/restore-ai-video-sep4-golden-20260910.yml
            .github/workflows/restore-claude-pre-sticky-20260910.yml
            .github/workflows/fix-ai-video-golden-static-assets-20260910.yml
            .github/workflows/fix-claude-old-heading-v11-20260903.yml
            .github/workflows/deploy-canonical-funnel-tracking-v1.yml
            .github/workflows/deploy-canonical-funnel-tracking-v1b.yml
            .github/workflows/deploy-funnel-attribution-bridge-v1.yml
          )
          (( ${#files[@]} > 0 )) || { echo 'No legacy funnel mutators found'; exit 0; }
          printf 'ARCHIVING %s legacy mutator workflows\n' "${#files[@]}"
          for f in "${files[@]}"; do
            b=$(basename "$f")
            git mv "$f" "ops/legacy-funnel-workflows/$b"
            echo "ARCHIVED=$b"
          done
          cat > ops/legacy-funnel-workflows/README.md <<'EOF'
          # Archived Funnel Mutator Workflows

          These historical one-shot GitHub Actions workflows were moved out of `.github/workflows` on 2026-09-10 after the AI Video and Claude masterclass funnels were sealed by the Two-Funnel Golden Lock.

          They are retained only for forensic/history reference. Do **not** move or execute one directly against production.

          Any intentional change to `/masterclass/ai-video` or `/masterclass/claude/free` must use the controlled sequence:

          1. `sikhadenge-funnel-lockctl unlock 15`
          2. apply one scoped change
          3. production + desktop/mobile browser QA
          4. `sikhadenge-funnel-lockctl reseal`

          A production mutation workflow must call `sikhadenge-funnel-lockctl assert-unlocked` before it writes protected funnel state.
          EOF
          git status --short
          git config user.name 'SikhaDenge Production Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ops: archive legacy funnel mutator workflows'
          git push origin HEAD:main
          echo 'LEGACY_FUNNEL_WORKFLOW_QUARANTINE=PASS'
