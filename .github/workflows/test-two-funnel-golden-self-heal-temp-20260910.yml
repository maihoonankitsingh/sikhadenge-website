name: Test Two Funnel Golden Self Heal Temp 20260910

on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-two-funnel-golden-self-heal-temp-20260910.yml']

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  fire-drill:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 7
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Controlled no-reload config drift and self-heal proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SNIP=/etc/nginx/snippets/sikhadenge-ai-video-3940.conf
          GOLD=/var/lib/sikhadenge-funnel-golden-lock/current
          source "$GOLD/state.env"
          before=$(sha256sum "$SNIP"|awk '{print $1}')
          [[ "$before" == "$AI_SNIP_SHA" ]]
          echo '# GOLDEN_LOCK_FIRE_DRILL_NO_RELOAD' >> "$SNIP"
          drift=$(sha256sum "$SNIP"|awk '{print $1}')
          [[ "$drift" != "$AI_SNIP_SHA" ]]
          # Deliberately do NOT reload nginx. Visitors continue on the last validated in-memory config.
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          after=$(sha256sum "$SNIP"|awk '{print $1}')
          [[ "$after" == "$AI_SNIP_SHA" ]]
          nginx -t >/dev/null
          ai=$(curl -L -sS --max-time 20 -o /tmp/fire-ai -w '%{http_code}' 'https://sikhadenge.in/masterclass/ai-video?fire-drill=1')
          cl=$(curl -L -sS --max-time 20 -o /tmp/fire-cl -w '%{http_code}' 'https://sikhadenge.in/masterclass/claude/free?fire-drill=1')
          [[ "$ai" == 200 && "$cl" == 200 ]]
          grep -Fqi 'Six blocks' /tmp/fire-ai
          grep -Fqi 'better results' /tmp/fire-cl
          echo "SELF_HEAL_FIRE_DRILL=PASS"
          echo "EXPECTED_SHA=$AI_SNIP_SHA"
          echo "DRIFT_SHA=$drift"
          echo "RESTORED_SHA=$after"
          echo "AI_HTTP=$ai CLAUDE_HTTP=$cl"
          REMOTE
