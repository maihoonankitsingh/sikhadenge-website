name: Audit Recent Registrations Origin 20260904
on:
  push:
    paths:
      - '.github/workflows/audit-recent-registrations-origin-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Trace text origin read only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          echo "LIVE=$LIVE"
          echo '=== PUBLIC HTML SEARCH ==='
          T="$(mktemp)"
          curl -kLsS "https://sikhadenge.in/?trace_recent_regs=1" -o "$T"
          python3 - "$T" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8',errors='ignore')
          for term in ['Recent registrations','recent registrations','registrations']:
              print(term, 'COUNT=', s.lower().count(term.lower()))
          for m in re.finditer(r'.{0,180}registrations.{0,180}',s,re.I|re.S):
              print('HTML_CONTEXT=',m.group(0).replace('\n',' ')[:500])
          PY
          rm -f "$T"
          echo '=== NGINX SEARCH ==='
          grep -RIni --binary-files=without-match --exclude='*.pem' --exclude='*.key' --exclude='*.log' -m 20 'recent registrations' /etc/nginx 2>/dev/null || true
          echo '=== VAR WWW TARGETED SEARCH ==='
          for base in \
            "$LIVE" \
            /var/www/sikhadenge.in/registration-v2-hot-20260831-145106 \
            /var/www/sikhadenge.in/social-proof-live \
            /var/www/sikhadenge.in; do
            [ -e "$base" ] || continue
            echo "BASE=$base"
            grep -RIni --binary-files=without-match \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.next \
              --exclude='*.log' --exclude='*.map' --exclude='*.pem' --exclude='*.key' \
              -m 30 'recent registrations' "$base" 2>/dev/null | head -80 || true
          done
          echo '=== BROADER REGISTRATION LABEL SEARCH IN LIKELY INJECTION FILES ==='
          find /var/www/sikhadenge.in -maxdepth 4 -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.conf' \) -size -2M -print0 2>/dev/null \
            | xargs -0 grep -Ini --binary-files=without-match -m 3 'registrations' 2>/dev/null \
            | head -120 || true
          REMOTE
