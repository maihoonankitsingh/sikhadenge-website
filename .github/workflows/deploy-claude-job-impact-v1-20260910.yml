name: Deploy Claude Job Impact V1 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-claude-job-impact-v1-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 20
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Controlled Job Impact V1 deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SITE='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          ASSETS='/etc/nginx/snippets/sikhadenge-claude-31aug6pm-assets-final.conf'
          ROOT='/var/www/sikhadenge.in'
          CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          DIR="$CWD/.next/static/chunks/pages/masterclass/claude"
          BASE_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js'
          CURRENT_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-20260910.js'
          NEW_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-job-impact-v1-20260910.js'
          CURRENT="$DIR/$CURRENT_NAME"; NEW="$DIR/$NEW_NAME"
          OLD_PROOF="$ROOT/claude-proof-static-v4.js"; NEW_PROOF="$ROOT/claude-proof-static-v5.js"
          BASE_URL="/_next/static/chunks/pages/masterclass/claude/$BASE_NAME"
          CURRENT_URL="/_next/static/chunks/pages/masterclass/claude/$CURRENT_NAME"
          NEW_URL="/_next/static/chunks/pages/masterclass/claude/$NEW_NAME"
          OLD_PROOF_URL='/claude-proof-static-v4.js?v=claude-proof-static-v4-20260902'
          NEW_PROOF_URL='/claude-proof-static-v5.js?v=job-impact-evidence-v1-20260910'
          TS="$(date +%Y%m%d-%H%M%S)"; BK="/var/backups/sikhadenge/claude-job-impact-v1-$TS"; mkdir -p "$BK"
          cp -L "$SITE" "$BK/sikhadenge.in-ssl.before"; cp -L "$ASSETS" "$BK/claude-assets.before"
          [[ -f "$NEW" ]] && cp -a "$NEW" "$BK/new-chunk.before" || true
          [[ -f "$NEW_PROOF" ]] && cp -a "$NEW_PROOF" "$BK/new-proof.before" || true
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 'https://sikhadenge.in/masterclass/ai-video?jobimpact_before=1' -o "$BK/ai.before.html"
          AI_BEFORE="$(sha256sum "$BK/ai.before.html"|awk '{print $1}')"
          rollback(){ rc=$?; echo "ROLLBACK rc=$rc"; cat "$BK/sikhadenge.in-ssl.before" > "$SITE" || true; cat "$BK/claude-assets.before" > "$ASSETS" || true; if [[ -f "$BK/new-chunk.before" ]]; then cp -a "$BK/new-chunk.before" "$NEW"; else rm -f "$NEW"; fi; if [[ -f "$BK/new-proof.before" ]]; then cp -a "$BK/new-proof.before" "$NEW_PROOF"; else rm -f "$NEW_PROOF"; fi; nginx -t && systemctl reload nginx || true; sikhadenge-funnel-lockctl reseal || true; sikhadenge-funnel-lockctl lock || true; exit "$rc"; }
          trap rollback ERR

          sikhadenge-funnel-lockctl check
          test "$(sha256sum "$CURRENT"|awk '{print $1}')" = 'ad12771c1d5d9b23d995afbf7d019a2b8c4b9710fb6527fab586d5e3f827719a'
          test "$(sha256sum "$OLD_PROOF"|awk '{print $1}')" = '3ae0c4874f675c443f0607f85b0ef37d802625e7bbde3a92873be4a77d193a82'
          sikhadenge-funnel-lockctl unlock 15
          sikhadenge-funnel-lockctl assert-unlocked

          cp -a "$CURRENT" "$NEW"
          python3 - "$NEW" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          reps=[
            ('Why AI-skilled professionals are ','Why AI skills are '),
            ('moving ahead faster.','becoming part of modern work.'),
            ('Professionals who can use AI workflows effectively are building a stronger advantage across research, communication, analysis and execution.','AI is changing tasks, tools and skill requirements across many occupations. The opportunity is to learn how to use it effectively.'),
            ('Jobs are moving toward AI-enabled professionals. Become AI-enabled before the shift leaves you behind.','Work is changing quickly. Build practical AI skills so you can adapt with confidence.'),
          ]
          for old,new in reps:
              c=s.count(old); print('CHUNK_REPLACE_COUNT',repr(old),c)
              if c!=1: raise SystemExit(f'expected one occurrence of {old!r}, got {c}')
              s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          print('JOB_IMPACT_CHUNK_PATCH=PASS')
          PY
          node --check "$NEW"
          NEW_SHA="$(sha256sum "$NEW"|awk '{print $1}')"; echo "NEW_CHUNK_SHA=$NEW_SHA"

          cp -a "$OLD_PROOF" "$NEW_PROOF"
          python3 - "$NEW_PROOF" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          jobs='''  const jobs = [
    {
      brand: "ILO",
      brandClass: "compact",
      stat: "1 in 4",
      title: "workers are in occupations with some GenAI exposure",
      copy: "ILO's 2025 global index says exposure is widespread, but transformation of work is more likely than wholesale job replacement.",
      source: "ILO · Generative AI and Jobs · 2025",
    },
    {
      brand: "WORLD ECONOMIC FORUM",
      brandClass: "stacked",
      stat: "+78M",
      title: "net jobs projected globally by 2030",
      copy: "WEF projects 170M roles created and 92M displaced by 2030 as technology and other macrotrends reshape the labour market.",
      source: "WEF · Future of Jobs Report 2025",
    },
    {
      brand: "LinkedIn",
      brandClass: "compact",
      stat: "70%",
      title: "of skills used in most jobs are expected to change by 2030",
      copy: "LinkedIn's Work Change Report identifies AI as a major catalyst behind rapidly changing skill requirements.",
      source: "LinkedIn · Work Change Report 2025",
    },
  ];'''
          skills='''  const skills = [
    {
      brand: "pwc",
      brandClass: "compact",
      stat: "+69%",
      title: "growth in jobs requiring specific AI skills",
      copy: "PwC's 2026 analysis reports 69% growth for jobs requiring specific AI skills, compared with 9% growth across the overall jobs market.",
      source: "PwC · Global AI Jobs Barometer 2026",
    },
    {
      brand: "pwc",
      brandClass: "compact",
      stat: "2×+",
      title: "faster skill change in the most AI-exposed jobs",
      copy: "PwC reports skills needed in the most AI-exposed jobs are changing more than twice as fast as in the least exposed roles.",
      source: "PwC · Global AI Jobs Barometer 2026",
    },
    {
      brand: "WORLD ECONOMIC FORUM",
      brandClass: "stacked",
      stat: "AI + Big Data",
      title: "among the fastest-growing skills through 2030",
      copy: "WEF says technology skills are rising in importance alongside human skills such as creative thinking, resilience and collaboration.",
      source: "WEF · Future of Jobs Report 2025",
    },
  ];'''
          pat=r'  const jobs = \[.*?\n  \];\n\n  const skills = \[.*?\n  \];'
          new=jobs+'\n\n'+skills
          out,n=re.subn(pat,new,s,count=1,flags=re.S)
          print('PROOF_ARRAY_REPLACE_COUNT',n)
          if n!=1: raise SystemExit('proof arrays pattern mismatch')
          out=out.replace('window.__CLAUDE_PROOF_STATIC_V4__','window.__CLAUDE_PROOF_STATIC_V5__').replace('__CLAUDE_PROOF_STATIC_V4__ = true','__CLAUDE_PROOF_STATIC_V5__ = true')
          open(p,'w',encoding='utf-8').write(out)
          print('JOB_IMPACT_PROOF_PATCH=PASS')
          PY
          node --check "$NEW_PROOF"
          PROOF_SHA="$(sha256sum "$NEW_PROOF"|awk '{print $1}')"; echo "NEW_PROOF_SHA=$PROOF_SHA"

          if ! grep -Fq 'SIKHADENGE_CLAUDE_JOB_IMPACT_V1_ASSETS_20260910' "$ASSETS"; then
            printf '\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              '# SIKHADENGE_CLAUDE_JOB_IMPACT_V1_ASSETS_20260910' \
              "location = $NEW_URL {" \
              "    alias $NEW;" \
              '    default_type application/javascript;' \
              '    add_header Cache-Control "public, max-age=31536000, immutable" always;' \
              '    add_header X-SD-Claude-Asset "job-impact-v1-20260910" always;' \
              '}' \
              'location = /claude-proof-static-v5.js {' \
              "    alias $NEW_PROOF;" \
              '    default_type application/javascript;' \
              '    add_header Cache-Control "public, max-age=31536000, immutable" always;' \
              '    add_header X-SD-Claude-Asset "proof-v5-20260910" always;' \
              '}' >> "$ASSETS"
          fi

          python3 - "$SITE" "$BASE_URL" "$CURRENT_URL" "$NEW_URL" "$OLD_PROOF_URL" "$NEW_PROOF_URL" <<'PY'
          import sys
          p,baseurl,currenturl,newurl,oldproof,newproof=sys.argv[1:]
          s=open(p,encoding='utf-8').read(); needle='location = /masterclass/claude/free {'; a=s.find(needle)
          if a<0: raise SystemExit('Claude route missing')
          q=s.find('{',a); d=0; quote=None; esc=False; end=None
          for i in range(q,len(s)):
              ch=s[i]
              if esc: esc=False; continue
              if ch=='\\': esc=True; continue
              if quote:
                  if ch==quote: quote=None
                  continue
              if ch in ('"',"'"): quote=ch; continue
              if ch=='{': d+=1
              elif ch=='}':
                  d-=1
                  if d==0: end=i+1; break
          if end is None: raise SystemExit('route parse failed')
          route=s[a:end]
          if '# SIKHADENGE_CLAUDE_JOB_IMPACT_V1_20260910' in route: raise SystemExit('unexpected Job Impact V1 marker')
          old_line=f"        sub_filter '{baseurl}' '{currenturl}';"
          new_line=f"        sub_filter '{baseurl}' '{newurl}';"
          if route.count(old_line)!=1: raise SystemExit(f'current chunk route line count={route.count(old_line)}')
          if route.count(oldproof)!=1: raise SystemExit(f'old proof URL count={route.count(oldproof)}')
          route=route.replace(old_line,new_line,1).replace(oldproof,newproof,1)
          filters=[
            ('Why AI-skilled professionals are ','Why AI skills are '),
            ('moving ahead faster.','becoming part of modern work.'),
            ('Professionals who can use AI workflows effectively are building a stronger advantage across research, communication, analysis and execution.','AI is changing tasks, tools and skill requirements across many occupations. The opportunity is to learn how to use it effectively.'),
            ('Jobs are moving toward AI-enabled professionals. Become AI-enabled before the shift leaves you behind.','Work is changing quickly. Build practical AI skills so you can adapt with confidence.'),
          ]
          block='\n        # SIKHADENGE_CLAUDE_JOB_IMPACT_V1_20260910\n'
          for old,new in filters: block += '        sub_filter '+repr(old)+' '+repr(new)+';\n'
          route=route.replace(new_line+'\n',new_line+'\n'+block,1)
          open(p,'w',encoding='utf-8').write(s[:a]+route+s[end:])
          print('JOB_IMPACT_ROUTE_PATCH=PASS')
          PY

          nginx -t; systemctl reload nginx; sleep 2
          code="$(curl -L -sS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 -o "$BK/new.public.js" -w '%{http_code}' "https://sikhadenge.in${NEW_URL}?first=$TS")"; test "$code" = 200; echo NEW_CHUNK_HTTP=$code
          test "$(sha256sum "$BK/new.public.js"|awk '{print $1}')" = "$NEW_SHA"
          code="$(curl -L -sS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 -o "$BK/proof.public.js" -w '%{http_code}' "https://sikhadenge.in${NEW_PROOF_URL}&first=$TS")"; test "$code" = 200; echo NEW_PROOF_HTTP=$code
          test "$(sha256sum "$BK/proof.public.js"|awk '{print $1}')" = "$PROOF_SHA"
          grep -Fq 'stat: "1 in 4"' "$BK/proof.public.js"
          grep -Fq 'Global AI Jobs Barometer 2026' "$BK/proof.public.js"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 "https://sikhadenge.in/masterclass/claude/free?jobimpact_server=$TS" -o "$BK/claude.after.html"
          grep -Fq 'Why AI skills are ' "$BK/claude.after.html"
          grep -Fq 'becoming part of modern work.' "$BK/claude.after.html"
          grep -Fq 'Build practical AI skills so you can adapt with confidence.' "$BK/claude.after.html"
          grep -Fq "$NEW_PROOF_URL" "$BK/claude.after.html"
          grep -Fq "$NEW_URL" "$BK/claude.after.html"
          grep -Fq 'Master <mark>Claude + 25+ AI Tools</mark>' "$BK/claude.after.html"
          grep -Fq '<strong>150,000+ Learners</strong>' "$BK/claude.after.html"
          grep -Fq '>What you can <span class="sd-heading-highlight">do with AI</span></h2>' "$BK/claude.after.html"
          grep -Fq 'LIVE MASTERCLASS AGENDA' "$BK/claude.after.html"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 'https://sikhadenge.in/masterclass/ai-video?jobimpact_after=1' -o "$BK/ai.after.html"
          test "$AI_BEFORE" = "$(sha256sum "$BK/ai.after.html"|awk '{print $1}')"
          echo AI_UNCHANGED_SHA=$AI_BEFORE
          echo "$BK" > /var/backups/sikhadenge/.claude-job-impact-v1-last
          trap - ERR
          echo SERVER_STAGE_PASS=$BK
          REMOTE

      - name: Browser QA desktop tablet mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1; npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          cat > qa.js <<'JS'
          const puppeteer=require('puppeteer-core'); const norm=s=>(s||'').replace(/\s+/g,' ').replace(/,\s*/g,',').trim();
          const wantH='Master Claude + 25+ AI Tools to work smarter,create faster & get better results.';
          const outcomes=['Research a topic and turn it into presentation-ready insights','Summarise long reports, PDFs & notes into clear action points','Create structured presentations, emails & professional content faster','Understand and improve code with AI-assisted workflows','Work with Excel formulas & data using natural-language AI guidance','Improve LinkedIn research, profile content & outreach workflows'];
          const agenda=['Choose the right AI tool for the task','Research, summarise & extract insights','Create professional work faster','Code & automate repetitive work','Build a repeatable AI workflow'];
          const stats=['1 in 4','+78M','70%','+69%','2×+','AI + Big Data'];
          const titles=['workers are in occupations with some GenAI exposure','net jobs projected globally by 2030','of skills used in most jobs are expected to change by 2030','growth in jobs requiring specific AI skills','faster skill change in the most AI-exposed jobs','among the fastest-growing skills through 2030'];
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const fail=[];
          for(const [n,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){const p=await b.newPage();await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});const bad=[];p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)))bad.push(`${r.status()} ${u}`)});await p.goto(`https://sikhadenge.in/masterclass/claude/free?jobimpact_browser=${n}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});await new Promise(r=>setTimeout(r,3500));const x=await p.evaluate(()=>{const h1=document.querySelector('h1');const hero=h1?.closest('section')||h1?.parentElement?.parentElement;const proof=hero?[...hero.querySelectorAll('[class*="proofCard"]')].slice(0,3).map(c=>(c.querySelector('strong')?.textContent||'').trim()):[];const hs=[...document.querySelectorAll('h2')];const oh=hs.find(h=>(h.textContent||'').replace(/\s+/g,' ').trim()==='What you can do with AI');const os=oh?.closest('section');const outcomeItems=os?[...os.querySelectorAll('[class*="itemText"]')].map(e=>(e.textContent||'').trim()).slice(0,6):[];const agendaHeads=[...document.querySelectorAll('h3,h4')].map(e=>(e.textContent||'').replace(/\s+/g,' ').trim());const shift=hs.find(h=>(h.textContent||'').replace(/\s+/g,' ').trim()==='Why AI skills are becoming part of modern work.');const root=document.getElementById('claude-ai-video-proof-v4');const cards=root?[...root.querySelectorAll('.sd-proof-v4-card')].map(c=>({stat:(c.querySelector('.sd-proof-v4-stat')?.textContent||'').trim(),title:(c.querySelector('h3')?.textContent||'').trim(),source:(c.querySelector('small')?.textContent||'').trim()})):[];const visible=(document.body.innerText||'').replace(/\s+/g,' ');const reg='/gen-ai-masterclass/register-one-step';const ctas=[...document.querySelectorAll('a[href]')].filter(a=>{try{return new URL(a.href,location.href).pathname===reg}catch{return false}}).length;return{h1:h1?.textContent||'',proof,outcomeItems,agendaHeads,shift:!!shift,cards,visible,sections:document.querySelectorAll('main section').length,faq:document.querySelectorAll('section[data-sd-claude-faq-v2="1"] details').length,ctas,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,scripts:[...document.scripts].map(s=>s.src).filter(Boolean)}});const trust=x.proof.length===3&&x.proof[0]==='150,000+ Learners'&&x.proof[1]==='4.9/5 Rating'&&x.proof[2]==='Live · Practical';const out=JSON.stringify(x.outcomeItems)===JSON.stringify(outcomes);const ag=agenda.every(t=>x.agendaHeads.includes(t));const cardOK=x.cards.length===6&&JSON.stringify(x.cards.map(c=>c.stat))===JSON.stringify(stats)&&JSON.stringify(x.cards.map(c=>c.title))===JSON.stringify(titles)&&x.cards.every(c=>/2025|2026/.test(c.source));const old=['30 Crore','40 Crore','9.2 Crore','10.35M','AI Prompt Engineers Earn $300k','workers could be displaced by automation'];const oldVisible=old.filter(t=>x.visible.includes(t));console.log(n,JSON.stringify({...x,visible:undefined}),'oldVisible',oldVisible,'failedAssets',bad.length);if(norm(x.h1)!==wantH||!trust||!out||!ag||!x.shift||!cardOK||oldVisible.length||x.sections!==18||x.faq!==15||x.ctas<7||x.overflow||bad.length||!x.scripts.some(s=>s.includes('job-impact-v1-20260910.js'))||!x.scripts.some(s=>s.includes('claude-proof-static-v5.js')))fail.push(n+': '+JSON.stringify(x.cards)+' old='+oldVisible.join(',')+' bad='+bad.join(','));await p.close()}await b.close();if(fail.length)throw Error(fail.join('\n'));console.log('CLAUDE_JOB_IMPACT_V1_3VIEW_QA_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Reseal and lock Golden baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl reseal
          sikhadenge-funnel-lockctl lock
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status
          echo CLAUDE_JOB_IMPACT_V1_RESEALED_LOCKED=PASS
          REMOTE

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          M='/var/backups/sikhadenge/.claude-job-impact-v1-last'; [[ -s "$M" ]] || { sikhadenge-funnel-lockctl lock || true; exit 0; }; B="$(cat "$M")"
          SITE='/etc/nginx/sites-enabled/sikhadenge.in-ssl'; ASSETS='/etc/nginx/snippets/sikhadenge-claude-31aug6pm-assets-final.conf'; ROOT='/var/www/sikhadenge.in'; CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          NEW="$CWD/.next/static/chunks/pages/masterclass/claude/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-job-impact-v1-20260910.js"; NEW_PROOF="$ROOT/claude-proof-static-v5.js"
          sikhadenge-funnel-lockctl unlock 5 || true
          [[ -s "$B/sikhadenge.in-ssl.before" ]] && cat "$B/sikhadenge.in-ssl.before" > "$SITE"
          [[ -s "$B/claude-assets.before" ]] && cat "$B/claude-assets.before" > "$ASSETS"
          if [[ -f "$B/new-chunk.before" ]]; then cp -a "$B/new-chunk.before" "$NEW"; else rm -f "$NEW"; fi
          if [[ -f "$B/new-proof.before" ]]; then cp -a "$B/new-proof.before" "$NEW_PROOF"; else rm -f "$NEW_PROOF"; fi
          nginx -t && systemctl reload nginx
          sikhadenge-funnel-lockctl reseal || true
          sikhadenge-funnel-lockctl lock || true
          echo ROLLBACK_DONE=$B
          REMOTE
