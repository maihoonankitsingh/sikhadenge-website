name: Registration Form QA

on:
  push:
    branches:
      - feat/masterclass-multistep-registration-20260831

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate blog Prisma client
        run: npm run blog:db:generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
