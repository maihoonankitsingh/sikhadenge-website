name: Deploy Claude Badge Spacing V1 20260903

on:
  push:
    paths:
      - .github/workflows/deploy-claude-badge-spacing-v1-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy only Claude badge-spacing patch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata
          NG=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          ASSET=/var/www/sikhadenge.in/claude-badge-spacing-v1.js
          SOURCE='https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/19d1d6839c471b3365639dacf5d85cd4cbdc693d/public/claude-badge-spacing-v1.js'
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-badge-spacing-v1-$TS"
          test -f "$NG"
          mkdir -p "$BACKUP"
          cp "$NG" "$BACKUP/sikhadenge.in-ssl.before"
          [[ ! -f "$ASSET" ]] || cp "$ASSET" "$BACKUP/claude-badge-spacing-v1.js.before"

          rollback() {
            set +e
            cp "$BACKUP/sikhadenge.in-ssl.before" "$NG"
            if [[ -f "$BACKUP/claude-badge-spacing-v1.js.before" ]]; then
              cp "$BACKUP/claude-badge-spacing-v1.js.before" "$ASSET"
            else
              rm -f "$ASSET"
            fi
            nginx -t && systemctl reload nginx
          }
          trap 'rc=$?; echo "DEPLOY FAILED rc=$rc"; rollback; exit $rc' ERR

          TMP="$(mktemp)"
          curl -fsSL --max-time 30 "$SOURCE" -o "$TMP"
          grep -Fq '__CLAUDE_BADGE_SPACING_V1__' "$TMP"
          test "$(grep -o '12px' "$TMP" | wc -l)" -ge 3
          install -m 0644 "$TMP" "$ASSET"

          python3 - "$NG" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          route='location = /masterclass/claude/free {'
          start=s.find(route)
          if start < 0: raise SystemExit('Claude route not found')
          end=s.find('\n    }',start)
          if end < 0: raise SystemExit('Claude route end not found')
          end += len('\n    }')
          seg=s[start:end]

          old_script='<script src="/claude-badge-spacing-v1.js?v=badge-gap-v1-20260903"></script>'
          script='<script src="/claude-badge-spacing-v1.js?v=badge-gap-standard12-20260903"></script>'
          real_logo='<script src="/claude-proof-real-logos-v1.js?v=real-logos-note-remove-20260903"></script>'
          heading_b='<script src="/claude-heading-v11-restore-current.js?v=old-v11-current-20260903b"></script>'
          theme='<script src="/claude-proof-theme-v2.js?v=claude-orange-theme-v2-20260902"></script>'
          if old_script in seg:
              seg=seg.replace(old_script,script,1)
          elif script not in seg:
              if real_logo in seg:
                  seg=seg.replace(real_logo,real_logo+script,1)
              elif heading_b in seg:
                  seg=seg.replace(heading_b,heading_b+script,1)
              elif theme in seg:
                  seg=seg.replace(theme,theme+script,1)
              else:
                  anchor="</body>';"
                  pos=seg.find(anchor)
                  if pos < 0: raise SystemExit('body injection anchor not found')
                  seg=seg[:pos]+script+seg[pos:]
          s=s[:start]+seg+s[end:]

          marker='# CLAUDE_BADGE_SPACING_V1_ASSET'
          if marker not in s:
              block='''    # CLAUDE_BADGE_SPACING_V1_ASSET
              location = /claude-badge-spacing-v1.js {
                  alias /var/www/sikhadenge.in/claude-badge-spacing-v1.js;
                  default_type application/javascript;
                  add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
                  access_log off;
              }
              # CLAUDE_BADGE_SPACING_V1_ASSET_END

          '''
              idx=s.find(route)
              if idx < 0: raise SystemExit('could not place asset location')
              s=s[:idx]+block+s[idx:]
          p.write_text(s)
          PY

          nginx -t
          systemctl reload nginx
          sleep 1

          curl -fsS --max-time 20 https://sikhadenge.in/claude-badge-spacing-v1.js | grep -Fq 'v1-standard-12'
          HTML="$(mktemp)"
          curl -fsS --max-time 20 'https://sikhadenge.in/masterclass/claude/free?v=badge-spacing-standard12-server' -o "$HTML"
          test "$(grep -o '/claude-badge-spacing-v1.js?v=badge-gap-standard12-20260903' "$HTML" | wc -l)" -eq 1
          test "$(grep -o '/claude-badge-spacing-v1.js?v=badge-gap-v1-20260903' "$HTML" | wc -l)" -eq 0
          grep -Fq '/api/social-proof/live?widget=1' "$HTML"

          AI="$(mktemp)"
          curl -fsS --max-time 20 'https://sikhadenge.in/masterclass/ai-video?v=badge-spacing-isolation' -o "$AI"
          if grep -Fq '/claude-badge-spacing-v1.js' "$AI"; then
            echo 'Claude badge-spacing patch leaked into AI Video source page'
            exit 1
          fi
          echo "BACKUP=$BACKUP"
          echo 'CLAUDE_BADGE_SPACING_STANDARD12_SERVER_OK'
          trap - ERR
          REMOTE

      - name: Verify badge spacing in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          DOM="$RUNNER_TEMP/claude-badge-spacing.html"
          DESK="$RUNNER_TEMP/claude-badge-spacing-desktop.png"
          MOB="$RUNNER_TEMP/claude-badge-spacing-mobile.png"
          URL='https://sikhadenge.in/masterclass/claude/free?v=badge-spacing-standard12-final-20260903'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom "$URL" > "$DOM"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --hide-scrollbars --window-size=1440,7000 --screenshot="$DESK" "$URL"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --hide-scrollbars --window-size=390,9000 --screenshot="$MOB" "$URL"

          grep -Fq 'data-claude-badge-spacing="v1-standard-12"' "$DOM"
          test "$(grep -o 'data-sd-badge-gap-normalized="1"' "$DOM" | wc -l)" -eq 14
          grep -Fq 'id="sd-claude-badge-spacing-v1-style"' "$DOM"
          grep -Fq 'margin-bottom: 12px' "$DOM"
          grep -Fq 'margin-top: 12px' "$DOM"
          test "$(grep -o 'id="ai-video-job-impact-v80"' "$DOM" | wc -l)" -eq 1
          test "$(grep -o 'id="ai-video-ai-opportunity-v85"' "$DOM" | wc -l)" -eq 1
          grep -Fq 'data-claude-proof-note-removed="1"' "$DOM"
          test -s "$DESK"; test -s "$MOB"
          cp "$DESK" "$GITHUB_WORKSPACE/claude-badge-spacing-desktop.png"
          cp "$MOB" "$GITHUB_WORKSPACE/claude-badge-spacing-mobile.png"
          echo 'CLAUDE_BADGE_SPACING_STANDARD12_CHROME_OK'

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: claude-badge-spacing-standard12-qa
          path: |
            claude-badge-spacing-desktop.png
            claude-badge-spacing-mobile.png
          retention-days: 1
