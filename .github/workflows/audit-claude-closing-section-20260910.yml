name: Audit Claude Closing Section 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-closing-section-20260910.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect closing conversion section in 3 viewports
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const sig=errs=>{const x={};for(const e of errs){const m=String(e).match(/Minified React error #(\d+)/);const k=m?`react-${m[1]}`:String(e);x[k]=(x[k]||0)+1;}return x;};
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const errs=[],bad=[];
              p.on('pageerror',e=>errs.push(String(e)));
              p.on('response',r=>{const u=r.url(); if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u))) bad.push(`${r.status()} ${u}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?closing_audit=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,5000));
              const x=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const sections=[...document.querySelectorAll('main section')];
                const section=sections.find(s=>n(s.innerText).includes('Learn AI. Apply it. Work smarter.'));
                const idx=section?sections.indexOf(section):-1;
                const prev=idx>0?sections[idx-1]:null,next=idx>=0?sections[idx+1]:null;
                const rect=section?.getBoundingClientRect();
                const st=section?getComputedStyle(section):null;
                const headings=section?[...section.querySelectorAll('h1,h2,h3,h4,strong')].map(e=>n(e.textContent)).filter(Boolean):[];
                const paras=section?[...section.querySelectorAll('p')].map(e=>n(e.textContent)).filter(Boolean):[];
                const ctas=section?[...section.querySelectorAll('a[href],button')].map(a=>({tag:a.tagName,text:n(a.textContent),href:a.href?new URL(a.href,location.href).pathname:'',aria:a.getAttribute('aria-label')||'',cls:String(a.className||'')})):[];
                const chips=section?[...section.querySelectorAll('span,small,li')].map(e=>n(e.textContent)).filter(t=>t&&t.length<120):[];
                const totalCtas=[...document.querySelectorAll('a[href]')].filter(a=>{try{return new URL(a.href,location.href).pathname==='/gen-ai-masterclass/register-one-step'}catch{return false}}).length;
                return {
                  found:!!section,idx,sectionCount:sections.length,faqCount:document.querySelectorAll('section[data-sd-claude-faq-v2="1"] details').length,totalCtas,
                  text:n(section?.innerText),html:section?.innerHTML.slice(0,18000)||'',headings,paras,ctas,chips:chips.slice(0,40),
                  rect:rect?[Math.round(rect.width),Math.round(rect.height)]:[0,0],
                  style:st?{padding:st.padding,background:st.backgroundColor,color:st.color}:null,
                  prev:n(prev?.innerText?.slice(0,160)),next:n(next?.innerText?.slice(0,160)),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                  scripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/cta|closing|final|value-anchor|bonus/.test(s))
                };
              });
              console.log('CLOSING_BASELINE',name,JSON.stringify(x),'ERRORS',JSON.stringify(sig(errs)),'BAD',JSON.stringify(bad));
              if(!x.found||x.sectionCount!==18||x.overflow||bad.length) throw new Error(`closing baseline structural failure ${name}`);
              await p.close();
            }
            await b.close(); console.log('CLAUDE_CLOSING_BASELINE_3VIEW_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
