name: Deploy Homepage Headings Center V2 20260904
on:
  push:
    paths:
      - '.github/workflows/deploy-homepage-headings-center-v2-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Cleanup failed temp artifacts and deploy heading alignment only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/app/landing/page.tsx"
          FAILED_TS='20260904-132218'
          echo '===== DISK BEFORE SAFE CLEANUP ====='
          df -h / | tail -1
          # Remove ONLY incomplete/transient artifacts created by the failed heading-center run.
          rm -rf "$LIVE/.next.home-headings-center-stage-$FAILED_TS"
          rm -rf "$LIVE/.next.home-headings-center-rollback-$FAILED_TS"
          rm -rf "/var/backups/sikhadenge/home-headings-center-$FAILED_TS/.next.before"
          echo '===== DISK AFTER SAFE CLEANUP ====='
          df -h / | tail -1
          test -f "$LIVE/.next/BUILD_ID"
          test -f "$SRC"

          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/var/tmp/sd-home-headings-center-v2-$TS"
          BAK="/var/backups/sikhadenge/home-headings-center-v2-$TS"
          STAGE="$LIVE/.next.home-headings-center-v2-stage-$TS"
          OLDNEXT="$LIVE/.next.pre-home-headings-center-v2-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT
          cp -a "$SRC" "$BAK/page.tsx.before"
          rsync -a --delete --exclude node_modules --exclude .next "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          NEWSRC="$CAND/app/landing/page.tsx"

          python3 - "$NEWSRC" "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); live=Path(sys.argv[2])
          before=p.read_text(encoding='utf-8'); after=before
          heading_changes=[]; sub_changes=[]
          pat=re.compile(r'<(h1|h2)\s+className="([^"]*)">')
          def hpatch(m):
              tag,cls=m.groups()
              if 'sr-only' in cls.split(): return m.group(0)
              toks=cls.split(); old=cls
              if 'text-center' not in toks: toks.append('text-center')
              if 'mx-auto' not in toks: toks.append('mx-auto')
              new=' '.join(toks)
              if new!=old: heading_changes.append((tag,old,new))
              return f'<{tag} className="{new}">'
          after=pat.sub(hpatch,after)
          pair=re.compile(r'(</h[12]>\s*\n\s*<p\s+className=")([^"]*)(">)')
          def ppatch(m):
              cls=m.group(2); toks=cls.split(); old=cls
              if 'text-center' not in toks: toks.append('text-center')
              if 'mx-auto' not in toks: toks.append('mx-auto')
              new=' '.join(toks)
              if new!=old: sub_changes.append((old,new))
              return m.group(1)+new+m.group(3)
          after=pair.sub(ppatch,after)
          if not heading_changes: raise SystemExit('no visible headings needed centering')
          masker=re.compile(r'className="[^"]*"')
          if masker.sub('className=""',before) != masker.sub('className=""',after):
              raise SystemExit('guard failed: non-className content changed')
          p.write_text(after,encoding='utf-8')
          print('VISIBLE_HEADINGS_CHANGED=',len(heading_changes))
          print('IMMEDIATE_SUBHEADINGS_CHANGED=',len(sub_changes))
          if live.read_text(encoding='utf-8') != before: raise SystemExit('live source changed during candidate prep')
          PY

          cd "$CAND"
          npm run build
          test -f "$CAND/.next/BUILD_ID"
          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]
          rm -rf "$STAGE"
          # /var/tmp and /var/www are on the same production filesystem; rename avoids a second full .next copy.
          if [ "$(stat -c %d "$CAND")" = "$(stat -c %d "$LIVE")" ]; then
            mv "$CAND/.next" "$STAGE"
          else
            mkdir -p "$STAGE"
            rsync -a --exclude cache "$CAND/.next/" "$STAGE/"
          fi
          test -f "$STAGE/BUILD_ID"

          rollback(){
            echo ROLLBACK_START
            cp -a "$BAK/page.tsx.before" "$SRC" || true
            if [ -d "$LIVE/.next" ]; then rm -rf "$LIVE/.next.failed-home-headings-v2-$TS"; mv "$LIVE/.next" "$LIVE/.next.failed-home-headings-v2-$TS" || true; fi
            if [ -d "$OLDNEXT" ]; then mv "$OLDNEXT" "$LIVE/.next" || true; fi
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
          }

          cp -a "$NEWSRC" "$SRC"
          mv "$LIVE/.next" "$OLDNEXT"
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 6
          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?headingcenterv2=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?headingcenterv2=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then rollback; exit 1; fi

          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import re,sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          heads=[]; bad=[]
          for m in re.finditer(r'<(h1|h2)\s+className="([^"]*)">',s):
              cls=m.group(2)
              if 'sr-only' in cls.split(): continue
              heads.append(cls)
              if 'text-center' not in cls.split() or 'mx-auto' not in cls.split(): bad.append(cls)
          subs=[]; badsubs=[]
          for m in re.finditer(r'</h[12]>\s*\n\s*<p\s+className="([^"]*)">',s):
              cls=m.group(1); subs.append(cls)
              if 'text-center' not in cls.split() or 'mx-auto' not in cls.split(): badsubs.append(cls)
          print('LIVE_VISIBLE_H1_H2=',len(heads))
          print('LIVE_UNCENTERED_H1_H2=',len(bad))
          print('LIVE_IMMEDIATE_SUBHEADINGS=',len(subs))
          print('LIVE_UNCENTERED_SUBHEADINGS=',len(badsubs))
          if bad or badsubs: raise SystemExit('center verification failed')
          PY

          # QA passed; remove previous build copy to return disk space. Source backup is retained.
          rm -rf "$OLDNEXT"
          echo '===== DISK AFTER SUCCESS ====='
          df -h / | tail -1
          echo "BACKUP_SOURCE=$BAK/page.tsx.before"
          echo 'HOME_HEADINGS_CENTER_V2_LIVE_OK=1 HOMEPAGE_ONLY=1 CLASSNAME_ONLY=1 CARD_TITLES_UNTOUCHED=1'
          REMOTE
