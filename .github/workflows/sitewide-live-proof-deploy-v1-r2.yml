name: Sitewide Live Registration Proof V1 R2

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-deploy-v1-r2.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Prepare R2 asset-route correction
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .github/scripts/sitewide-live-proof-v1.sh /tmp/sitewide-live-proof-v1-r2.sh
          python3 <<'PY'
          from pathlib import Path
          p=Path('/tmp/sitewide-live-proof-v1-r2.sh')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('script = f\'<script src="/sitewide-live-proof-v1.js?v={tag}"></script>\'',
             'script = f\'<script src="/sitewide-live-proof-assets/sitewide-live-proof-v1.js?v={tag}"></script>\''),
            ('  location = /sitewide-live-proof-v1.js {{',
             '  location ^~ /sitewide-live-proof-assets/ {{'),
            ('    alias {asset};',
             '    alias {str(Path(asset).parent)}/;'),
            ('https://sikhadenge.in/sitewide-live-proof-v1.js?v=${TAG}',
             'https://sikhadenge.in/sitewide-live-proof-assets/sitewide-live-proof-v1.js?v=${TAG}')
          ]
          for old,new in reps:
            n=s.count(old)
            if n != 1:
              raise SystemExit(f'replacement count {n}: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/sitewide-live-proof-v1-r2.sh

      - name: Deploy sitewide live proof R2
        shell: bash
        run: bash /tmp/sitewide-live-proof-v1-r2.sh
