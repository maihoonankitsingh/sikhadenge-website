name: Inspect Claude Heading Live 20260903

on:
  push:
    paths:
      - .github/workflows/inspect-claude-heading-live-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read live Claude heading assets and prior backups only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          NG=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          echo '===== CLAUDE ROUTE SCRIPT REFERENCES ====='
          curl -ksS 'https://sikhadenge.in/masterclass/claude/free?v=heading-inspect-20260903' | grep -oE '<script[^>]+src="[^"]+"' | sed -E 's/.*src="([^"]+)"/\1/' | tail -30 || true

          echo '===== FIND CURRENT HEADING ASSET ====='
          find /var/www /opt /root -type f -name 'sikhadenge-heading-claude-v308r-20260830-174053.js' -print 2>/dev/null | head -20 | while read -r f; do
            echo "--- FILE $f ---"
            sed -n '1,320p' "$f"
          done

          echo '===== PRIOR HEADING BACKUP V307 ====='
          for f in \
            /var/backups/sikhadenge/heading-v307-20260830-163351/heading-js.before \
            /var/backups/sikhadenge/heading-v307b-20260830-164049/heading.before \
            /var/backups/sikhadenge/restore-new-headings-20260829-190439/heading.js; do
            if [ -f "$f" ]; then
              echo "--- BACKUP $f ---"
              sed -n '1,260p' "$f"
            fi
          done

          echo '===== NGINX ALIASES CONTAINING HEADING ====='
          grep -nEi 'heading|v308r|174053' "$NG" | head -100 || true
          REMOTE
