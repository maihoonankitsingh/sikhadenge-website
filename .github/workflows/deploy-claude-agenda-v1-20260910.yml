name: Deploy Claude Agenda V1 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-claude-agenda-v1-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 18
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Controlled Agenda V1 deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SITE='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          ASSETS='/etc/nginx/snippets/sikhadenge-claude-31aug6pm-assets-final.conf'
          CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          DIR="$CWD/.next/static/chunks/pages/masterclass/claude"
          BASE_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806.js'
          CURRENT_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-20260910.js'
          NEW_NAME='free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-20260910.js'
          CURRENT="$DIR/$CURRENT_NAME"; NEW="$DIR/$NEW_NAME"
          BASE_URL="/_next/static/chunks/pages/masterclass/claude/$BASE_NAME"
          CURRENT_URL="/_next/static/chunks/pages/masterclass/claude/$CURRENT_NAME"
          NEW_URL="/_next/static/chunks/pages/masterclass/claude/$NEW_NAME"
          TS="$(date +%Y%m%d-%H%M%S)"; BK="/var/backups/sikhadenge/claude-agenda-v1-$TS"; mkdir -p "$BK"
          cp -L "$SITE" "$BK/sikhadenge.in-ssl.before"; cp -L "$ASSETS" "$BK/claude-assets.before"; [[ -f "$NEW" ]] && cp -a "$NEW" "$BK/new-chunk.before" || true
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 'https://sikhadenge.in/masterclass/ai-video?agenda_v1_before=1' -o "$BK/ai.before.html"
          AI_BEFORE="$(sha256sum "$BK/ai.before.html"|awk '{print $1}')"
          rollback(){ rc=$?; echo "ROLLBACK rc=$rc"; cat "$BK/sikhadenge.in-ssl.before" > "$SITE" || true; cat "$BK/claude-assets.before" > "$ASSETS" || true; if [[ -f "$BK/new-chunk.before" ]]; then cp -a "$BK/new-chunk.before" "$NEW"; else rm -f "$NEW"; fi; nginx -t && systemctl reload nginx || true; sikhadenge-funnel-lockctl reseal || true; sikhadenge-funnel-lockctl lock || true; exit "$rc"; }
          trap rollback ERR

          sikhadenge-funnel-lockctl check
          test "$(sha256sum "$CURRENT"|awk '{print $1}')" = 'ff52a32e33e94e6e499ee402ff24b0bc84a5d9c882f9d2df44e45a2fb6865a8d'
          sikhadenge-funnel-lockctl unlock 15
          sikhadenge-funnel-lockctl assert-unlocked

          cp -a "$CURRENT" "$NEW"
          python3 - "$NEW" <<'PY'
          import sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          reps=[
            ('LIVE MASTERCLASS ROADMAP','LIVE MASTERCLASS AGENDA'),
            ('A practical AI journey where you learn research, writing, analysis and reusable workflows step by step.','5 practical modules that show what to use, when to use it and how to combine AI tools into repeatable work.'),
            ('Choose the right AI tool','Choose the right AI tool for the task'),
            ('Research & deep work','Research, summarise & extract insights'),
            ('Content & professional output','Create professional work faster'),
            ('Create stronger emails, reports, presentations, ideas and professional content with AI.','Draft stronger emails, reports, presentations and professional content with AI.'),
            ('Coding, agents & automation','Code & automate repetitive work'),
            ('See how AI can assist with coding, repetitive digital work and modern workflow automation.','Use AI to understand and improve code, handle repetitive digital work and explore practical automation workflows.'),
            ('Build your AI workflow','Build a repeatable AI workflow'),
          ]
          for old,new in reps:
              c=s.count(old); print('REPLACE_COUNT',repr(old),c)
              if c!=1: raise SystemExit(f'expected one occurrence of {old!r}, got {c}')
              s=s.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(s)
          print('AGENDA_CLIENT_PATCH=PASS')
          PY
          node --check "$NEW"
          NEW_SHA="$(sha256sum "$NEW"|awk '{print $1}')"; echo "NEW_CHUNK_SHA=$NEW_SHA"

          if ! grep -Fq 'SIKHADENGE_CLAUDE_AGENDA_V1_CHUNK_20260910' "$ASSETS"; then
            printf '\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
              '# SIKHADENGE_CLAUDE_AGENDA_V1_CHUNK_20260910' \
              "location = $NEW_URL {" \
              "    alias $NEW;" \
              '    default_type application/javascript;' \
              '    add_header Cache-Control "public, max-age=31536000, immutable" always;' \
              '    add_header X-SD-Claude-Asset "agenda-v1-20260910" always;' \
              '}' >> "$ASSETS"
          fi

          python3 - "$SITE" "$BASE_URL" "$CURRENT_URL" "$NEW_URL" <<'PY'
          import sys
          p,baseurl,currenturl,newurl=sys.argv[1:]
          s=open(p,encoding='utf-8').read(); needle='location = /masterclass/claude/free {'; a=s.find(needle)
          if a<0: raise SystemExit('Claude route missing')
          q=s.find('{',a); d=0; quote=None; esc=False; end=None
          for i in range(q,len(s)):
              ch=s[i]
              if esc: esc=False; continue
              if ch=='\\': esc=True; continue
              if quote:
                  if ch==quote: quote=None
                  continue
              if ch in ('"',"'"): quote=ch; continue
              if ch=='{': d+=1
              elif ch=='}':
                  d-=1
                  if d==0: end=i+1; break
          if end is None: raise SystemExit('route parse failed')
          route=s[a:end]
          if '# SIKHADENGE_CLAUDE_AGENDA_V1_20260910' in route: raise SystemExit('unexpected Agenda V1 marker')
          old_line=f"        sub_filter '{baseurl}' '{currenturl}';"
          new_line=f"        sub_filter '{baseurl}' '{newurl}';"
          if route.count(old_line)!=1: raise SystemExit(f'current chunk route line count={route.count(old_line)}')
          route=route.replace(old_line,new_line,1)
          filters=[
            ('LIVE MASTERCLASS ROADMAP','LIVE MASTERCLASS AGENDA'),
            ('A practical AI journey where you learn research, writing, analysis and reusable workflows step by step.','5 practical modules that show what to use, when to use it and how to combine AI tools into repeatable work.'),
            ('Choose the right AI tool','Choose the right AI tool for the task'),
            ('Research &amp; deep work','Research, summarise &amp; extract insights'),
            ('Content &amp; professional output','Create professional work faster'),
            ('Create stronger emails, reports, presentations, ideas and professional content with AI.','Draft stronger emails, reports, presentations and professional content with AI.'),
            ('Coding, agents &amp; automation','Code &amp; automate repetitive work'),
            ('See how AI can assist with coding, repetitive digital work and modern workflow automation.','Use AI to understand and improve code, handle repetitive digital work and explore practical automation workflows.'),
            ('Build your AI workflow','Build a repeatable AI workflow'),
          ]
          block='\n        # SIKHADENGE_CLAUDE_AGENDA_V1_20260910\n'
          for old,new in filters: block += '        sub_filter '+repr(old)+' '+repr(new)+';\n'
          route=route.replace(new_line+'\n',new_line+'\n'+block,1)
          open(p,'w',encoding='utf-8').write(s[:a]+route+s[end:])
          print('AGENDA_ROUTE_PATCH=PASS')
          PY

          nginx -t; systemctl reload nginx; sleep 2
          code="$(curl -L -sS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 -o "$BK/new.public.js" -w '%{http_code}' "https://sikhadenge.in${NEW_URL}?first=$TS")"; echo "NEW_ASSET_HTTP=$code"; test "$code" = 200
          test "$(sha256sum "$BK/new.public.js"|awk '{print $1}')" = "$NEW_SHA"
          grep -Fq 'LIVE MASTERCLASS AGENDA' "$BK/new.public.js"
          grep -Fq 'children:"Choose the right AI tool for the task"' "$BK/new.public.js"
          grep -Fq 'children:"Code & automate repetitive work"' "$BK/new.public.js"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 "https://sikhadenge.in/masterclass/claude/free?agenda_v1_server=$TS" -o "$BK/claude.after.html"
          for x in \
            'LIVE MASTERCLASS AGENDA' \
            '5 practical modules that show what to use, when to use it and how to combine AI tools into repeatable work.' \
            'Choose the right AI tool for the task' \
            'Research, summarise &amp; extract insights' \
            'Create professional work faster' \
            'Code &amp; automate repetitive work' \
            'Build a repeatable AI workflow'; do grep -Fq "$x" "$BK/claude.after.html"; done
          grep -Fq 'Master <mark>Claude + 25+ AI Tools</mark>' "$BK/claude.after.html"
          grep -Fq '<strong>150,000+ Learners</strong>' "$BK/claude.after.html"
          grep -Fq '>What you can <span class="sd-heading-highlight">do with AI</span></h2>' "$BK/claude.after.html"
          ! grep -Fq 'Coding, agents &amp; automation' "$BK/claude.after.html"

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 35 'https://sikhadenge.in/masterclass/ai-video?agenda_v1_after=1' -o "$BK/ai.after.html"
          test "$AI_BEFORE" = "$(sha256sum "$BK/ai.after.html"|awk '{print $1}')"
          echo "AI_UNCHANGED_SHA=$AI_BEFORE"
          echo "$BK" > /var/backups/sikhadenge/.claude-agenda-v1-last
          trap - ERR
          echo "SERVER_STAGE_PASS=$BK"
          REMOTE

      - name: Browser QA desktop tablet mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1; npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          cat > qa.js <<'JS'
          const puppeteer=require('puppeteer-core');
          const norm=s=>(s||'').replace(/\s+/g,' ').replace(/,\s*/g,',').trim();
          const wantH='Master Claude + 25+ AI Tools to work smarter,create faster & get better results.';
          const outcomes=['Research a topic and turn it into presentation-ready insights','Summarise long reports, PDFs & notes into clear action points','Create structured presentations, emails & professional content faster','Understand and improve code with AI-assisted workflows','Work with Excel formulas & data using natural-language AI guidance','Improve LinkedIn research, profile content & outreach workflows'];
          const agenda=['Choose the right AI tool for the task','Research, summarise & extract insights','Create professional work faster','Code & automate repetitive work','Build a repeatable AI workflow'];
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const fail=[];
          for(const [n,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){const p=await b.newPage();await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});const bad=[];p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)))bad.push(`${r.status()} ${u}`)});await p.goto(`https://sikhadenge.in/masterclass/claude/free?agenda_v1_browser=${n}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});await new Promise(r=>setTimeout(r,3000));const x=await p.evaluate(()=>{const h1=document.querySelector('h1');const hero=h1?.closest('section')||h1?.parentElement?.parentElement;const proof=hero?[...hero.querySelectorAll('[class*="proofCard"]')].slice(0,3).map(c=>(c.querySelector('strong')?.textContent||'').trim()):[];const hs=[...document.querySelectorAll('h2')];const oh=hs.find(h=>(h.textContent||'').replace(/\s+/g,' ').trim()==='What you can do with AI');const os=oh?.closest('section');const outcomeItems=os?[...os.querySelectorAll('[class*="itemText"]')].map(e=>(e.textContent||'').trim()).slice(0,6):[];const allText=(document.body.innerText||'').replace(/\s+/g,' ');const reg='/gen-ai-masterclass/register-one-step';const ctas=[...document.querySelectorAll('a[href]')].filter(a=>{try{return new URL(a.href,location.href).pathname===reg}catch{return false}}).length;const agendaHeads=[...document.querySelectorAll('h3,h4')].map(e=>(e.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean);return{h1:h1?.textContent||'',proof,outcomeItems,agendaHeads,hasAgendaLabel:allText.includes('LIVE MASTERCLASS AGENDA'),hasAgendaIntro:allText.includes('5 practical modules that show what to use, when to use it and how to combine AI tools into repeatable work.'),oldAgents:allText.includes('Coding, agents & automation'),sections:document.querySelectorAll('main section').length,faq:document.querySelectorAll('section[data-sd-claude-faq-v2="1"] details').length,ctas,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,scripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>s.includes('/masterclass/claude/free-'))}});console.log(n,JSON.stringify(x),'failedAssets',bad.length);const trust=x.proof.length===3&&x.proof[0]==='150,000+ Learners'&&x.proof[1]==='4.9/5 Rating'&&x.proof[2]==='Live · Practical';const out=JSON.stringify(x.outcomeItems)===JSON.stringify(outcomes);const ag=agenda.every(t=>x.agendaHeads.includes(t))&&x.hasAgendaLabel&&x.hasAgendaIntro&&!x.oldAgents;if(norm(x.h1)!==wantH||!trust||!out||!ag||x.sections!==18||x.faq!==15||x.ctas<7||x.overflow||bad.length||!x.scripts.some(s=>s.includes('agenda-v1-20260910.js')))fail.push(n+': '+JSON.stringify(x)+' bad='+bad.join(','));await p.close()}await b.close();if(fail.length)throw Error(fail.join('\n'));console.log('CLAUDE_AGENDA_V1_3VIEW_QA_PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js

      - name: Reseal and lock Golden baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl reseal
          sikhadenge-funnel-lockctl lock
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status
          echo 'CLAUDE_AGENDA_V1_RESEALED_LOCKED=PASS'
          REMOTE

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          M='/var/backups/sikhadenge/.claude-agenda-v1-last'; [[ -s "$M" ]] || { sikhadenge-funnel-lockctl lock || true; exit 0; }; B="$(cat "$M")"
          SITE='/etc/nginx/sites-enabled/sikhadenge.in-ssl'; ASSETS='/etc/nginx/snippets/sikhadenge-claude-31aug6pm-assets-final.conf'; CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'; NEW="$CWD/.next/static/chunks/pages/masterclass/claude/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-trust-v1-outcomes-v1-agenda-v1-20260910.js"
          sikhadenge-funnel-lockctl unlock 5 || true
          [[ -s "$B/sikhadenge.in-ssl.before" ]] && cat "$B/sikhadenge.in-ssl.before" > "$SITE"
          [[ -s "$B/claude-assets.before" ]] && cat "$B/claude-assets.before" > "$ASSETS"
          if [[ -f "$B/new-chunk.before" ]]; then cp -a "$B/new-chunk.before" "$NEW"; else rm -f "$NEW"; fi
          nginx -t && systemctl reload nginx
          sikhadenge-funnel-lockctl reseal || true
          sikhadenge-funnel-lockctl lock || true
          echo "ROLLBACK_DONE=$B"
          REMOTE
