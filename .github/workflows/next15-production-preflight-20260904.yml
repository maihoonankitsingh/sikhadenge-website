name: Next 15 Production Preflight 20260904

on:
  push:
    branches:
      - ops/next15-production-preflight-20260904
    paths:
      - .github/workflows/next15-production-preflight-20260904.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect live website topology
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PM2_HOME=/root/.pm2
          LIVE='/var/www/sikhadenge.in/sikhadenge-website-space'
          echo '===== HOST ====='
          hostname
          date -Is
          echo '===== LIVE PATH ====='
          ls -ld "$LIVE" || true
          readlink -f "$LIVE" || true
          echo '===== LIVE GIT ====='
          if [ -d "$LIVE/.git" ] || git -C "$LIVE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$LIVE" status --short --branch || true
            printf 'HEAD='; git -C "$LIVE" rev-parse HEAD || true
            printf 'BRANCH='; git -C "$LIVE" branch --show-current || true
            git -C "$LIVE" remote -v | sed -E 's#(https://)[^/@]+@#\1***@#g' || true
          else
            echo 'NOT_A_GIT_WORKTREE'
          fi
          echo '===== LIVE PACKAGE ====='
          if [ -f "$LIVE/package.json" ]; then
            node -e "const p=require('$LIVE/package.json'); console.log(JSON.stringify({next:p.dependencies?.next,react:p.dependencies?.react,reactDom:p.dependencies?.['react-dom']},null,2))"
          fi
          echo '===== INSTALLED RUNTIME ====='
          if [ -f "$LIVE/node_modules/next/package.json" ]; then node -p "require('$LIVE/node_modules/next/package.json').version"; else echo 'NO_INSTALLED_NEXT'; fi
          if [ -f "$LIVE/.next/BUILD_ID" ]; then printf 'BUILD_ID='; cat "$LIVE/.next/BUILD_ID"; fi
          echo '===== ENV FILE NAMES ONLY ====='
          find "$LIVE" -maxdepth 1 -type f -name '.env*' -printf '%f\n' | sort || true
          echo '===== PM2 ====='
          pm2 jlist | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const p of JSON.parse(s)){console.log(JSON.stringify({name:p.name,pid:p.pid,status:p.pm2_env?.status,cwd:p.pm2_env?.pm_cwd,script:p.pm2_env?.pm_exec_path,args:p.pm2_env?.args,port:p.pm2_env?.env?.PORT,NODE_ENV:p.pm2_env?.env?.NODE_ENV}))}})" || pm2 ls
          echo '===== LISTENERS 3000-4999 ====='
          ss -ltnp | grep -E ':(3[0-9]{3}|4[0-9]{3})\b' || true
          echo '===== NGINX REFERENCES ====='
          grep -RniE 'sikhadenge-website-space|proxy_pass http://127\.0\.0\.1:[0-9]+' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -n 120 || true
          echo '===== LOCAL HEALTH ====='
          curl -ksS -o /tmp/site-home.html -w 'PUBLIC_HOME=%{http_code}\n' --max-time 15 https://sikhadenge.in/
          grep -Fq 'Become an AI Expert' /tmp/site-home.html && echo 'HOME_SIGNATURE=OK' || echo 'HOME_SIGNATURE=MISSING'
          REMOTE

# retrigger: 20260904
