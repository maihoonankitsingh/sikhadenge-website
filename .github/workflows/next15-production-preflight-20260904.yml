name: Next 15 Production Preflight 20260904

on:
  push:
    branches:
      - ops/next15-production-preflight-20260904
    paths:
      - .github/workflows/next15-production-preflight-20260904.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect active release and routing
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PM2_HOME=/root/.pm2
          R='/var/www/sikhadenge.in/releases/sitewide-manrope-font-20260902-231335'
          NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          echo '===== ACTIVE 3955 RELEASE ====='
          ls -ld "$R"
          if [ -f "$R/package.json" ]; then node -e "const p=require('$R/package.json'); console.log(JSON.stringify({next:p.dependencies?.next,react:p.dependencies?.react,reactDom:p.dependencies?.['react-dom']},null,2))"; fi
          if [ -f "$R/node_modules/next/package.json" ]; then printf 'INSTALLED_NEXT='; node -p "require('$R/node_modules/next/package.json').version"; fi
          if [ -f "$R/.next/BUILD_ID" ]; then printf 'BUILD_ID='; cat "$R/.next/BUILD_ID"; echo; fi
          echo 'ENV_FILES:'; find "$R" -maxdepth 1 -type f -name '.env*' -printf '%f\n' | sort || true
          echo '===== ACTIVE RELEASE GIT/PROVENANCE ====='
          if git -C "$R" rev-parse --is-inside-work-tree >/dev/null 2>&1; then git -C "$R" status --short --branch || true; printf 'HEAD='; git -C "$R" rev-parse HEAD || true; else echo NOT_GIT; fi
          echo '===== NGINX 120-540 ====='
          nl -ba "$NG" | sed -n '120,540p' | sed -E 's/(authorization|token|secret|password|cookie)[^;]*/\1 [REDACTED]/Ig'
          echo '===== 3955 DIRECT ROUTES ====='
          for u in / /about-us /blog /experts /reviews /contact /robots.txt /sitemap.xml; do code="$(curl -sS -o /tmp/x -w '%{http_code}' --max-time 10 "http://127.0.0.1:3955$u" || true)"; printf '%s %s\n' "$code" "$u"; done
          echo '===== ROOT NEXT BUILD ASSET SAMPLE ====='
          curl -sS --max-time 10 http://127.0.0.1:3955/ | grep -oE '/_next/static/[^" ]+' | head -n 8 || true
          REMOTE
