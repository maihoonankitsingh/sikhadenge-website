name: Inspect Claude Trust Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-trust-temp-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Trace exact trust source
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CWD='/var/www/sikhadenge.in/releases/production-ai-video-icons-hotfix-20260829-091916'
          echo '=== EXACT FILE OWNERS ==='
          for term in '150,000+' '4.9/5' '5Lac+' 'LEARNER TRUST' 'LEARNER RATING'; do
            echo "--- $term ---"
            grep -RIlF "$term" "$CWD/.next" /var/www/sikhadenge.in/*.js 2>/dev/null | head -30 || true
          done
          echo '=== MATCH CONTEXT IN CURRENT VERSIONED CLIENT CHUNK ==='
          F="$CWD/.next/static/chunks/pages/masterclass/claude/free-802d96fd8696db68-v315r-20260830-204006-v316-20260830-204806-hero-v1-20260910.js"
          [[ -f "$F" ]] && python3 - "$F" <<'PY'
          import sys
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          for t in ['150,000+','4.9/5','5Lac+','LEARNER TRUST','LEARNER RATING']:
              i=s.find(t); print('TERM',repr(t),'POS',i)
              if i>=0: print(s[max(0,i-500):i+800])
          PY
          echo '=== ROOT PROOF FILE CONTEXT ==='
          for f in /var/www/sikhadenge.in/claude-proof-*.js /var/www/sikhadenge.in/claude-*proof*.js; do
            [[ -f "$f" ]] || continue
            if grep -qE '150,000|4\.9/5|5Lac' "$f"; then
              echo "FILE=$f SHA=$(sha256sum "$f"|awk '{print $1}')"
              grep -nE '150,000|4\.9/5|5Lac|Students|WhatsApp' "$f" | head -40 || true
            fi
          done
          REMOTE
