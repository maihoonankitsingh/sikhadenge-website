name: Inspect Claude Trust Temp 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-claude-trust-temp-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only trust inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          URL='https://sikhadenge.in/masterclass/claude/free?trust_audit=20260910'
          TMP=$(mktemp); curl -fsSL --max-time 30 "$URL" -o "$TMP"
          echo '=== GOLDEN STATUS ==='; sikhadenge-funnel-lockctl status | sed -n '1,45p'
          echo '=== PUBLIC KEYWORD CONTEXT ==='
          python3 - "$TMP" <<'PY'
          import sys,re,html
          s=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          text=html.unescape(re.sub(r'<script\b[^>]*>.*?</script>|<style\b[^>]*>.*?</style>',' ',s,flags=re.S|re.I))
          text=re.sub(r'<[^>]+>',' ',text); text=re.sub(r'\s+',' ',text)
          for key in ['4.9','learner','Learner','rating','Rating','trusted','Trusted','student','Student','lakh','Lakh','150K','1.5']:
              pos=[m.start() for m in re.finditer(re.escape(key),text)]
              if pos:
                  print('KEY',repr(key),'COUNT',len(pos))
                  for p in pos[:8]: print(text[max(0,p-180):p+260])
          PY
          echo '=== HTML MARKERS ==='
          grep -oE 'data-sd-[A-Za-z0-9_-]+="[^"]*"|id="[^"]*(proof|trust|rating|learner)[^"]*"|class="[^"]*(proof|trust|rating|learner)[^"]*"' "$TMP" | head -120 || true
          echo '=== INJECTED SCRIPT URLS WITH PROOF/TRUST ==='
          grep -oE '<script[^>]+src="[^"]+"' "$TMP" | sed -E 's/.*src="([^"]+)"/\1/' | grep -Ei 'proof|trust|logo|rating|learner' || true
          echo '=== SERVER FILE MATCHES ==='
          for root in /var/www/sikhadenge.in /etc/nginx; do
            grep -RIlE '4\.9|150K|1\.5[[:space:]]*Lakh|Lakh\+|learners|Learners|proof-static|proof-exact|real-logos' "$root" 2>/dev/null | head -100 || true
          done
          echo '=== ROUTE INJECTION LINES ==='
          grep -nEi 'proof|trust|rating|learner|logo' /etc/nginx/sites-enabled/sikhadenge.in-ssl | head -100 || true
          rm -f "$TMP"
          REMOTE
