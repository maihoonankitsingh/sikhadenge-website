name: Resolve Home Tools Official Icons 20260903

on:
  push:
    paths:
      - .github/workflows/resolve-home-tools-official-icons-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Resolve official icon links read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'python3 -' <<'PY'
          import re, urllib.request, urllib.parse, ssl
          sites = [
            ('ChatGPT','https://chatgpt.com/'),
            ('Claude','https://claude.ai/'),
            ('Gemini','https://gemini.google.com/'),
            ('DeepSeek','https://www.deepseek.com/'),
            ('Perplexity','https://www.perplexity.ai/'),
            ('Midjourney','https://www.midjourney.com/'),
            ('Ideogram','https://ideogram.ai/'),
            ('Runway','https://runway.com/'),
            ('Pika','https://pika.art/'),
            ('Veo','https://deepmind.google/models/veo/'),
            ('Luma AI','https://lumalabs.ai/'),
            ('ElevenLabs','https://elevenlabs.io/'),
            ('HeyGen','https://www.heygen.com/'),
            ('Descript','https://www.descript.com/'),
            ('Notion AI','https://www.notion.com/'),
            ('Zapier','https://zapier.com/'),
            ('Make','https://www.make.com/en'),
            ('n8n','https://n8n.io/'),
            ('Webflow AI','https://webflow.com/'),
            ('Gamma AI','https://gamma.app/'),
          ]
          ctx=ssl.create_default_context()
          ua={'User-Agent':'Mozilla/5.0'}
          for name,url in sites:
            print(f'=== {name} | {url} ===')
            try:
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=15,context=ctx) as r:
                final=r.geturl(); html=r.read(2_000_000).decode('utf-8','ignore')
              found=[]
              for tag in re.findall(r'<link\b[^>]*>',html,re.I):
                if re.search(r'rel=["\'][^"\']*(?:icon|apple-touch-icon)[^"\']*["\']',tag,re.I):
                  m=re.search(r'href=["\']([^"\']+)["\']',tag,re.I)
                  if m:
                    found.append(urllib.parse.urljoin(final,m.group(1)))
              for x in dict.fromkeys(found): print(x)
              if not found: print('NO_ICON_LINK_FOUND')
            except Exception as e:
              print('ERROR',type(e).__name__,str(e)[:160])
          PY
