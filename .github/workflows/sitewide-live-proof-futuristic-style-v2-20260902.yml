name: Sitewide Live Proof Futuristic Style V2

on:
  push:
    paths:
      - .github/workflows/sitewide-live-proof-futuristic-style-v2-20260902.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    env:
      SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
      SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
      SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'test "$(id -u)" = "0"'

      - name: Patch widget style only
        shell: bash
        run: |
          set -Eeuo pipefail
          KEY="$HOME/.ssh/prod"
          ssh -p "$SSH_PORT" -i "$KEY" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          FILE="/var/www/sikhadenge.in/social-proof-live/sitewide-live-proof-v1.js"
          test -f "$FILE"
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="${FILE}.futuristic-v2-backup-${TS}"
          cp -a "$FILE" "$BACKUP"
          BEFORE_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "before_sha=$BEFORE_SHA"

          python3 - <<'PY'
          from pathlib import Path

          p=Path('/var/www/sikhadenge.in/social-proof-live/sitewide-live-proof-v1.js')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label} count={n}')
              s=s.replace(old,new,1)

          once(
'''          left:auto;
          right:24px;
          bottom:24px;
          width:318px;''',
'''          left:auto;
          right:24px;
          top:max(88px,calc(env(safe-area-inset-top,0px) + 72px));
          bottom:auto;
          width:352px;''',
'host-position'
          )

          once(
'''          font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;''',
'''          font-family:Manrope,Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;''',
'font-family'
          )

          once(
'''          min-height:86px;
          display:grid;
          grid-template-columns:18px minmax(0,1fr) auto;
          grid-template-rows:auto auto auto;
          column-gap:10px;
          row-gap:1px;
          padding:12px 13px;
          border:1px solid rgba(226,96,69,.40);
          border-radius:18px;
          background:rgba(255,249,245,.97);
          color:#171717;
          box-shadow:0 14px 38px rgba(15,23,42,.14);
          backdrop-filter:blur(12px);''',
'''          min-height:94px;
          display:grid;
          grid-template-columns:18px minmax(0,1fr) auto;
          grid-template-rows:auto auto auto;
          column-gap:11px;
          row-gap:2px;
          padding:14px 15px;
          border:1px solid rgba(96,165,250,.30);
          border-radius:22px;
          background:
            radial-gradient(circle at 88% 14%,rgba(56,189,248,.15),transparent 34%),
            linear-gradient(135deg,rgba(8,15,34,.965),rgba(12,20,45,.935) 58%,rgba(17,24,39,.95));
          color:#f8fbff;
          box-shadow:
            0 22px 62px rgba(2,6,23,.28),
            0 6px 20px rgba(37,99,235,.10),
            inset 0 1px 0 rgba(255,255,255,.10);
          backdrop-filter:blur(20px) saturate(145%);
          -webkit-backdrop-filter:blur(20px) saturate(145%);
          overflow:hidden;
          isolation:isolate;''',
'card-shell'
          )

          once(
'''        *{box-sizing:border-box}
        .card{''',
'''        *{box-sizing:border-box}
        .card::before{
          content:"";
          position:absolute;
          inset:0 auto auto 0;
          width:100%;
          height:1px;
          background:linear-gradient(90deg,transparent,rgba(125,211,252,.80),rgba(129,140,248,.72),transparent);
          opacity:.85;
          pointer-events:none;
        }
        .card::after{
          content:"";
          position:absolute;
          width:120px;
          height:120px;
          right:-54px;
          top:-62px;
          border-radius:999px;
          background:rgba(59,130,246,.12);
          filter:blur(8px);
          pointer-events:none;
          z-index:0;
        }
        .card>*{position:relative;z-index:1}
        .card{''',
'card-effects'
          )

          once(
'''          background:#51d88a;
          box-shadow:0 0 0 7px rgba(81,216,138,.15);''',
'''          background:#4ade80;
          box-shadow:0 0 0 6px rgba(74,222,128,.12),0 0 18px rgba(74,222,128,.50);''',
'pulse'
          )

          once(
'''          font-size:11px;
          line-height:14px;
          font-weight:800;
          letter-spacing:.045em;
          text-transform:uppercase;
          color:#cf553e;''',
'''          font-size:10.5px;
          line-height:14px;
          font-weight:800;
          letter-spacing:.12em;
          text-transform:uppercase;
          color:#93c5fd;''',
'title'
          )

          once(
'''          padding:5px 9px;
          border-radius:999px;
          background:#16a34a;
          color:#fff;
          font-size:10px;
          line-height:1;
          font-weight:800;
          letter-spacing:.04em;''',
'''          padding:6px 10px;
          border:1px solid rgba(74,222,128,.30);
          border-radius:999px;
          background:linear-gradient(135deg,rgba(22,163,74,.96),rgba(5,150,105,.96));
          color:#fff;
          font-size:9.5px;
          line-height:1;
          font-weight:800;
          letter-spacing:.08em;
          box-shadow:0 6px 18px rgba(34,197,94,.16);''',
'live-pill'
          )

          once(
'''          font-size:25px;
          line-height:28px;
          font-weight:800;
          letter-spacing:-.04em;
          color:#cf553e;''',
'''          font-size:28px;
          line-height:30px;
          font-weight:800;
          letter-spacing:-.045em;
          background:linear-gradient(90deg,#ffffff 0%,#bae6fd 46%,#a5b4fc 100%);
          -webkit-background-clip:text;
          background-clip:text;
          color:transparent;''',
'number'
          )

          once(
'''          font-size:11px;
          line-height:14px;
          color:#333;
          white-space:nowrap;''',
'''          font-size:11px;
          line-height:14px;
          font-weight:600;
          color:rgba(226,232,240,.78);
          white-space:nowrap;''',
'desc'
          )

          once(
'''          font-size:10px;
          line-height:13px;
          color:#777;''',
'''          font-size:10px;
          line-height:13px;
          font-weight:600;
          color:rgba(203,213,225,.64);''',
'foot'
          )

          once(
'''          color:#4b5563;''',
'''          color:rgba(226,232,240,.76);''',
'latest-color'
          )

          once(
'''        .latest strong{color:#202020;font-weight:750}
        .auto{white-space:nowrap;color:#8a8a8a}''',
'''        .latest strong{color:#ffffff;font-weight:800}
        .auto{white-space:nowrap;color:rgba(148,163,184,.70)}''',
'latest-auto'
          )

          once(
'''          left:0;
          bottom:104px;
          width:100%;''',
'''          left:0;
          top:108px;
          bottom:auto;
          width:100%;''',
'toast-position'
          )

          once(
'''          border:1px solid rgba(34,197,94,.25);
          border-radius:15px;
          background:rgba(255,255,255,.98);
          color:#111827;
          box-shadow:0 16px 42px rgba(15,23,42,.18);''',
'''          border:1px solid rgba(74,222,128,.26);
          border-radius:18px;
          background:linear-gradient(135deg,rgba(7,16,35,.97),rgba(14,24,48,.95));
          color:#f8fafc;
          box-shadow:0 18px 46px rgba(2,6,23,.30),inset 0 1px 0 rgba(255,255,255,.08);
          backdrop-filter:blur(18px) saturate(140%);
          -webkit-backdrop-filter:blur(18px) saturate(140%);''',
'toast-shell'
          )

          once(
'''          color:#16a34a;''',
'''          color:#4ade80;''',
'toast-label'
          )

          once(
'''          .toast{transition:none}''',
'''          .toast{transition:none}
          .card{animation:none!important}''',
'reduced-motion'
          )

          once(
'''          .toast{transition:none}
          .card{animation:none!important}
        }''',
'''          .toast{transition:none}
          .card{animation:none!important}
        }
        @keyframes sdProofV2In{
          from{opacity:0;transform:translate3d(18px,-8px,0) scale(.985)}
          to{opacity:1;transform:translate3d(0,0,0) scale(1)}
        }
        .card{animation:sdProofV2In .42s cubic-bezier(.22,1,.36,1) both}''',
'entrance-animation'
          )

          once(
'''          :host{
            left:12px;
            bottom:calc(12px + env(safe-area-inset-bottom,0px));
            width:min(336px,calc(100vw - 24px));
          }
          .card{border-radius:16px;padding:11px 12px}
          .number{font-size:23px;line-height:26px}
          .desc{font-size:10.5px}''',
'''          :host{
            left:12px;
            right:12px;
            top:calc(72px + env(safe-area-inset-top,0px));
            bottom:auto;
            width:auto;
          }
          .card{border-radius:18px;padding:12px 13px;min-height:88px}
          .number{font-size:24px;line-height:27px}
          .desc{font-size:10.5px}
          .toast{top:101px}''',
'mobile-layout'
          )

          p.write_text(s,encoding='utf-8')
          PY

          node --check "$FILE"
          grep -Fq 'font-family:Manrope,Inter' "$FILE"
          grep -Fq 'top:max(88px,calc(env(safe-area-inset-top,0px) + 72px));' "$FILE"
          grep -Fq 'background:linear-gradient(90deg,#ffffff 0%,#bae6fd 46%,#a5b4fc 100%);' "$FILE"
          grep -Fq 'top:108px;' "$FILE"
          grep -Fq 'sdProofV2In' "$FILE"

          AFTER_SHA="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "after_sha=$AFTER_SHA"
          echo "BACKUP=$BACKUP"
          echo 'RESULT=FUTURISTIC_STYLE_V2_UPDATED'
          REMOTE

      - name: Verify public widget and API
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP="$(mktemp)"
          curl -fsS 'https://sikhadenge.in/api/social-proof/live?widget=1&style=v2-20260902' -o "$TMP"
          grep -Fq 'font-family:Manrope,Inter' "$TMP"
          grep -Fq 'sdProofV2In' "$TMP"
          grep -Fq 'top:108px;' "$TMP"
          curl -fsS 'https://sikhadenge.in/api/social-proof/live?style=v2-20260902' | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("ok") is True and "latestRegistration" in d'
          echo 'PUBLIC_FUTURISTIC_STYLE_V2=PASS'
