name: Deploy Home Recent Registrations to Last 24 Hours 20260904
on:
  push:
    paths:
      - '.github/workflows/deploy-home-recent-registrations-last24-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Change only Recent registrations text
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/app/landing/page.tsx"
          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/var/tmp/sd-home-last24-$TS"
          BAK="/var/backups/sikhadenge/home-last24-$TS"
          STAGE="$LIVE/.next.home-last24-stage-$TS"
          OLDNEXT="$LIVE/.next.pre-home-last24-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT
          test -f "$SRC"
          test -f "$LIVE/.next/BUILD_ID"
          cp -a "$SRC" "$BAK/page.tsx.before"

          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.next*' \
            --exclude 'public' \
            --exclude 'data' \
            "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          ln -s "$LIVE/public" "$CAND/public"
          ln -s "$LIVE/data" "$CAND/data"
          NEWSRC="$CAND/app/landing/page.tsx"

          python3 - "$NEWSRC" "$SRC" <<'PY'
          from pathlib import Path
          import re,sys,difflib
          p=Path(sys.argv[1]); live=Path(sys.argv[2])
          before=p.read_text(encoding='utf-8')
          pattern=re.compile(r'Recent registrations',re.I)
          matches=list(pattern.finditer(before))
          print('EXACT_TEXT_MATCHES=',len(matches))
          if len(matches)!=1:
              raise SystemExit(f'guard failed: expected exactly 1 Recent registrations occurrence, found {len(matches)}')
          after,n=pattern.subn('Last 24 hours',before,count=1)
          if n!=1:
              raise SystemExit('replacement count guard failed')
          # Character-level containment guard: reverting the new literal must reconstruct original exactly.
          reconstructed=after.replace('Last 24 hours',matches[0].group(0),1)
          if reconstructed!=before:
              raise SystemExit('guard failed: change outside target text detected')
          p.write_text(after,encoding='utf-8')
          if live.read_text(encoding='utf-8')!=before:
              raise SystemExit('live source changed during candidate preparation')
          print('TEXT_CHANGE_ONLY=1')
          print('OLD_TEXT=',matches[0].group(0))
          print('NEW_TEXT=Last 24 hours')
          PY

          cd "$CAND"
          npm run build
          test -f "$CAND/.next/BUILD_ID"

          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]
          rm -rf "$STAGE"
          mv "$CAND/.next" "$STAGE"
          test -f "$STAGE/BUILD_ID"

          rollback(){
            echo ROLLBACK_START
            cp -a "$BAK/page.tsx.before" "$SRC" || true
            if [ -d "$LIVE/.next" ]; then
              rm -rf "$LIVE/.next.failed-home-last24-$TS"
              mv "$LIVE/.next" "$LIVE/.next.failed-home-last24-$TS" || true
            fi
            if [ -d "$OLDNEXT" ]; then mv "$OLDNEXT" "$LIVE/.next" || true; fi
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
          }

          cp -a "$NEWSRC" "$SRC"
          mv "$LIVE/.next" "$OLDNEXT"
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 6

          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?last24=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?last24=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then rollback; exit 1; fi

          python3 - "$SRC" "$P" <<'PY'
          from pathlib import Path
          import re,sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          html=Path(sys.argv[2]).read_text(encoding='utf-8',errors='ignore')
          if len(re.findall(r'Last 24 hours',src,re.I))!=1:
              raise SystemExit('source verification failed')
          if re.search(r'Recent registrations',src,re.I):
              raise SystemExit('old text still present in source')
          if 'Last 24 hours' not in html:
              raise SystemExit('public HTML verification failed: Last 24 hours not rendered')
          print('LIVE_TEXT_VERIFIED=1')
          PY

          rm -rf "$OLDNEXT"
          echo "BACKUP_SOURCE=$BAK/page.tsx.before"
          echo 'HOME_LAST24_LIVE_OK=1 TEXT_ONLY=1 OTHER_POINTS_UNTOUCHED=1'
          REMOTE
