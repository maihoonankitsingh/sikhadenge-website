name: Audit Claude Prehydrate Selector 20260903

on:
  push:
    branches: [audit/claude-responsive-20260903]
    paths: [.github/workflows/audit-claude-prehydrate-selector-20260903.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect raw server DOM with JavaScript disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          export CHROME
          cat > inspect.js <<'JS'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setJavaScriptEnabled(false);
            await p.goto('https://sikhadenge.in/masterclass/claude/free?v=prehydrate-selector-20260903',{waitUntil:'domcontentloaded',timeout:45000});
            const out=await p.evaluate(()=>{
              const norm=s=>String(s||'').replace(/\s+/g,' ').trim().toLowerCase();
              const h=[...document.querySelectorAll('h1,h2,h3')].find(e=>norm(e.textContent).includes('why ai-skilled professionals are moving ahead faster'));
              if(!h) return {found:false};
              const sec=h.closest('section')||h.parentElement;
              return {found:true,headingTag:h.tagName,headingClass:h.className,sectionTag:sec?.tagName,sectionId:sec?.id||'',sectionClass:sec?.className||'',sectionAttrs:sec?[...sec.attributes].map(a=>[a.name,a.value]):[],outer:(sec?.outerHTML||'').slice(0,1400)};
            });
            console.log(JSON.stringify(out,null,2)); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js
