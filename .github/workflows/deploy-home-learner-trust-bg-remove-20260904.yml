name: Deploy Home Learner Trust BG Remove 20260904
on:
  push:
    paths:
      - '.github/workflows/deploy-home-learner-trust-bg-remove-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Remove learner trust outer background only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/app/landing/page.tsx"
          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/var/tmp/sd-home-learner-bg-$TS"
          BAK="/var/backups/sikhadenge/home-learner-bg-$TS"
          STAGE="$LIVE/.next.home-learner-bg-stage-$TS"
          OLDNEXT="$LIVE/.next.pre-home-learner-bg-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT
          test -f "$SRC"
          test -f "$LIVE/.next/BUILD_ID"
          cp -a "$SRC" "$BAK/page.tsx.before"

          rsync -a --delete \
            --exclude 'node_modules' \
            --exclude '.next*' \
            --exclude 'public' \
            --exclude 'data' \
            "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          ln -s "$LIVE/public" "$CAND/public"
          ln -s "$LIVE/data" "$CAND/data"
          NEWSRC="$CAND/app/landing/page.tsx"

          python3 - "$NEWSRC" "$SRC" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); live=Path(sys.argv[2])
          before=p.read_text(encoding='utf-8')
          start=before.index('const LearnersSection = () => {')
          end=before.index('// ==================== SECTION 4:', start)
          head=before[:start]; sec=before[start:end]; tail=before[end:]

          old_outer='className="relative overflow-hidden rounded-[28px] border border-[#D8E5F6] bg-[linear-gradient(135deg,#F9FBFF_0%,#F3F7FF_52%,#EDF9FF_100%)] p-4 shadow-[0_16px_45px_rgba(15,23,42,0.07)] md:p-5"'
          new_outer='className="relative overflow-hidden rounded-[28px] border border-[#D8E5F6] bg-transparent p-4 shadow-[0_16px_45px_rgba(15,23,42,0.07)] md:p-5"'
          old_left='className="absolute -left-16 -top-20 h-52 w-52 rounded-full bg-[#2563EB]/10 blur-3xl"'
          new_left='className="absolute -left-16 -top-20 h-52 w-52 rounded-full bg-transparent blur-3xl"'
          old_right='className="absolute -right-20 -top-16 h-56 w-56 rounded-full bg-[#06B6D4]/10 blur-3xl"'
          new_right='className="absolute -right-20 -top-16 h-56 w-56 rounded-full bg-transparent blur-3xl"'
          old_bottom='className="absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-transparent via-[#2563EB]/35 to-transparent"'
          new_bottom='className="absolute inset-x-0 bottom-0 h-px bg-transparent"'

          pairs=[(old_outer,new_outer),(old_left,new_left),(old_right,new_right),(old_bottom,new_bottom)]
          for old,new in pairs:
              if sec.count(old) != 1:
                  raise SystemExit(f'guard failed: expected exactly one match for {old}')
              sec=sec.replace(old,new,1)

          after=head+sec+tail
          if head != after[:start] or tail != after[-len(tail):]:
              raise SystemExit('guard failed: content outside LearnersSection changed')
          for forbidden in [
              'bg-[linear-gradient(135deg,#F9FBFF_0%,#F3F7FF_52%,#EDF9FF_100%)]',
              'bg-[#2563EB]/10 blur-3xl',
              'bg-[#06B6D4]/10 blur-3xl',
              'via-[#2563EB]/35 to-transparent',
          ]:
              if forbidden in sec:
                  raise SystemExit(f'background token still present: {forbidden}')
          if sec.count('bg-transparent') < 4:
              raise SystemExit('transparent background verification failed')
          p.write_text(after,encoding='utf-8')
          if live.read_text(encoding='utf-8') != before:
              raise SystemExit('live source changed during candidate preparation')
          print('LEARNER_BG_LAYER_CHANGES=4')
          print('OUTER_PANEL_BG=transparent')
          print('DECORATIVE_GLOWS=transparent')
          print('CARDS_CONTENT_SPACING_UNCHANGED=1')
          PY

          cd "$CAND"
          npm run build
          test -f "$CAND/.next/BUILD_ID"

          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]
          rm -rf "$STAGE"
          mv "$CAND/.next" "$STAGE"
          test -f "$STAGE/BUILD_ID"

          rollback(){
            echo ROLLBACK_START
            cp -a "$BAK/page.tsx.before" "$SRC" || true
            if [ -d "$LIVE/.next" ]; then
              rm -rf "$LIVE/.next.failed-home-learner-bg-$TS"
              mv "$LIVE/.next" "$LIVE/.next.failed-home-learner-bg-$TS" || true
            fi
            if [ -d "$OLDNEXT" ]; then mv "$OLDNEXT" "$LIVE/.next" || true; fi
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
          }

          cp -a "$NEWSRC" "$SRC"
          mv "$LIVE/.next" "$OLDNEXT"
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 6

          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?learnerbg=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?learnerbg=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then rollback; exit 1; fi

          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          a=s.index('const LearnersSection = () => {')
          b=s.index('// ==================== SECTION 4:',a)
          sec=s[a:b]
          required=[
            'rounded-[28px] border border-[#D8E5F6] bg-transparent p-4',
            'absolute -left-16 -top-20 h-52 w-52 rounded-full bg-transparent blur-3xl',
            'absolute -right-20 -top-16 h-56 w-56 rounded-full bg-transparent blur-3xl',
            'absolute inset-x-0 bottom-0 h-px bg-transparent',
            'bg-white/95 p-3',
            '150,000+',
            'Learning Model',
          ]
          missing=[x for x in required if x not in sec]
          print('LIVE_LEARNER_BG_REQUIRED_MISSING=',missing)
          if missing: raise SystemExit('live learner background verification failed')
          print('LIVE_LEARNER_BG_REMOVED=1')
          PY

          rm -rf "$OLDNEXT"
          echo "BACKUP_SOURCE=$BAK/page.tsx.before"
          echo 'HOME_LEARNER_TRUST_BG_REMOVE_LIVE_OK=1 SECTION_ONLY=1 CARDS_UNTOUCHED=1 CONTENT_UNTOUCHED=1'
          REMOTE
