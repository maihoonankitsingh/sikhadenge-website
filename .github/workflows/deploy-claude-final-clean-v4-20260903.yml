name: Deploy Claude Final Clean V4 20260903

on:
  push:
    paths:
      - .github/workflows/deploy-claude-final-clean-v4-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"

      - name: Start clean candidate and verify loader
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail; export PM2_HOME=/root/.pm2
          C='/var/www/sikhadenge.in/candidates/claude-final-clean-v2-20260903'; A='sikhadenge-claude-final-clean-v2-3984'
          test "$(cat "$C/.next/BUILD_ID")" = 'LRGBmNz6chaBg6stHgoDb'; test -s /var/www/sikhadenge.in/claude-runtime-loader-v3.js; node --check /var/www/sikhadenge.in/claude-runtime-loader-v3.js
          pm2 delete "$A" >/dev/null 2>&1 || true; cd "$C"; PORT=3984 NODE_ENV=production pm2 start ./node_modules/.bin/next --name "$A" -- start -p 3984 >/dev/null
          for i in $(seq 1 30); do curl -fsS --max-time 3 'http://127.0.0.1:3984/masterclass/claude/free?v=v4-health' >/tmp/v4-health.html && break || true; sleep 1; done
          curl -fsS --max-time 10 'http://127.0.0.1:3984/masterclass/claude/free?v=v4-health2' >/tmp/v4-health.html
          grep -Fq '/__claude_final_v2/_next/static/' /tmp/v4-health.html
          REMOTE

      - name: Switch exact Claude route safely
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl'; C='/var/www/sikhadenge.in/candidates/claude-final-clean-v2-20260903'; BID='LRGBmNz6chaBg6stHgoDb'
          TS="$(TZ=Asia/Kolkata date +%Y%m%d-%H%M%S)"; B="/var/backups/sikhadenge/claude-final-clean-v4-$TS"; M='/var/backups/sikhadenge/.claude-final-clean-v4-last'; mkdir -p "$B"; cp "$NG" "$B/sikhadenge.in-ssl.before"; printf '%s\n' "$B" > "$M"
          python3 - "$NG" "$C" "$BID" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);c=sys.argv[2];bid=sys.argv[3];s=p.read_text();needle='location = /masterclass/claude/free {';a=s.find(needle)
          if a<0: raise SystemExit('exact route missing')
          d=0;b=None
          for i in range(a,len(s)):
              if s[i]=='{': d+=1
              elif s[i]=='}':
                  d-=1
                  if d==0: b=i+1; break
          seg=s[a:b]
          if 'proxy_pass http://127.0.0.1:3930;' not in seg: raise SystemExit('3930 proxy missing')
          if "sub_filter '</body>'" not in seg: raise SystemExit('body filter missing')
          seg=seg.replace('proxy_pass http://127.0.0.1:3930;','proxy_pass http://127.0.0.1:3984;',1)
          lines=[]
          for line in seg.splitlines():
              if "sub_filter '</body>'" in line:
                  ind=line[:len(line)-len(line.lstrip())]; line=ind+"sub_filter '</body>' '<script defer src=\"/claude-runtime-loader-v3.js?v=20260903-final-v4\"></script></body>';"
              lines.append(line)
          s=s[:a]+'\n'.join(lines)+s[b:]
          marker='# CLAUDE_FINAL_CLEAN_V4_ASSETS'
          block=f'''\n    {marker}\n    location = /claude-runtime-loader-v3.js {{ alias /var/www/sikhadenge.in/claude-runtime-loader-v3.js; add_header Cache-Control "no-store" always; }}\n    location ^~ /__claude_final_v2/_next/static/ {{ alias {c}/.next/static/; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }}\n    location ^~ /_next/data/{bid}/ {{ proxy_pass http://127.0.0.1:3984; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; add_header Cache-Control "private, no-store, no-cache, must-revalidate" always; }}\n'''
          s=s.replace('    location = /masterclass/claude/free {',block+'\n    location = /masterclass/claude/free {',1);p.write_text(s)
          PY
          nginx -t; systemctl reload nginx; sleep 2
          code="$(curl -sS -o /tmp/v4-public.html -w '%{http_code}' --retry 5 --retry-delay 1 --retry-connrefused --max-time 20 'https://sikhadenge.in/masterclass/claude/free?v=v4-public-smoke')"
          echo "PUBLIC_HTTP=$code BYTES=$(wc -c </tmp/v4-public.html) PREFIX=$(grep -c '/__claude_final_v2/_next/static/' /tmp/v4-public.html || true) LOADER=$(grep -c 'claude-runtime-loader-v3.js' /tmp/v4-public.html || true)"
          test "$code" = 200
          REMOTE

      - name: Browser parity and zero-hydration gate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1; npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          mkdir -p qa-v4
          cat > qa-v4/qa.js <<'JS'
          const puppeteer=require('puppeteer-core'),fs=require('fs');const N=s=>(s||'').replace(/\s+/g,' ').trim();
          const EH1='Master 25+ AI Tools for smarter work, faster execution & better results.';
          const EH2=['Why join this course?','Learn AI Tools by Doing — Live, Practical & Step-by-Step.','From first prompt to professional AI workflow.','Your first step into practical AI mastery.','AI & automation are reshaping hundreds of millions of jobs.',"AI isn't only changing jobs. It's increasing the value of AI skills.",'A complete practical starting kit for modern AI work.','Connect the right AI tool to the work you already do.','Move from quick answers to structured, reviewable work.','Use the right AI tool where speed, quality and structured output matter.','Practical teaching. Clear workflows. Real digital work.','Is this workshop for you?','Learn 25+ AI Tools','Real learners. Real experiences.','Learn AI. Apply it. Work smarter.','Frequently asked questions.','Your first AI workflow starts with one live session.','Trusted checkout experience'];
          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});const views=[['desktop',1440,1000,false],['laptop',1024,900,false],['tablet',768,1024,true],['mobile430',430,932,true],['mobile390',390,844,true]],out={},fail=[];
          for(const [n,w,h,m] of views){const p=await b.newPage();await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m,deviceScaleFactor:1});const errs=[],bad=[];p.on('pageerror',e=>errs.push(String(e)));p.on('console',x=>{if(x.type()==='error')errs.push(x.text())});p.on('response',r=>{if(r.status()>=400)bad.push({status:r.status(),url:r.url(),type:r.request().resourceType()})});await p.goto(`https://sikhadenge.in/masterclass/claude/free?v=v4-${n}-20260903`,{waitUntil:'domcontentloaded',timeout:45000});await new Promise(r=>setTimeout(r,15000));const x=await p.evaluate(()=>{const ids=[...document.querySelectorAll('[id]')].map(e=>e.id).filter(Boolean),host=document.getElementById('sd-sitewide-live-proof-host-v1'),hs=host?getComputedStyle(host):null;return{h1:(document.querySelector('main h1')?.innerText||document.querySelector('h1')?.innerText||'').replace(/\s+/g,' ').trim(),h2:[...document.querySelectorAll('main h2')].map(e=>(e.innerText||'').replace(/\s+/g,' ').trim()),h1c:document.querySelectorAll('main h1').length,sections:document.querySelectorAll('main section').length,jobs:document.querySelectorAll('#ai-video-job-impact-v80').length,skills:document.querySelectorAll('#ai-video-ai-opportunity-v85').length,proof:document.querySelectorAll('#claude-ai-video-proof-v4').length,testimonials:document.querySelectorAll('#sd-claude-testimonials-v305').length,loader:document.documentElement.getAttribute('data-claude-runtime-loader'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,blank:[...document.querySelectorAll('main section')].filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&r.height>=80&&(e.innerText||'').trim().length<8}).length,broken:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src),dups:[...new Set(ids.filter((v,i)=>ids.indexOf(v)!==i))],cta:[...document.querySelectorAll('a[href]')].some(a=>a.getAttribute('href')==='/gen-ai-masterclass/register-one-step'),live:host?{display:hs.display,visibility:hs.visibility,opacity:hs.opacity}:null};});const hyd=errs.filter(e=>/#418|#425|invariant=418|invariant=425/i.test(e));out[n]={...x,hydration:hyd,bad,errs};await p.screenshot({path:`qa-v4/${n}.png`,fullPage:true});await p.close();}
          for(const [n,x] of Object.entries(out)){if(x.hydration.length)fail.push(`${n}: hydration ${x.hydration.length}`);if(N(x.h1)!==EH1)fail.push(`${n}: h1 ${x.h1}`);if(JSON.stringify(x.h2)!==JSON.stringify(EH2))fail.push(`${n}: h2 ${JSON.stringify(x.h2)}`);if(x.h1c!==1||x.sections!==18)fail.push(`${n}: h1c/sections ${x.h1c}/${x.sections}`);if(x.jobs!==1||x.skills!==1||x.proof!==1||x.testimonials!==1)fail.push(`${n}: proof/testimonials ${x.jobs}/${x.skills}/${x.proof}/${x.testimonials}`);if(x.loader!=='v3-ready')fail.push(`${n}: loader ${x.loader}`);if(x.overflow||x.blank||x.broken.length||x.dups.length||!x.cta)fail.push(`${n}: structural overflow=${x.overflow} blank=${x.blank} broken=${x.broken.length} dups=${x.dups.length} cta=${x.cta}`);const critical=x.bad.filter(r=>['document','script','stylesheet'].includes(r.type));if(critical.length)fail.push(`${n}: critical ${JSON.stringify(critical)}`);if(n.startsWith('mobile')&&x.live&&x.live.display!=='none')fail.push(`${n}: live popup visible`);if(n==='desktop'&&(!x.live||x.live.display==='none'))fail.push('desktop: live popup missing');}
          fs.writeFileSync('qa-v4/result.json',JSON.stringify(out,null,2));console.log(JSON.stringify(Object.fromEntries(Object.entries(out).map(([n,x])=>[n,{hydration:x.hydration.length,h1:x.h1,h2:x.h2,sections:x.sections,jobs:x.jobs,skills:x.skills,testimonials:x.testimonials,loader:x.loader,overflow:x.overflow,blank:x.blank,broken:x.broken.length,dups:x.dups.length,live:x.live,bad:x.bad}])),null,2));if(fail.length){console.error('FAIL\n'+fail.join('\n'));process.exit(1)}console.log('FINAL_QA_PASS');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa-v4/qa.js

      - name: Lighthouse final
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail; npm install --silent lighthouse
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          npx lighthouse 'https://sikhadenge.in/masterclass/claude/free?v=v4-lh-mobile' --quiet --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa-v4/lh-mobile.json || true
          npx lighthouse 'https://sikhadenge.in/masterclass/claude/free?v=v4-lh-desktop' --quiet --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-v4/lh-desktop.json || true
          python3 - <<'PY'
          import json,os
          o={}
          for n in ('mobile','desktop'):
           p=f'qa-v4/lh-{n}.json'
           if os.path.exists(p):
            d=json.load(open(p));c=d['categories'];a=d['audits'];o[n]={'performance':round(c['performance']['score']*100),'accessibility':round(c['accessibility']['score']*100),'bestPractices':round(c['best-practices']['score']*100),'seo':round(c['seo']['score']*100),'FCP':a['first-contentful-paint']['displayValue'],'LCP':a['largest-contentful-paint']['displayValue'],'CLS':a['cumulative-layout-shift']['displayValue'],'TBT':a['total-blocking-time']['displayValue'],'transfer':a.get('total-byte-weight',{}).get('displayValue')}
          print('LIGHTHOUSE='+json.dumps(o,indent=2));json.dump(o,open('qa-v4/lighthouse-summary.json','w'),indent=2)
          PY

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail; export PM2_HOME=/root/.pm2; NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl';M='/var/backups/sikhadenge/.claude-final-clean-v4-last'
          if [[ -f "$M" ]]; then B="$(cat "$M")"; [[ -f "$B/sikhadenge.in-ssl.before" ]] && cp "$B/sikhadenge.in-ssl.before" "$NG" && nginx -t && systemctl reload nginx && echo "ROLLED_BACK=$B"; fi
          pm2 delete sikhadenge-claude-final-clean-v2-3984 >/dev/null 2>&1 || true; pm2 save >/dev/null 2>&1 || true
          REMOTE

      - name: Persist clean runtime
        if: success()
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'export PM2_HOME=/root/.pm2; pm2 save >/dev/null; pm2 status sikhadenge-claude-final-clean-v2-3984'

      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-final-clean-v4-qa
          path: qa-v4/
          retention-days: 3
