      - name: Lighthouse final technical measurement
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --silent lighthouse
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          npx lighthouse 'https://sikhadenge.in/masterclass/claude/free?v=v3-lh-mobile' --quiet --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa-v3/lighthouse-mobile.json || true
          npx lighthouse 'https://sikhadenge.in/masterclass/claude/free?v=v3-lh-desktop' --quiet --chrome-path="$CHROME" --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance,accessibility,best-practices,seo --preset=desktop --output=json --output-path=qa-v3/lighthouse-desktop.json || true
          python3 - <<'PY'
          import json,os
          out={}
          for n in ('mobile','desktop'):
              p=f'qa-v3/lighthouse-{n}.json'
              if not os.path.exists(p):continue
              d=json.load(open(p));c=d['categories'];a=d['audits'];out[n]={'performance':round(c['performance']['score']*100),'accessibility':round(c['accessibility']['score']*100),'bestPractices':round(c['best-practices']['score']*100),'seo':round(c['seo']['score']*100),'FCP':a['first-contentful-paint']['displayValue'],'LCP':a['largest-contentful-paint']['displayValue'],'CLS':a['cumulative-layout-shift']['displayValue'],'TBT':a['total-blocking-time']['displayValue'],'transfer':a.get('total-byte-weight',{}).get('displayValue')}
          print('LIGHTHOUSE_FINAL='+json.dumps(out,indent=2));json.dump(out,open('qa-v3/lighthouse-summary.json','w'),indent=2)
          PY

      - name: Roll back automatically if any final QA failed
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export PM2_HOME=/root/.pm2
          NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl';MARK='/var/backups/sikhadenge/.claude-final-clean-v3-last'
          if [[ -f "$MARK" ]]; then B="$(cat "$MARK")"; if [[ -f "$B/sikhadenge.in-ssl.before" ]]; then cp "$B/sikhadenge.in-ssl.before" "$NG"; nginx -t; systemctl reload nginx; echo "ROLLED_BACK=$B"; fi; fi
          pm2 delete sikhadenge-claude-final-clean-v2-3984 >/dev/null 2>&1 || true
          pm2 save >/dev/null 2>&1 || true
          REMOTE

