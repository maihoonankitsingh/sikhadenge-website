name: Audit Claude Post Funnel Payment 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-post-funnel-payment-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 15
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only Golden status
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          sikhadenge-funnel-lockctl check
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          /usr/local/sbin/sikhadenge-funnel-golden-guard --deep
          systemctl is-enabled sikhadenge-funnel-golden-guard.timer
          systemctl is-active sikhadenge-funnel-golden-guard.timer
          REMOTE

      - name: Browser audit final handoff and payment block
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const n=s=>(s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const bad=[]; p.on('response',r=>{const u=r.url();if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u)))bad.push(`${r.status()} ${u}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?post_funnel_audit=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,5000));
              const x=await p.evaluate(()=>{
                const norm=s=>(s||'').replace(/\s+/g,' ').trim();
                const body=norm(document.body.innerText); const main=document.querySelector('main'); const secs=[...document.querySelectorAll('main section')];
                const handoff=secs[17]||null;
                const payNeedles=['SECURE PAYMENT OPTIONS','Trusted checkout experience','UPI','Net Banking'];
                const matches=[];
                for(const el of [...document.querySelectorAll('body *')]){
                  const txt=norm(el.innerText); if(!txt) continue;
                  if(payNeedles.some(k=>txt===k||txt.startsWith(k))){const r=el.getBoundingClientRect(),cs=getComputedStyle(el);matches.push({tag:el.tagName,id:el.id||'',cls:el.className||'',text:txt.slice(0,500),display:cs.display,visibility:cs.visibility,opacity:cs.opacity,rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)},inMain:!!el.closest('main')});}
                }
                const scripts=[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/payment|checkout|registration|final-handoff|cta/.test(s));
                return {sections:secs.length,handoffFlag:handoff?.getAttribute('data-sd-claude-final-handoff-v1')||'',handoffText:norm(handoff?.innerText),paymentVisible:payNeedles.every(k=>body.includes(k)),matches:matches.slice(0,30),scripts,mainEndY:Math.round(main?.getBoundingClientRect().bottom||0),bodyOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              });
              console.log('POST_FUNNEL_AUDIT',name,JSON.stringify(x),'BAD',JSON.stringify(bad));
              if(x.sections!==18||x.handoffFlag!=='1'||x.bodyOverflow||bad.length) throw new Error(`post funnel audit fail ${name}`);
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
