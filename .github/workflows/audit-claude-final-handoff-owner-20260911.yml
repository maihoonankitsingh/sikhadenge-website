name: Audit Claude Final Handoff Owner 20260911

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-final-handoff-owner-20260911.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          test "$kt" = ssh-ed25519
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read-only owner trace
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '=== GOLDEN STATUS ==='
          sikhadenge-funnel-lockctl status | grep -E 'SEALED_AT|CLAUDE_PUBLIC_SHA|AI_PUBLIC_SHA|LOCK_STATE|LINKED_ASSETS|PROTECTED_SOURCE_FILES'
          echo '=== NGINX REFERENCES ==='
          grep -RFn 'claude-final-handoff-v1-20260910.js' /etc/nginx/sites-enabled /etc/nginx/snippets 2>/dev/null || true
          echo '=== LIKELY FILES ==='
          find /var/www/sikhadenge.in -maxdepth 3 -type f -name 'claude-final-handoff-v1-20260910.js' -print 2>/dev/null || true
          echo '=== PUBLIC ASSET ==='
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 30 'https://sikhadenge.in/claude-final-handoff-v1-20260910.js' -o /tmp/final-handoff-owner.js
          sha256sum /tmp/final-handoff-owner.js
          wc -c /tmp/final-handoff-owner.js
          head -c 12000 /tmp/final-handoff-owner.js
          echo
          REMOTE
