name: AI Video Sep4 V90.1 Main Recovery 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ai-video-sep4-golden-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect exact Nginx injection delta
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          curl -fsSL --max-time 15 'http://127.0.0.1:3940/masterclass/ai-video' -o /tmp/ai-upstream.html
          curl -fsSL --max-time 15 'https://sikhadenge.in/masterclass/ai-video?inj-diff=1' -o /tmp/ai-public.html
          echo "UPSTREAM_SHA=$(sha256sum /tmp/ai-upstream.html|awk '{print $1}') BYTES=$(wc -c </tmp/ai-upstream.html)"
          echo "PUBLIC_SHA=$(sha256sum /tmp/ai-public.html|awk '{print $1}') BYTES=$(wc -c </tmp/ai-public.html)"
          for f in /tmp/ai-upstream.html /tmp/ai-public.html; do
            echo "=== $f ==="
            echo "STYLES=$(grep -o '<style' "$f"|wc -l) SCRIPTS=$(grep -o '<script' "$f"|wc -l)"
            grep -Eo '<script[^>]+src="[^"]+"[^>]*></script>|<style[^>]*>[^<]{0,200}</style>' "$f" | grep -E 'funnel-attribution|social-proof|footer|ai-video' | tail -40 || true
          done
          echo '=== NGINX AI LOCATION + INCLUDE/SUB_FILTER ==='
          nginx -T 2>/dev/null | awk '
            /location = \/masterclass\/ai-video/ {show=1; depth=0}
            show {print; opens=gsub(/{/,"{"); closes=gsub(/}/,"}"); depth+=opens-closes; if(depth==0 && opens>0){exit}}
          ' || true
          echo '=== RELATED SUB_FILTERS ==='
          nginx -T 2>/dev/null | grep -nEi -A2 -B2 'funnel-attribution-bridge|social-proof/live\?widget|body footer\{display:none|masterclass/ai-video' | head -180 || true
          REMOTE