name: Audit AI Video Main Page Candidates 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ai-video-sep4-golden-20260910.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: whatsapp-agent-production
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          SSH_PORT="${SSH_PORT:-22}"; echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deep validate preserved GOLDEN ADS LIVE backup
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          rb='/root/ai-video-GOLDEN-ADS-LIVE-20260903-125516'
          g="$rb/ai-video.GOLDEN.html"
          l="$rb/live-page.html"
          sums="$rb/SHA256SUMS.txt"
          lock="$rb/LOCK-STATE.txt"
          [[ -f "$g" && -f "$l" && -f "$sums" && -f "$lock" ]]
          echo '=== LOCK STATE ==='; cat "$lock"
          echo '=== SAVED SHA256SUMS ==='; cat "$sums"
          echo '=== CURRENT SHA / STRUCTURE ==='
          for f in "$g" "$l"; do
            echo "FILE=$f"
            echo "SHA=$(sha256sum "$f" | awk '{print $1}') BYTES=$(wc -c <"$f") MTIME=$(stat -c '%y' "$f")"
            echo "STYLES=$(grep -o '<style' "$f" | wc -l) SCRIPTS=$(grep -o '<script' "$f" | wc -l) SECTIONS=$(grep -o '<section' "$f" | wc -l)"
            for m in 'Create cinematic AI videos' 'Everyone says AI will replace' '30 Crore' 'Six blocks' 'Understand the tools behind' 'One workflow' 'Real learners' 'Built for people who want' 'Questions before you join live' 'Trusted checkout experience' 'ai-video-audience-premium-v4-inline' 'ai-video-faq-premium-v3-inline' 'ai-video-ui-v91-inline'; do grep -Fqi "$m" "$f" && echo "YES|$m" || echo "NO|$m"; done
          done
          echo '=== GOLDEN STYLE IDS ==='
          grep -Eo 'id="[^"]*"' "$g" | grep -Ei 'ai-video|style|research|job|faq|audience|legibility|fluid|tablet' | sort -u | head -120 || true
          echo '=== STATIC DEPENDENCIES ==='
          python3 - "$g" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          vals=[]
          for pat in [r'<script[^>]+src="([^"]+)"',r'<link[^>]+href="([^"]+)"']:
              vals += re.findall(pat,s,re.I)
          for u in sorted(set(x for x in vals if x.startswith('/'))): print(u)
          PY
          echo '=== DEPENDENCY HTTP STATUS ==='
          python3 - "$g" <<'PY' >/tmp/golden-deps.txt
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); vals=[]
          for pat in [r'<script[^>]+src="([^"]+)"',r'<link[^>]+href="([^"]+)"']:
              vals += re.findall(pat,s,re.I)
          for u in sorted(set(x for x in vals if x.startswith('/'))): print(u)
          PY
          bad=0; total=0
          while IFS= read -r u; do
            total=$((total+1)); code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://sikhadenge.in$u" || true); echo "$code|$u"; [[ "$code" == 200 || "$code" == 204 || "$code" == 304 ]] || bad=$((bad+1));
          done </tmp/golden-deps.txt
          echo "DEPENDENCIES_TOTAL=$total BAD=$bad"
          echo '=== LIVE VS GOLDEN ==='
          curl -fsSL --max-time 15 'https://sikhadenge.in/masterclass/ai-video?audit=goldencompare' -o /tmp/live-current.html
          echo "LIVE_SHA=$(sha256sum /tmp/live-current.html | awk '{print $1}') LIVE_BYTES=$(wc -c </tmp/live-current.html) STYLES=$(grep -o '<style' /tmp/live-current.html | wc -l) SECTIONS=$(grep -o '<section' /tmp/live-current.html | wc -l)"
          echo '=== VALIDATION COMPLETE ==='
          REMOTE