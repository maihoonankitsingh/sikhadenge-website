name: Audit Recent Registrations Focused 20260904
on:
  push:
    paths:
      - '.github/workflows/audit-recent-registrations-focused-20260904.yml'
permissions:
  contents: read
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: whatsapp-agent-production
    steps:
      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Focused origin search
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          echo "LIVE=$LIVE"
          echo '=== NGINX CONFIG TOKENS ==='
          nginx -T 2>/dev/null | grep -niE 'recent|registrations|social-proof|activity' | head -200 || true
          echo '=== LIVE COMPILED CHUNKS PHRASE ==='
          grep -RIni --binary-files=without-match -m 20 -E 'recent registrations|registrations' "$LIVE/.next/static" 2>/dev/null | head -120 || true
          echo '=== SITEWIDE/HOT JS FILES ==='
          find /var/www/sikhadenge.in -maxdepth 4 -type f \( -name '*.js' -o -name '*.html' -o -name '*.conf' \) -size -3M \
            \( -path '*hot*' -o -path '*social*' -o -path '*inject*' -o -path '*registration*' -o -path '*snippet*' \) -print0 2>/dev/null \
            | xargs -0 grep -Ini --binary-files=without-match -m 5 -E 'recent|registrations' 2>/dev/null \
            | head -200 || true
          echo '=== SOCIAL PROOF SERVICE FILE ==='
          if [ -f /var/www/sikhadenge.in/social-proof-live/server.js ]; then
            grep -niE 'recent|registrations|label|24' /var/www/sikhadenge.in/social-proof-live/server.js | head -120 || true
          fi
          REMOTE
