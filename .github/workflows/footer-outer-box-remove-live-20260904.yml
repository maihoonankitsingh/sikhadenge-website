name: Footer Outer Box Remove Live 20260904
on:
  push:
    paths:
      - '.github/workflows/footer-outer-box-remove-live-20260904.yml'
permissions:
  contents: write
env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: whatsapp-agent-production
    steps:
      - name: Update footer source in GitHub
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/Footer.tsx')
          old = 'rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          new = 'p-6 sm:p-8 lg:p-10'
          s = p.read_text(encoding='utf-8')
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one footer outer-card class, found {s.count(old)}')
          s2 = s.replace(old, new)
          if s2.count(new) < 1:
              raise SystemExit('new footer wrapper class validation failed')
          p.write_text(s2, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- components/Footer.tsx | awk '{print $1+$2}')" = "2"
          git config user.name 'Sikhadenge Deploy Bot'
          git config user.email 'deploy-bot@sikhadenge.in'
          git add components/Footer.tsx
          git commit -m 'style: remove footer outer card box'
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "FOOTER_SOURCE_SYNCED=$SHA"

      - name: SSH setup
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${SSH_PORT:=22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy footer outer box removal only
        env:
          FOOTER_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "FOOTER_COMMIT='$FOOTER_COMMIT' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          export HOME=/root PM2_HOME=/root/.pm2
          : "${FOOTER_COMMIT:?missing FOOTER_COMMIT}"
          APP='sikhadenge-checkout-hotfix-3955-20260831-210229'
          OLD='rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          NEW='p-6 sm:p-8 lg:p-10'
          PID="$(pm2 pid "$APP" | tail -1)"
          LIVE="$(readlink -f /proc/$PID/cwd)"
          SRC="$LIVE/components/Footer.tsx"
          TS="$(date +%Y%m%d-%H%M%S)"
          CAND="/tmp/sd-footer-box-$TS"
          BAK="/var/backups/sikhadenge/footer-outer-box-$TS"
          STAGE="$LIVE/.next.footer-box-stage-$TS"
          ROLLBACK_STAGE="$LIVE/.next.footer-box-rollback-$TS"
          OLDNEXT="$LIVE/.next.pre-footer-box-$TS"
          mkdir -p "$CAND" "$BAK"
          trap 'rm -rf "$CAND"' EXIT

          test -f "$SRC"
          grep -Fq "$OLD" "$SRC"
          cp -a "$SRC" "$BAK/Footer.tsx.before"
          cp -a "$LIVE/.next" "$BAK/.next.before"

          rsync -a --delete --exclude node_modules --exclude .next "$LIVE/" "$CAND/"
          ln -s "$LIVE/node_modules" "$CAND/node_modules"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/$FOOTER_COMMIT/components/Footer.tsx" -o "$CAND/components/Footer.tsx"
          NEWSRC="$CAND/components/Footer.tsx"

          python3 - "$SRC" "$NEWSRC" <<'PY'
          from pathlib import Path
          import sys
          src, newp = map(Path, sys.argv[1:])
          before = src.read_text(encoding='utf-8')
          after = newp.read_text(encoding='utf-8')
          old = 'rounded-[30px] border border-slate-200/80 bg-white/85 p-6 shadow-[0_24px_70px_rgba(15,23,42,0.08)] backdrop-blur-sm sm:p-8 lg:p-10'
          new = 'p-6 sm:p-8 lg:p-10'
          if before.count(old) != 1:
              raise SystemExit('live old outer-card class count is not exactly one')
          expected = before.replace(old, new)
          if after != expected:
              raise SystemExit('guard failed: Footer diff is not outer-card-class-only')
          print('FOOTER_OUTER_BOX_ONLY_DIFF_OK=1')
          PY

          cd "$CAND"
          npm run build

          PID2="$(pm2 pid "$APP" | tail -1)"
          [ "$(readlink -f /proc/$PID2/cwd)" = "$LIVE" ]
          rm -rf "$STAGE" "$ROLLBACK_STAGE"
          cp -a "$CAND/.next" "$STAGE"
          cp -a "$BAK/.next.before" "$ROLLBACK_STAGE"
          test -f "$STAGE/BUILD_ID"
          test -f "$ROLLBACK_STAGE/BUILD_ID"

          rollback(){
            echo ROLLBACK_START
            cp -a "$BAK/Footer.tsx.before" "$SRC" || true
            if [ -d "$LIVE/.next" ]; then mv "$LIVE/.next" "$LIVE/.next.failed-footer-box-$TS" || true; fi
            if [ -d "$ROLLBACK_STAGE" ]; then mv "$ROLLBACK_STAGE" "$LIVE/.next" || true; else cp -a "$BAK/.next.before" "$LIVE/.next" || true; fi
            pm2 restart "$APP" --update-env || true
            echo ROLLBACK_DONE
          }

          cp -a "$NEWSRC" "$SRC"
          if [ -d "$LIVE/.next" ]; then mv "$LIVE/.next" "$OLDNEXT"; fi
          mv "$STAGE" "$LIVE/.next"
          pm2 restart "$APP" --update-env
          sleep 6

          D="$(mktemp)"; P="$(mktemp)"
          dc="$(curl -sS -o "$D" -w '%{http_code}' "http://127.0.0.1:3955/?footerbox=$TS" || true)"
          pc="$(curl -kLsS -o "$P" -w '%{http_code}' "https://sikhadenge.in/?footerbox=$TS" || true)"
          echo "DIRECT_HTTP=$dc PUBLIC_HTTP=$pc"
          if [ "$dc" != 200 ] || [ "$pc" != 200 ]; then rollback; exit 1; fi

          python3 - "$P" <<'PY'
          from pathlib import Path
          import sys
          html = Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
          old_markers = ['rounded-[30px]', 'shadow-[0_24px_70px_rgba(15,23,42,0.08)]', 'backdrop-blur-sm']
          if any(x in html for x in old_markers):
              raise SystemExit('old outer footer box marker still present in live HTML')
          required = ['instagram.com/sikhadenge.ai/', 'linkedin.com/company/sikhadenge', 'pinterest.com/sikhadenge', 'wa.me/918808505575', 'support@sikhadenge.in', '+91 88085 05575']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('missing preserved footer markers: ' + ', '.join(missing))
          print('LIVE_FOOTER_OUTER_BOX_REMOVED=1')
          PY

          echo "BACKUP=$BAK"
          echo "PREVIOUS_NEXT=$OLDNEXT"
          echo 'FOOTER_OUTER_BOX_LIVE_OK=1 FOOTER_ONLY=1 CLASS_ONLY=1'
          REMOTE
