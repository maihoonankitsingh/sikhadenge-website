name: Claude Proof Swap Inspect 20260902

on:
  push:
    paths:
      - .github/workflows/claude-proof-swap-inspect-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"
          fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect exact Claude runtime injection
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '===== ID ====='
          id
          echo '===== LIVE APP ====='
          LIVE_APP=/var/www/sikhadenge.in/sikhadenge-website-space
          test -d "$LIVE_APP"
          git -C "$LIVE_APP" rev-parse HEAD || true
          git -C "$LIVE_APP" status --short || true
          echo '===== PM2 ====='
          pm2 describe sikhadenge-in 2>/dev/null | sed -n '1,80p' || true
          echo '===== PUBLIC HTML MARKERS ====='
          HTML=/tmp/claude-proof-inspect.html
          curl -fsS --max-time 25 https://sikhadenge.in/masterclass/claude/free -o "$HTML"
          grep -Eo 'THE AI SHIFT|moving ahead faster|AI is changing the way professionals work|AI &amp; automation are reshaping|AI & automation are reshaping' "$HTML" | sort -u || true
          echo '===== FILES CONTAINING OLD AI SHIFT MARKERS ====='
          for root in /etc/nginx /var/www/sikhadenge.in /opt; do
            [[ -d "$root" ]] || continue
            grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
              -E 'THE AI SHIFT|moving ahead faster|AI is changing the way professionals work' "$root" 2>/dev/null | head -120 || true
          done
          echo '===== NGINX CLAUDE REFERENCES ====='
          grep -RIn --binary-files=without-match -E 'masterclass/claude/free|claude.*\.js|ai-shift' /etc/nginx 2>/dev/null | head -160 || true
          echo '===== SOURCE CLAUDE REFERENCES ====='
          grep -RIn --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
            -E 'THE AI SHIFT|moving ahead faster|AI is changing the way professionals work|ClaudeAiVideoProofSection' "$LIVE_APP" 2>/dev/null | head -160 || true
          REMOTE
