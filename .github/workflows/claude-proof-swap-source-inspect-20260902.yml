name: Claude Proof Swap Source Inspect 20260902

on:
  push:
    paths:
      - .github/workflows/claude-proof-swap-source-inspect-20260902.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect exact AI Video proof source and active Claude route
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo '===== ACTIVE NGINX CLAUDE ROUTE ====='
          nl -ba /etc/nginx/sites-enabled/sikhadenge.in-ssl | sed -n '1,115p'
          echo '===== ACTIVE NGINX INCLUDE TREE ====='
          nginx -T 2>/dev/null | grep -nE 'masterclass/claude/free|masterclass/ai-video|claude-assets|ai-video|proxy_pass|free-[0-9a-f].*\.js' | head -220 || true
          echo '===== LIVE RESPONSE HEADERS ====='
          echo '-- Claude --'; curl -fsSI https://sikhadenge.in/masterclass/claude/free | sed -n '1,70p'
          echo '-- AI Video --'; curl -fsSI https://sikhadenge.in/masterclass/ai-video | sed -n '1,70p'
          echo '===== AI VIDEO HTML MARKERS ====='
          AIV=/tmp/ai-video-proof-source.html
          curl -fsS --max-time 25 https://sikhadenge.in/masterclass/ai-video -o "$AIV"
          grep -Eo 'AI &amp; automation are reshaping[^<]{0,120}|AI & automation are reshaping[^<]{0,120}|hundreds of millions of jobs|AI isn[^<]{0,120}increasing the value of AI skills|10\.35M|\+69%|\+78M|30 Crore|40 Crore|9\.2 Crore' "$AIV" | sort -u || true
          echo '===== FILES CONTAINING EXACT AI VIDEO PROOF MARKERS ====='
          for root in /etc/nginx /var/www/sikhadenge.in /opt; do
            [[ -d "$root" ]] || continue
            grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git -E 'hundreds of millions of jobs|increasing the value of AI skills|10\.35M|30 Crore|40 Crore|9\.2 Crore' "$root" 2>/dev/null | head -180 || true
          done
          echo '===== FILE CONTEXT FOR AI VIDEO PROOF MARKERS ====='
          for f in $(for root in /etc/nginx /var/www/sikhadenge.in /opt; do [[ -d "$root" ]] || continue; grep -RIl --binary-files=without-match --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git -E 'hundreds of millions of jobs|increasing the value of AI skills|10\.35M' "$root" 2>/dev/null; done | awk '!seen[$0]++' | head -12); do
            [[ -f "$f" ]] || continue
            echo "--- $f ---"
            grep -nE -C 8 'hundreds of millions of jobs|increasing the value of AI skills|10\.35M|30 Crore|40 Crore|9\.2 Crore' "$f" 2>/dev/null | head -220 || true
          done
          echo '===== AI VIDEO SECTION HTML EXTRACT ====='
          python3 -c "from pathlib import Path; s=Path('/tmp/ai-video-proof-source.html').read_text(errors='ignore'); p=max(s.find('AI &amp; automation are reshaping'),s.find('AI & automation are reshaping'),s.find('hundreds of millions of jobs')); print('marker_pos=',p,'html_bytes=',len(s)); print(s[max(0,p-5000):min(len(s),p+30000)] if p>=0 else '')"
          echo '===== PROCESS / LISTENER SNAPSHOT ====='
          ps -eo user,pid,ppid,cmd --sort=pid | grep -E 'next|node|pm2|sikhadenge' | grep -v grep | tail -100 || true
          ss -ltnp | grep -E ':(3000|3001|3100|3400|3942|3971|4000|8080)\b' || true
          REMOTE
