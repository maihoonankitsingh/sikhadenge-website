name: Upgrade Next 15 lock and build

on:
  push:
    branches:
      - upgrade-next15-security-20260904
    paths:
      - package.json
      - package-lock.json
      - app/reviews/page.tsx
      - pages/contact.tsx
      - .github/workflows/upgrade-next15-lock-and-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: upgrade-next15-security-20260904
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply React 19 ref typing migration
        run: |
          python - <<'PY'
          from pathlib import Path

          reviews = Path('app/reviews/page.tsx')
          text = reviews.read_text()
          old = 'ref: React.RefObject<HTMLDivElement>,'
          new = 'ref: React.RefObject<HTMLDivElement | null>,'
          if old in text:
              reviews.write_text(text.replace(old, new, 1))

          contact = Path('pages/contact.tsx')
          text = contact.read_text()
          old = 'refs: React.RefObject<HTMLElement>[],'
          new = 'refs: React.RefObject<HTMLElement | null>[],'
          if old in text:
              contact.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit migration files
        run: |
          if git diff --quiet -- package-lock.json app/reviews/page.tsx pages/contact.tsx; then
            echo "Migration files already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/reviews/page.tsx pages/contact.tsx
          git commit -m "fix: migrate React 19 ref typings and lockfile"
          git push origin HEAD:upgrade-next15-security-20260904

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
