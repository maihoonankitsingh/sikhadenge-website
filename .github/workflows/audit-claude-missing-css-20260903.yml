name: Audit Claude Missing CSS 20260903

on:
  push:
    branches: [audit/claude-responsive-20260903]
    paths: [.github/workflows/audit-claude-missing-css-20260903.yml]

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"; KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; read -r _ kt km _ <<< "$SSH_HOST_KEY"; printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
      - name: Inspect CSS and upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo 'UPSTREAM:'
          curl -sS -o /dev/null -w '8522 upstream=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:3930/_next/static/css/8522be7a7183fcc0.css || true
          curl -sS -o /dev/null -w '02b3 upstream=%{http_code} bytes=%{size_download}\n' http://127.0.0.1:3930/_next/static/css/02b3bcaea76cb543.css || true
          echo 'FILES:'
          find / -type f -name '8522be7a7183fcc0.css' -o -name '02b3bcaea76cb543.css' 2>/dev/null | head -40
          echo 'APP ROOT CANDIDATES:'
          ps -ef | grep -E '3930|next|node' | grep -v grep | head -30 || true
          REMOTE
