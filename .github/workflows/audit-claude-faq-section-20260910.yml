name: Audit Claude FAQ Section 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-faq-section-20260910.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit live FAQ and owner script
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const [name,w,h,m] of [['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]]){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              const bad=[],errs=[]; p.on('pageerror',e=>errs.push(String(e))); p.on('response',r=>{const u=r.url(); if(r.status()>=400&&(/\.css(?:\?|$)/.test(u)||/\.js(?:\?|$)/.test(u))) bad.push(`${r.status()} ${u}`)});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?faq_audit=${name}-${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
              await new Promise(r=>setTimeout(r,4500));
              const x=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim();
                const sec=document.querySelector('section[data-sd-claude-faq-v2="1"]');
                const all=[...document.querySelectorAll('main section')];
                const idx=sec?all.indexOf(sec):-1;
                const rows=sec?[...sec.querySelectorAll('details')].map((d,i)=>({i:i+1,q:n(d.querySelector('summary')?.textContent),a:n(d.querySelector('p')?.textContent),open:d.open,summaryRect:(()=>{const r=d.querySelector('summary')?.getBoundingClientRect();return r?{w:Math.round(r.width),h:Math.round(r.height)}:null})()})):[];
                const r=sec?.getBoundingClientRect();
                return {found:!!sec,idx,sectionCount:all.length,faqCount:rows.length,rows,rect:r?{w:Math.round(r.width),h:Math.round(r.height)}:null,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,prev:idx>0?n(all[idx-1].innerText).slice(0,180):'',next:idx>=0&&idx<all.length-1?n(all[idx+1].innerText).slice(0,180):'',scripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/faq|closing|attribution/.test(s))};
              });
              console.log('FAQ_AUDIT',name,JSON.stringify(x),'BAD',JSON.stringify(bad),'ERROR_COUNT',errs.length);
              if(!x.found||x.faqCount!==15||x.sectionCount!==18||x.overflow||bad.length) throw new Error(`FAQ structural audit fail ${name}`);
              await p.close();
            }
            await b.close(); console.log('CLAUDE_FAQ_3VIEW_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 40 \
            'https://sikhadenge.in/claude-faq-v2.js?v=faq15-final2-20260904' -o /tmp/faq.js
          echo "FAQ_SCRIPT_SHA=$(sha256sum /tmp/faq.js | awk '{print $1}')"
          echo "FAQ_SCRIPT_BYTES=$(wc -c < /tmp/faq.js)"
          python3 - <<'PY'
          s=open('/tmp/faq.js',encoding='utf-8',errors='ignore').read()
          print('FAQ_SCRIPT_START')
          print(s[:30000])
          print('FAQ_SCRIPT_END')
          PY
