name: Audit Claude FAQ Section 20260910

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-claude-faq-section-20260910.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit live FAQ and owner script
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"; export CHROME
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage(); await p.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
            await p.goto(`https://sikhadenge.in/masterclass/claude/free?faq_evidence=${Date.now()}`,{waitUntil:'networkidle2',timeout:60000});
            await new Promise(r=>setTimeout(r,4500));
            const x=await p.evaluate(()=>{
              const n=s=>(s||'').replace(/\s+/g,' ').trim();
              const sec=document.querySelector('section[data-sd-claude-faq-v2="1"]');
              const all=[...document.querySelectorAll('main section')];
              const idx=sec?all.indexOf(sec):-1;
              const rows=sec?[...sec.querySelectorAll('details')].map((d,i)=>({i:i+1,q:n(d.querySelector('summary')?.textContent),a:n(d.querySelector('p')?.textContent),open:d.open})):[];
              const text=n(document.body.innerText);
              const terms=['8 PM','08:00 PM','2 Hour','2 hour','live','replay','recording','certificate','bonus','laptop','mobile','WhatsApp','whatsapp','email','Claude','paid course','subscription'];
              const evidence={}; for(const t of terms){const i=text.toLowerCase().indexOf(t.toLowerCase()); evidence[t]=i>=0?text.slice(Math.max(0,i-130),Math.min(text.length,i+260)):null;}
              return {found:!!sec,idx,sectionCount:all.length,faqCount:rows.length,rows,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,evidence,scripts:[...document.scripts].map(s=>s.src).filter(Boolean).filter(s=>/faq|closing|attribution/.test(s))};
            });
            console.log('FAQ_EVIDENCE',JSON.stringify(x));
            if(!x.found||x.faqCount!==15||x.sectionCount!==18||x.overflow) throw new Error('FAQ structural audit fail');
            await b.close(); console.log('CLAUDE_FAQ_EVIDENCE_AUDIT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 5 --max-time 40 \
            'https://sikhadenge.in/claude-faq-v2.js?v=faq15-final2-20260904' -o /tmp/faq.js
          echo "FAQ_SCRIPT_SHA=$(sha256sum /tmp/faq.js | awk '{print $1}')"
          echo "FAQ_SCRIPT_BYTES=$(wc -c < /tmp/faq.js)"
          python3 - <<'PY'
          s=open('/tmp/faq.js',encoding='utf-8',errors='ignore').read()
          print('FAQ_SCRIPT_START')
          print(s[:30000])
          print('FAQ_SCRIPT_END')
          PY
