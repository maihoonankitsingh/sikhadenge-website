name: Deploy Claude Proof Real Logos V1 20260903

on:
  push:
    paths:
      - .github/workflows/deploy-claude-proof-real-logos-v1-20260903.yml

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: whatsapp-agent-production
    steps:
      - name: Configure pinned SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PRIVATE_KEY"; test -n "$SSH_HOST_KEY"
          if [[ -z "${SSH_PORT:-}" ]]; then SSH_PORT=22; fi
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ key_type key_material _ <<< "$SSH_HOST_KEY"
          test "$key_type" = "ssh-ed25519"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$key_type" "$key_material" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy only Claude proof note/logo patch
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          export TZ=Asia/Kolkata
          NG=/etc/nginx/sites-enabled/sikhadenge.in-ssl
          ASSET=/var/www/sikhadenge.in/claude-proof-real-logos-v1.js
          SOURCE='https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/7de1429180d8b93509edbf2a51f06935f7aea47e/public/claude-proof-real-logos-v1.js'
          TS="$(date +%Y%m%d-%H%M%S)"
          BACKUP="/var/backups/sikhadenge/claude-proof-real-logos-v1-$TS"
          test -f "$NG"
          mkdir -p "$BACKUP"
          cp "$NG" "$BACKUP/sikhadenge.in-ssl.before"
          [[ ! -f "$ASSET" ]] || cp "$ASSET" "$BACKUP/claude-proof-real-logos-v1.js.before"

          rollback() {
            set +e
            cp "$BACKUP/sikhadenge.in-ssl.before" "$NG"
            if [[ -f "$BACKUP/claude-proof-real-logos-v1.js.before" ]]; then
              cp "$BACKUP/claude-proof-real-logos-v1.js.before" "$ASSET"
            else
              rm -f "$ASSET"
            fi
            nginx -t && systemctl reload nginx
          }
          trap 'rc=$?; echo "DEPLOY FAILED rc=$rc"; rollback; exit $rc' ERR

          TMP="$(mktemp)"
          curl -fsSL --max-time 30 "$SOURCE" -o "$TMP"
          grep -Fq '__CLAUDE_PROOF_REAL_LOGOS_V1__' "$TMP"
          grep -Fq 'Goldman_Sachs_logo.svg' "$TMP"
          grep -Fq 'McKinsey_and_Company_Logo_1.svg' "$TMP"
          grep -Fq 'World_Economic_Forum_logo.svg' "$TMP"
          grep -Fq 'PwC_Company_Logo.svg' "$TMP"
          grep -Fq 'ServiceNow_logo.svg' "$TMP"
          install -m 0644 "$TMP" "$ASSET"

          python3 - "$NG" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          route='location = /masterclass/claude/free {'
          start=s.find(route)
          if start < 0: raise SystemExit('Claude route not found')
          end=s.find('\n    }',start)
          if end < 0: raise SystemExit('Claude route end not found')
          end += len('\n    }')
          seg=s[start:end]

          script='<script src="/claude-proof-real-logos-v1.js?v=real-logos-note-remove-20260903"></script>'
          heading_b='<script src="/claude-heading-v11-restore-current.js?v=old-v11-current-20260903b"></script>'
          heading_a='<script src="/claude-heading-v11-restore-current.js?v=old-v11-current-20260903"></script>'
          theme='<script src="/claude-proof-theme-v2.js?v=claude-orange-theme-v2-20260902"></script>'
          if script not in seg:
              if heading_b in seg:
                  seg=seg.replace(heading_b,heading_b+script,1)
              elif heading_a in seg:
                  seg=seg.replace(heading_a,heading_a+script,1)
              elif theme in seg:
                  seg=seg.replace(theme,theme+script,1)
              else:
                  anchor="</body>';"
                  pos=seg.find(anchor)
                  if pos < 0: raise SystemExit('body injection anchor not found')
                  seg=seg[:pos]+script+seg[pos:]
          s=s[:start]+seg+s[end:]

          marker='# CLAUDE_PROOF_REAL_LOGOS_V1_ASSET'
          if marker not in s:
              block='''    # CLAUDE_PROOF_REAL_LOGOS_V1_ASSET
              location = /claude-proof-real-logos-v1.js {
                  alias /var/www/sikhadenge.in/claude-proof-real-logos-v1.js;
                  default_type application/javascript;
                  add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
                  access_log off;
              }
              # CLAUDE_PROOF_REAL_LOGOS_V1_ASSET_END

          '''
              idx=s.find(route)
              if idx < 0: raise SystemExit('could not place asset location')
              s=s[:idx]+block+s[idx:]
          p.write_text(s)
          PY

          nginx -t
          systemctl reload nginx
          sleep 1

          curl -fsS --max-time 20 https://sikhadenge.in/claude-proof-real-logos-v1.js | grep -Fq '__CLAUDE_PROOF_REAL_LOGOS_V1__'
          HTML="$(mktemp)"
          curl -fsS --max-time 20 'https://sikhadenge.in/masterclass/claude/free?v=real-logos-note-server' -o "$HTML"
          test "$(grep -o '/claude-proof-real-logos-v1.js?v=real-logos-note-remove-20260903' "$HTML" | wc -l)" -eq 1
          grep -Fq '/api/social-proof/live?widget=1' "$HTML"

          AI="$(mktemp)"
          curl -fsS --max-time 20 'https://sikhadenge.in/masterclass/ai-video?v=real-logos-isolation' -o "$AI"
          if grep -Fq '/claude-proof-real-logos-v1.js' "$AI"; then
            echo 'Claude logo patch leaked into AI Video source page'
            exit 1
          fi
          echo "BACKUP=$BACKUP"
          echo 'CLAUDE_REAL_LOGOS_SERVER_OK'
          trap - ERR
          REMOTE

      - name: Verify removed note and real logos in Chrome
        shell: bash
        run: |
          set -Eeuo pipefail
          for u in \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Goldman_Sachs_logo.svg' \
            'https://commons.wikimedia.org/wiki/Special:FilePath/McKinsey_and_Company_Logo_1.svg' \
            'https://commons.wikimedia.org/wiki/Special:FilePath/World_Economic_Forum_logo.svg' \
            'https://commons.wikimedia.org/wiki/Special:FilePath/PwC_Company_Logo.svg' \
            'https://commons.wikimedia.org/wiki/Special:FilePath/ServiceNow_logo.svg'; do
            LOGO_TMP="$(mktemp)"
            curl -fsSL --max-time 30 "$u" -o "$LOGO_TMP"
            grep -qi '<svg' "$LOGO_TMP"
          done

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          DOM="$RUNNER_TEMP/claude-real-logos.html"
          PNG="$RUNNER_TEMP/claude-real-logos-desktop.png"
          URL='https://sikhadenge.in/masterclass/claude/free?v=real-logos-note-final-20260903b'
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom "$URL" > "$DOM"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --hide-scrollbars --window-size=1440,7000 --screenshot="$PNG" "$URL"

          echo "note_count=$(grep -o 'class=\"sd-proof-v4-note\"' "$DOM" | wc -l || true)"
          echo "logo_wrappers=$(grep -o 'data-sd-real-brand-logo=\"1\"' "$DOM" | wc -l || true)"
          echo "logo_imgs=$(grep -o 'data-sd-real-logo=' "$DOM" | wc -l || true)"
          test "$(grep -o 'class=\"sd-proof-v4-note\"' "$DOM" | wc -l)" -eq 0
          test "$(grep -o 'data-sd-real-brand-logo=\"1\"' "$DOM" | wc -l)" -eq 6
          test "$(grep -o 'data-sd-real-logo=' "$DOM" | wc -l)" -eq 6
          grep -Fq 'aria-label="Goldman Sachs"' "$DOM"
          grep -Fq 'aria-label="McKinsey &amp; Company"' "$DOM"
          test "$(grep -o 'aria-label=\"World Economic Forum\"' "$DOM" | wc -l)" -eq 2
          grep -Fq 'aria-label="PwC"' "$DOM"
          grep -Fq 'aria-label="ServiceNow"' "$DOM"
          grep -Fq 'data-claude-proof-note-removed="1"' "$DOM"
          test -s "$PNG"
          cp "$PNG" "$GITHUB_WORKSPACE/claude-real-logos-desktop.png"
          echo 'CLAUDE_REAL_LOGOS_CHROME_OK'

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: claude-proof-real-logos-v1-qa
          path: claude-real-logos-desktop.png
          retention-days: 1
