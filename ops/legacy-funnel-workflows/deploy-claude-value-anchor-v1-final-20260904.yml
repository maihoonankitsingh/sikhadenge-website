name: Deploy Claude Value Anchor V1 Final 20260904

on:
  push:
    paths:
      - '.github/workflows/deploy-claude-value-anchor-v1-final-20260904.yml'

permissions:
  contents: read

env:
  SSH_HOST: ${{ secrets.WHATSAPP_PROD_HOST }}
  SSH_USER: ${{ secrets.WHATSAPP_PROD_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.WHATSAPP_PROD_SSH_PRIVATE_KEY }}
  SSH_HOST_KEY: ${{ secrets.WHATSAPP_PROD_SSH_HOST_KEY }}
  SSH_PORT: ${{ vars.WHATSAPP_PROD_SSH_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: whatsapp-agent-production
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${SSH_PORT:-}" ]] || SSH_PORT=22
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/prod"
          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"; else printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"
          read -r _ kt km _ <<< "$SSH_HOST_KEY"
          printf '[%s]:%s %s %s\n' "$SSH_HOST" "$SSH_PORT" "$kt" "$km" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy value anchor only
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl'
          ASSET='/var/www/sikhadenge.in/claude-value-anchor-v1.js'
          SOURCE='https://raw.githubusercontent.com/maihoonankitsingh/sikhadenge-website/84558bb96c1db1db057bcad7b2cdd6d1a2c3418a/public/claude-value-anchor-v1.js'
          TS="$(date +%Y%m%d-%H%M%S)"
          B="/var/backups/sikhadenge/claude-value-anchor-v1-final-$TS"
          M='/var/backups/sikhadenge/.claude-value-anchor-v1-final-last'
          mkdir -p "$B"
          cp "$NG" "$B/nginx.before"
          [[ ! -f "$ASSET" ]] || cp "$ASSET" "$B/asset.before"
          echo "$B" > "$M"
          rollback(){ set +e; cp "$B/nginx.before" "$NG"; if [[ -f "$B/asset.before" ]]; then cp "$B/asset.before" "$ASSET"; else rm -f "$ASSET"; fi; nginx -t && systemctl reload nginx; }
          trap 'rc=$?; rollback; exit $rc' ERR
          T="$(mktemp)"
          curl -fsSL --retry 3 "$SOURCE" -o "$T"
          grep -Fq '__CLAUDE_VALUE_ANCHOR_V1__' "$T"
          grep -Fq '₹999' "$T"
          install -m 0644 "$T" "$ASSET"
          node --check "$ASSET"
          python3 - "$NG" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(); route='location = /masterclass/claude/free {'; a=s.find(route)
          if a<0: raise SystemExit('route missing')
          q=s.find('{',a); d=0; b=None
          for i in range(q,len(s)):
              if s[i]=='{': d+=1
              elif s[i]=='}':
                  d-=1
                  if d==0: b=i+1; break
          if b is None: raise SystemExit('parse failed')
          seg=s[a:b]
          seg=re.sub(r'<script[^>]+src="/claude-value-anchor-v1\.js[^\"]*"[^>]*></script>','',seg)
          tag='<script defer src="/claude-value-anchor-v1.js?v=value-999-free-final-20260904"></script>'
          anchor="</body>';"; pos=seg.find(anchor)
          if pos<0: raise SystemExit('anchor missing')
          seg=seg[:pos]+tag+seg[pos:]
          s=s[:a]+seg+s[b:]
          if '# CLAUDE_VALUE_ANCHOR_V1_ASSET' not in s:
              block='''    # CLAUDE_VALUE_ANCHOR_V1_ASSET
              location = /claude-value-anchor-v1.js {
                  alias /var/www/sikhadenge.in/claude-value-anchor-v1.js;
                  default_type application/javascript;
                  add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
                  access_log off;
              }
              # CLAUDE_VALUE_ANCHOR_V1_ASSET_END

          '''
              idx=s.find(route); s=s[:idx]+block+s[idx:]
          p.write_text(s)
          PY
          nginx -t
          systemctl reload nginx
          sleep 2
          H="$(mktemp)"; A="$(mktemp)"
          curl -fsS 'https://sikhadenge.in/masterclass/claude/free?v=value-final-server' -o "$H"
          test "$(grep -o '/claude-value-anchor-v1.js?v=value-999-free-final-20260904' "$H" | wc -l)" -eq 1
          grep -Fq '/claude-cta-conversion-v1.js' "$H"
          grep -Fq '/gen-ai-masterclass/register-one-step' "$H"
          curl -fsS 'https://sikhadenge.in/masterclass/ai-video?v=value-final-isolation' -o "$A"
          ! grep -Fq '/claude-value-anchor-v1.js' "$A"
          echo "VALUE_FINAL_SERVER_PASS BACKUP=$B"
          trap - ERR
          REMOTE

      - name: Verify desktop tablet mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          export CHROME
          mkdir -p value-final-qa
          cat > value-final-qa/check.js <<'JS'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const compact=s=>(s||'').replace(/\s+/g,'');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const views=[['desktop',1440,1000,false],['tablet',768,1024,true],['mobile',390,844,true]],out={},fail=[];
            for(const [name,w,h,m] of views){
              const p=await b.newPage(); await p.setViewport({width:w,height:h,isMobile:m,hasTouch:m});
              await p.goto(`https://sikhadenge.in/masterclass/claude/free?v=value-final-${name}`,{waitUntil:'domcontentloaded',timeout:45000});
              await p.waitForFunction(()=>document.documentElement.getAttribute('data-claude-value-anchor')==='v1',{timeout:30000});
              await new Promise(r=>setTimeout(r,900));
              const x=await p.evaluate(()=>{
                const n=s=>(s||'').replace(/\s+/g,' ').trim(),reg='/gen-ai-masterclass/register-one-step';
                const s=document.querySelector('[data-sd-cta-sticky-v1="1"]'),pr=s?.querySelector('[data-sd-value-price-v1="1"]'),old=pr?.querySelector('.sd-value-old-v1'),fr=pr?.querySelector('.sd-value-free-v1'),ey=s?.querySelector('[data-sd-value-eyebrow-v1="1"]'),ct=[...document.querySelectorAll(`a[href="${reg}"]`)];
                const vis=ct.filter(a=>{const r=a.getBoundingClientRect(),c=getComputedStyle(a);return r.width&&r.height&&c.display!=='none'&&c.visibility!=='hidden'});
                return {marker:document.documentElement.getAttribute('data-claude-value-anchor'),ey:n(ey?.textContent),old:n(old?.textContent),fr:n(fr?.textContent),dec:old?getComputedStyle(old).textDecorationLine:'',disp:pr?getComputedStyle(pr).display:'',ct:ct.length,vis:vis.length,labels:ct.map(a=>n(a.textContent).replace(/→/g,'').trim()),h1:n(document.querySelector('h1')?.textContent),sections:document.querySelectorAll('main section').length,faq:document.querySelectorAll('section[data-sd-claude-faq-v2="1"] details').length,jobs:document.querySelectorAll('#ai-video-job-impact-v80').length,skills:document.querySelectorAll('#ai-video-ai-opportunity-v85').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              });
              out[name]=x; await p.evaluate(()=>scrollTo(0,document.documentElement.scrollHeight/2)); await new Promise(r=>setTimeout(r,300)); await p.screenshot({path:`value-final-qa/${name}.png`}); await p.close();
              if(x.marker!=='v1'||x.ey!=='MASTERCLASS VALUE'||x.old!=='₹999'||x.fr!=='FREE') fail.push(`${name}: value copy`);
              if(!x.dec.includes('line-through')||!['flex','inline-flex'].includes(x.disp)) fail.push(`${name}: value styling`);
              if(x.ct!==8||x.vis!==7||x.labels.some(v=>v!=='Reserve My Free Seat')) fail.push(`${name}: CTA regression`);
              if(compact(x.h1)!==compact('Master 25+ AI Tools for smarter work, faster execution & better results.')) fail.push(`${name}: H1 changed`);
              if(x.sections!==18||x.faq!==15||x.jobs!==1||x.skills!==1||x.overflow) fail.push(`${name}: page regression`);
            }
            fs.writeFileSync('value-final-qa/result.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
            if(fail.length){console.error(fail.join('\n'));process.exit(1)}
            console.log('CLAUDE_VALUE_ANCHOR_V1_FINAL_3VIEW_QA_PASS'); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node value-final-qa/check.js

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/prod" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e; NG='/etc/nginx/sites-enabled/sikhadenge.in-ssl'; ASSET='/var/www/sikhadenge.in/claude-value-anchor-v1.js'; M='/var/backups/sikhadenge/.claude-value-anchor-v1-final-last'; if [[ -f "$M" ]]; then B="$(cat "$M")"; cp "$B/nginx.before" "$NG"; if [[ -f "$B/asset.before" ]]; then cp "$B/asset.before" "$ASSET"; else rm -f "$ASSET"; fi; nginx -t && systemctl reload nginx; echo "ROLLED_BACK=$B"; fi
          REMOTE

      - name: Upload QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-value-anchor-v1-final-qa
          path: value-final-qa/
          retention-days: 3
          if-no-files-found: warn
