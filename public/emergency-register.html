<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Register for the SikhaDenge AI Masterclass</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#fff}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;color:#0f172a;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.logo{font-size:14px;font-weight:800;color:#2563eb;letter-spacing:.08em;text-transform:uppercase}.badge{display:inline-flex;margin-top:16px;padding:7px 11px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800}.card h1{margin:16px 0 8px;font-size:clamp(28px,6vw,42px);line-height:1.05;letter-spacing:-.04em}.sub{margin:0 0 22px;color:#64748b;line-height:1.6}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:0 0 6px;font-size:12px;font-weight:700;color:#334155}input,select{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;font:inherit;background:#fff;color:#0f172a;outline:none}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}button{width:100%;height:52px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-size:16px;font-weight:850;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.note{margin-top:12px;color:#64748b;font-size:11px;line-height:1.5}.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5}.msg.ok{display:block;background:#ecfdf5;color:#065f46}.msg.err{display:block;background:#fef2f2;color:#991b1b}@media(max-width:640px){.card{padding:22px;border-radius:20px}.row{grid-template-columns:1fr}.wrap{padding:14px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="logo">SikhaDenge</div>
      <div class="badge">FREE LIVE AI MASTERCLASS</div>
      <h1>Reserve your free seat.</h1>
      <p class="sub">Fill the form once. Your registration will be saved and joining updates will continue through the official SikhaDenge flow.</p>
      <form id="leadForm" class="grid" novalidate>
        <div><label for="name">Name *</label><input id="name" name="name" required autocomplete="name" placeholder="Enter your name" /></div>
        <div class="row">
          <div><label for="email">Email *</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" /></div>
          <div><label for="phone">WhatsApp number *</label><input id="phone" name="phone" required inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" /></div>
        </div>
        <div class="row">
          <div><label for="experience">Occupation *</label><select id="experience" name="experience" required><option value="">Select occupation</option><option>Salaried Professional</option><option>Self-Employed</option><option>Founder</option><option>Student</option><option>Others</option></select></div>
          <div><label for="goal">Goal *</label><select id="goal" name="goal" required><option value="">Select goal</option><option>Kickstart Career</option><option>Career Transition</option><option>Upskilling</option><option>Others</option></select></div>
        </div>
        <div><label for="laptop">Do you have a laptop? *</label><select id="laptop" name="laptop" required><option value="">Select</option><option value="true">Yes</option><option value="false">No</option></select></div>
        <button id="submitBtn" type="submit">Reserve My Free Seat</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
        <p class="note">By submitting, you agree to receive masterclass joining updates on the WhatsApp number you provide.</p>
      </form>
    </section>
  </main>
  <script>
    const form=document.getElementById('leadForm');
    const btn=document.getElementById('submitBtn');
    const msg=document.getElementById('msg');
    const params=new URLSearchParams(location.search);
    const keys=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id','utm_campaign_id','utm_adset_id','utm_ad_id','fbclid','gclid','msclkid'];
    form.addEventListener('submit',async(e)=>{
      e.preventDefault(); msg.className='msg'; msg.textContent='';
      const name=form.name.value.trim(), email=form.email.value.trim(), phone=form.phone.value.replace(/\D/g,'');
      if(!name||!email||phone.length<10||!form.experience.value||!form.goal.value||!form.laptop.value){msg.className='msg err';msg.textContent='Please complete all required fields with a valid mobile number.';return}
      const payload={name,email,phone,experience:form.experience.value,goal:form.goal.value,laptop:form.laptop.value,source:'website',page:'/gen-ai-masterclass/register-one-step',whatsappConsent:true,advertisingConsent:'denied',landingUrl:location.href,referrer:document.referrer||''};
      keys.forEach(k=>{payload[k]=params.get(k)||null});
      btn.disabled=true; btn.textContent='Registering…';
      try{
        const res=await fetch('/api/masterclass/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'Registration failed');
        msg.className='msg ok'; msg.innerHTML='<strong>Registration successful.</strong><br>Joining updates will be shared through the official SikhaDenge flow.';
        btn.textContent='Registered Successfully';
        form.querySelectorAll('input,select').forEach(el=>el.disabled=true);
      }catch(err){msg.className='msg err';msg.textContent=(err&&err.message)||'Something went wrong. Please try again.';btn.disabled=false;btn.textContent='Reserve My Free Seat'}
    });
  </script>
</body>
</html>
