<svg xmlns="http://www.w3.org/2000/svg" width="160" height="64" viewBox="0 0 160 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="158" height="62" rx="999" fill="url(#bg)" stroke="rgba(255,255,255,0.10)" />
  <circle cx="32" cy="32" r="18" fill="rgba(37,99,235,0.18)" filter="url(#glow)"/>
  <text x="32" y="37" text-anchor="middle" font-family="Inter, system-ui, Arial" font-size="14" fill="#FFFFFF" font-weight="700">SD</text>
  <text x="64" y="38" font-family="Inter, system-ui, Arial" font-size="14" fill="#B0B7C3" font-weight="600">Sikhadenge</text>
</svg>
